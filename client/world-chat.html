<!DOCTYPE html>  
<html lang="en">  
<head>  
<script>  
    const token = localStorage.getItem("token");  
    if (!token) {  
        window.location.href = "login.html";  
    }
</script>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
<title>World Chat</title>  
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">  
<style>  
    :root {  
        --bg-base: #0a0a0a;  
        --bg-card: #141414;  
        --accent-gold: #b59461;  
        --accent-red: #ff4d4d;  
        --text-main: #e0e0e0;  
        --my-chat-bg: rgba(181, 148, 97, 0.18);  
        --tick-blue: #34b7f1;
    }  

    * {   
        margin: 0; padding: 0; box-sizing: border-box;   
        font-family: 'Poppins', sans-serif;  
        -webkit-user-select: none; user-select: none;   
        -webkit-touch-callout: none;  
        -webkit-tap-highlight-color: transparent;
    }  

    @media print { body { display: none !important; } }  

    body {  
        background-color: var(--bg-base);  
        background-image: radial-gradient(at 0% 0%, rgba(30, 20, 16, 0.4) 0px, transparent 50%);  
        color: var(--text-main);  
        height: 100dvh; display: flex; flex-direction: column;   
        overflow: hidden; position: fixed; width: 100%;  
    }  

    header {  
        background: var(--bg-card); padding: 8px 16px;   
        display: flex; justify-content: space-between; align-items: center;   
        border-bottom: 1px solid rgba(181, 148, 97, 0.2); height: 75px;  
        z-index: 20;  
    }  

    .header-left {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
    }

    .home-btn {
        text-decoration: none;
        color: var(--accent-gold);
        font-size: 0.78rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border: 1px solid rgba(181, 148, 97, 0.35);
        border-radius: 20px;
        background: rgba(20, 20, 20, 0.7);
        transition: all 0.2s ease;
    }

    .home-btn:hover {
        background: var(--accent-gold);
        color: #000;
    }

    .back-btn {
        text-decoration: none;
        color: #a0a0a0;
        font-size: 0.68rem;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 2px 8px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        transition: all 0.2s ease;
        margin-top: 7px;
    }

    .back-btn:hover {
        color: var(--accent-gold);
        border-color: rgba(181, 148, 97, 0.4);
        background: rgba(181, 148, 97, 0.1);
    }

    .chat-title-trigger {
        font-family: 'Playfair Display', serif; 
        color: var(--accent-gold); 
        font-size: 1.05rem;
        cursor: pointer;
        padding: 6px 12px;
        border-radius: 8px;
        transition: transform 0.15s ease, background 0.2s ease;
        display: flex;
        align-items: center;
        gap: 5px;
        text-align: center;
    }

    .chat-title-trigger:hover {
        background: rgba(181, 148, 97, 0.1);
    }

    .chat-title-trigger:active {
        transform: scale(0.95);
    }

    .header-right { display: flex; align-items: center; gap: 10px; }  
      
    .user-profile-section {  
        display: flex; flex-direction: column; align-items: flex-end; gap: 4px;  
    }  

    .btn-group { display: flex; gap: 6px; }  

    .logout-btn, .clear-btn {  
        border: 1px solid var(--accent-gold); padding: 4px 10px;   
        border-radius: 5px; cursor: pointer; font-size: 0.68rem;   
        font-weight: 600; background: transparent; color: var(--accent-gold);  
    }  

    .clear-btn { border-color: var(--accent-red); color: var(--accent-red); }  

    /* --- 4. Username + Compact Connection Status Emoji --- */
    .user-conn-wrap {
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    #conn-status-dot {
        font-size: 0.52rem;
        line-height: 1;
        vertical-align: middle;
    }

    #messages {   
        flex: 1; overflow-y: auto; padding: 24px 15px 20px 15px;   
        display: flex; flex-direction: column; gap: 12px;  
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }  

    #messages li {  
        list-style: none; 
        padding: 7px 12px;   
        background: #1a1a1a;  
        border-radius: 12px 12px 12px 2px; 
        max-width: 78%;   
        min-width: 95px;
        width: fit-content; 
        border: 1px solid rgba(255,255,255,0.08);  
        display: flex; 
        flex-direction: column;  
        word-wrap: break-word;  
        font-size: 0.82rem; 
        line-height: 1.35;
        position: relative;
    }  

    #messages li.my-message {  
        align-self: flex-end;  
        background: #281e15;  
        border-color: rgba(181, 148, 97, 0.45);  
        border-radius: 12px 12px 2px 12px;  
    }  

    #messages li strong, 
    #messages li .sender-name,
    #messages li b:first-child {
        font-size: 0.68rem;
        color: var(--accent-gold);
        margin-bottom: 2px;
        font-weight: 600;
        display: block;
    }

    .msg-meta-ticks {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 5px;
        font-size: 0.62rem;
        color: #999;
        margin-top: 3px;
        align-self: flex-end;
        line-height: 1;
        position: relative;
        z-index: 30;
    }

    .tick-icon {
        font-size: 0.74rem;
        font-weight: bold;
        letter-spacing: -2px;
        color: #888;
    }

    .tick-icon.seen {
        color: var(--tick-blue) !important;
    }

    .msg-info-trigger, .info-btn {
        background: rgba(181, 148, 97, 0.15);
        border: 1px solid rgba(181, 148, 97, 0.4);
        color: var(--accent-gold);
        font-size: 0.7rem;
        width: 19px;
        height: 19px;
        border-radius: 50%;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        margin-left: 2px;
        position: relative;
        z-index: 50;
        transition: transform 0.15s ease, background 0.15s ease;
    }

    .msg-info-trigger:hover, .msg-info-trigger:active {
        background: var(--accent-gold);
        color: #000;
        transform: scale(1.1);
    }

    /* --- 1. Unsend Tablet (Hold on ⓘ Button) --- */
    .unsend-tablet {
        position: absolute;
        top: -28px;
        right: 0;
        background: #181818;
        border: 1px solid var(--accent-red);
        border-radius: 14px;
        padding: 3px 9px;
        display: none;
        align-items: center;
        gap: 4px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.9);
        z-index: 9999;
        white-space: nowrap;
        animation: popUnsend 0.15s ease-out;
    }

    #messages li:first-child .unsend-tablet {
        top: auto;
        bottom: -26px;
        right: 0;
    }

    .unsend-tablet.show {
        display: inline-flex;
    }

    @keyframes popUnsend {
        from { transform: scale(0.85); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .unsend-action-btn {
        background: transparent;
        border: none;
        color: var(--accent-red);
        font-size: 0.64rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 3px;
    }

    /* --- 2. Emoji Reaction Picker Bar (Hold on Any Message) --- */
    .reaction-picker-bar {
        position: absolute;
        top: -40px;
        background: #181818;
        border: 1px solid rgba(181, 148, 97, 0.5);
        border-radius: 30px;
        padding: 3px 8px;
        display: none;
        align-items: center;
        gap: 5px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.85);
        z-index: 9998;
        max-width: 260px;
        overflow-x: auto;
        scrollbar-width: none;
        animation: popUnsend 0.15s ease-out;
    }

    .reaction-picker-bar::-webkit-scrollbar {
        display: none;
    }

    #messages li.my-message .reaction-picker-bar {
        right: 0;
    }

    #messages li:not(.my-message) .reaction-picker-bar {
        left: 0;
    }

    #messages li:first-child .reaction-picker-bar {
        top: auto;
        bottom: -40px;
    }

    .reaction-picker-bar.show {
        display: flex;
    }

    .react-emoji-opt {
        font-size: 1.05rem;
        cursor: pointer;
        padding: 2px 3px;
        transition: transform 0.15s ease;
        flex-shrink: 0;
    }

    .react-emoji-opt:hover, .react-emoji-opt:active {
        transform: scale(1.3);
    }

    .msg-reaction-corner {
        position: absolute;
        bottom: -10px;
        background: #1f1b16;
        border: 1px solid rgba(181, 148, 97, 0.5);
        border-radius: 10px;
        padding: 1px 5px;
        font-size: 0.68rem;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        cursor: pointer;
        z-index: 40;
        box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    #messages li.my-message .msg-reaction-corner {
        left: 6px;
    }

    #messages li:not(.my-message) .msg-reaction-corner {
        right: 6px;
    }

    .reaction-detail-bubble {
        position: absolute;
        bottom: -34px;
        background: #141414;
        border: 1px solid var(--accent-gold);
        color: #fff;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 0.64rem;
        white-space: nowrap;
        display: none;
        align-items: center;
        gap: 5px;
        z-index: 9999;
        box-shadow: 0 4px 14px rgba(0,0,0,0.9);
    }

    #messages li.my-message .reaction-detail-bubble {
        left: 0;
    }

    #messages li:not(.my-message) .reaction-detail-bubble {
        right: 0;
    }

    .reaction-detail-bubble.show {
        display: inline-flex;
    }

    /* --- 3. Custom Gold Theme In-Chat Audio Player --- */
    .custom-chat-audio {
        display: flex;
        align-items: center;
        gap: 7px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(181, 148, 97, 0.35);
        padding: 5px 8px;
        border-radius: 18px;
        margin-top: 3px;
        min-width: 160px;
    }

    .custom-audio-play-btn {
        width: 25px;
        height: 25px;
        border-radius: 50%;
        border: none;
        background: var(--accent-gold);
        color: #000;
        font-size: 10px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .audio-wave-decor {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: 1;
        height: 14px;
    }

    .audio-wave-decor span {
        display: inline-block;
        width: 2.5px;
        background: rgba(181, 148, 97, 0.5);
        border-radius: 2px;
        transition: background 0.2s ease;
    }

    .custom-chat-audio.playing .audio-wave-decor span {
        background: var(--accent-gold);
        animation: waveBounce 0.6s infinite ease-in-out alternate;
    }

    @keyframes waveBounce {
        from { transform: scaleY(0.5); }
        to { transform: scaleY(1.25); }
    }

    .custom-audio-time {
        font-size: 0.64rem;
        color: var(--accent-gold);
        font-weight: 600;
        min-width: 26px;
        text-align: right;
    }

    /* --- Auto-Adjustable Custom Message Info Modal --- */
    .msg-info-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        z-index: 999999;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
    }

    .msg-info-modal-overlay.show {
        display: flex;
    }

    .msg-info-modal-box {
        background: #141414;
        border: 1px solid var(--accent-gold);
        border-radius: 12px;
        width: 100%;
        max-width: 280px;
        max-height: 78vh;
        display: flex;
        flex-direction: column;
        padding: 15px;
        box-shadow: 0 12px 32px rgba(0,0,0,0.9);
        color: var(--text-main);
        animation: fadeInModal 0.18s ease-out;
    }

    @keyframes fadeInModal {
        from { transform: scale(0.92); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .msg-info-header {
        font-family: 'Playfair Display', serif;
        color: var(--accent-gold);
        font-size: 1rem;
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(181, 148, 97, 0.25);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }

    .msg-info-body {
        overflow-y: auto;
        flex-grow: 1;
        padding-right: 2px;
    }

    .msg-info-row {
        font-size: 0.75rem;
        margin: 6px 0;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px dashed rgba(255,255,255,0.06);
        padding-bottom: 5px;
    }

    .msg-info-label {
        color: #aaa;
        font-weight: 500;
        flex-shrink: 0;
    }

    .msg-info-val {
        color: #fff;
        font-weight: 600;
        text-align: right;
        word-break: break-word;
    }

    .msg-info-close-btn {
        margin-top: 10px;
        width: 100%;
        background: var(--accent-gold);
        color: #000;
        border: none;
        padding: 7px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.76rem;
        cursor: pointer;
        text-transform: uppercase;
        flex-shrink: 0;
    }

    #messages li.screenshot-alert {
        align-self: center !important;
        background: rgba(18, 18, 18, 0.9) !important;
        border: 1px dashed rgba(181, 148, 97, 0.35) !important;
        color: var(--accent-gold) !important;
        font-size: 0.7rem !important;
        padding: 4px 12px !important;
        border-radius: 20px !important;
        font-style: italic;
        text-align: center;
        max-width: 90%;
        margin: 4px 0;
    }

    /* --- 3. Input Area & Hold-to-Record Voice Note UI --- */
    .input-area {  
        background: var(--bg-card); padding: 8px 10px;   
        display: flex; align-items: center; gap: 8px;  
        border-top: 1px solid rgba(181, 148, 97, 0.15);  
        padding-bottom: calc(8px + env(safe-area-inset-bottom));  
        position: relative;
        z-index: 20;
    }  

    #msg {  
        flex: 1; min-width: 0; background: rgba(255,255,255,0.05);   
        border: 1px solid rgba(181, 148, 97, 0.3); padding: 10px 14px;   
        border-radius: 25px; color: #fff; outline: none;   
        font-size: 0.88rem;
        user-select: text !important;  
        -webkit-user-select: text !important;
    }  

    .recording-bar {
        flex: 1;
        min-width: 0;
        display: none;
        align-items: center;
        justify-content: space-between;
        padding: 9px 14px;
        border-radius: 25px;
        background: rgba(255, 77, 77, 0.12);
        border: 1px solid rgba(255, 77, 77, 0.45);
        color: #fff;
        font-size: 0.8rem;
    }

    .recording-bar.show {
        display: flex;
    }

    .rec-dot {
        width: 9px;
        height: 9px;
        background: var(--accent-red);
        border-radius: 50%;
        display: inline-block;
        margin-right: 7px;
        animation: blinkRec 0.9s infinite alternate;
    }

    @keyframes blinkRec {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0.3; transform: scale(0.8); }
    }

    .audio-preview-bar {
        flex: 1;
        min-width: 0;
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 6px;
        border-radius: 25px;
        background: #1c1915;
        border: 1px solid var(--accent-gold);
    }

    .audio-preview-bar.show {
        display: flex;
    }

    .discard-audio-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid rgba(255, 77, 77, 0.45);
        background: rgba(255, 77, 77, 0.12);
        color: var(--accent-red);
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .preview-center-showcase {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 1;
        min-width: 0;
        justify-content: center;
        overflow: hidden;
    }

    .preview-play-toggle {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: none;
        background: rgba(181, 148, 97, 0.25);
        color: var(--accent-gold);
        font-size: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .imaginary-wave-line {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 16px;
        overflow: hidden;
    }

    .imaginary-wave-line i {
        display: inline-block;
        width: 2.5px;
        background: var(--accent-gold);
        border-radius: 2px;
        opacity: 0.75;
    }

    .preview-time-badge {
        font-size: 0.74rem;
        color: var(--accent-gold);
        font-weight: 600;
        flex-shrink: 0;
    }

    .send-audio-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        background: var(--accent-gold);
        color: #000;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .send-btn {  
        background: var(--accent-gold); border: none;   
        width: 40px; height: 40px; border-radius: 50%;   
        cursor: pointer; display: flex; align-items: center;   
        justify-content: center; flex-shrink: 0;
        touch-action: none;
        transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    }   

    .send-btn.recording-active {
        background: var(--accent-red);
        color: #fff;
        transform: scale(1.12);
        box-shadow: 0 0 16px rgba(255, 77, 77, 0.6);
    }

    .attach-btn {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: #202020;
        color: #b59461;
        font-size: 22px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        pointer-events: auto !important;
    }

    .attach-btn:active {
        transform: scale(.95);
    }

    .attach-menu {
        position: fixed;  
        bottom: 68px;  
        left: 12px;  
        background: #141414;  
        border: 1px solid rgba(181, 148, 97, .3);  
        border-radius: 16px;  
        padding: 10px;  
        display: none;  
        flex-direction: column;  
        gap: 8px;  
        z-index: 99999 !important;
        box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }

    .attach-menu.show {
        display: flex !important;
    }

    .attach-item {
        display: flex;  
        align-items: center;  
        gap: 10px;  
        color: white;  
        cursor: pointer;  
        padding: 6px 12px;  
        border-radius: 10px;
        font-size: 0.85rem;
    }

    .attach-item:hover {
        background: #202020;
    }

    .attach-icon {
        width: 34px;  
        height: 34px;  
        border-radius: 50%;  
        display: flex;  
        align-items: center;  
        justify-content: center;  
        background: #2a2a2a;  
        font-size: 16px;
        pointer-events: none;
    }

    .media-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 999999;
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    .media-overlay.show {
        display: flex;
        opacity: 1;
    }
    .media-overlay img {
        max-width: 90%;
        max-height: 80dvh;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        object-fit: contain;
    }
    .media-overlay iframe {
        width: 90%;
        height: 85dvh;
        border: none;
        background: #fff;
        border-radius: 12px;
    }
    .close-overlay-btn {
        position: absolute;
        top: 20px; right: 20px;
        background: rgba(255,255,255,0.1);
        border: 1px solid var(--accent-gold);
        color: var(--accent-gold);
        font-size: 1.5rem;
        width: 42px; height: 42px;
        border-radius: 50%;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
    }

    @media (max-width: 480px) {
        header { padding: 6px 12px; height: 70px; }
        .home-btn { font-size: 0.72rem; padding: 3px 8px; }
        .back-btn { font-size: 0.62rem; padding: 1px 6px; }
        .chat-title-trigger { font-size: 0.95rem; }
        #messages li { max-width: 82%; font-size: 0.8rem; }
    }
</style>
</head>  
<body oncontextmenu="return false;">  

<header>  
    <div class="header-left">  
        <a href="https://chat-room-three-pied.vercel.app/" class="home-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </a>  
        <a href="selection.html" class="back-btn">
            &#10094;
        </a>
    </div>

<script src="https://chat-backend-gtg5.onrender.com/socket.io/socket.io.js"></script>  
<script src="js/mediaManager.js"></script>
<script src="js/attachments.js"></script>  
<script src="script.js"></script>

<script>
    const ALLOWED_EMOJIS = ["👍", "👋🏻", "😁", "😅", "😃", "😄", "🤔", "🤧", "🙉", "🙈", "😭"];

    // Close menus/popups on outside click
    document.addEventListener("click", function(e) {
        const menu = document.getElementById("attachMenu");
        const btn = document.getElementById("attachBtn");
        if(menu && btn && !menu.contains(e.target) && e.target !== btn) {
            menu.classList.remove("show");
        }
        if (!e.target.closest(".unsend-tablet") && !e.target.closest(".msg-info-trigger")) {
            document.querySelectorAll(".unsend-tablet.show").forEach(el => el.classList.remove("show"));
        }
        if (!e.target.closest(".reaction-picker-bar")) {
            document.querySelectorAll(".reaction-picker-bar.show").forEach(el => el.classList.remove("show"));
        }
        if (!e.target.closest(".msg-reaction-corner") && !e.target.closest(".reaction-detail-bubble")) {
            document.querySelectorAll(".reaction-detail-bubble.show").forEach(el => el.classList.remove("show"));
        }
    });

    function formatAMPM(date) {
        let hours = date.getHours();
        let minutes = date.getMinutes();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        return hours + ':' + minutes + ' ' + ampm;
    }

    // =========================================================================
    // 4. CONNECTION STATUS INDICATOR BEHIND USERNAME (🟢 Connected / ⚫ Disconnected)
    // =========================================================================
    const connDotEl = document.getElementById("conn-status-dot");

    function updateConnIndicator() {
        if (!connDotEl) return;
        const isConnected = (typeof socket !== "undefined" && socket && socket.connected && navigator.onLine);
        connDotEl.textContent = isConnected ? "🟢" : "⚫";
        connDotEl.title = isConnected ? "Connected" : "Disconnected";
    }

    updateConnIndicator();
    setInterval(updateConnIndicator, 2000);
    window.addEventListener("online", updateConnIndicator);
    window.addEventListener("offline", updateConnIndicator);

    if (typeof socket !== "undefined" && socket) {
        socket.on("connect", updateConnIndicator);
        socket.on("disconnect", updateConnIndicator);
        socket.on("connect_error", updateConnIndicator);
    }

    // =========================================================================
    // BACKGROUND SWITCHER (Default 3rd Image = Index 2)
    // =========================================================================
    const chatBackgrounds = [
        "none",
        "linear-gradient(rgba(10, 10, 10, 0.75), rgba(10, 10, 10, 0.75)), url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1000&q=75')",
        "linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.8)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1000&q=75')",
        "linear-gradient(rgba(12, 10, 8, 0.78), rgba(12, 10, 8, 0.78)), url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1000&q=75')"
    ];

    let currentBgIndex = parseInt(localStorage.getItem("worldChatBgIndex") !== null ? localStorage.getItem("worldChatBgIndex") : "2", 10);
    const messagesBox = document.getElementById("messages");
    const bgSwitcherBtn = document.getElementById("bgSwitcherBtn");

    function applyChatBackground(index) {
        if (!messagesBox) return;
        messagesBox.style.backgroundImage = chatBackgrounds[index] || chatBackgrounds[2];
    }

    applyChatBackground(currentBgIndex);

    bgSwitcherBtn?.addEventListener("click", () => {
        currentBgIndex = (currentBgIndex + 1) % chatBackgrounds.length;
        localStorage.setItem("worldChatBgIndex", currentBgIndex);
        applyChatBackground(currentBgIndex);
    });

    // =========================================================================
    // STRICT USERNAME SANITIZER
    // =========================================================================
    function extractPureUsername(rawStr) {
        if (!rawStr) return "";
        let str = String(rawStr).trim().replace(/^@/, "");
        str = str.split(":")[0].trim();
        str = str.split(/\s+/)[0].trim();
        str = str.replace(/[^a-zA-Z0-9._]/g, "");
        return str.toLowerCase();
    }

    function getMyUsername() {
        const fromStorage = localStorage.getItem("username");
        if (fromStorage) return extractPureUsername(fromStorage);
        const fromDom = document.getElementById("display-username")?.textContent;
        return extractPureUsername(fromDom || "");
    }

    // =========================================================================
    // PERSISTENT STORES FOR SEEN, REACTIONS, UNSENT & VOICE AUDIO
    // =========================================================================
    let masterSeenStore = {};
    try {
        const rawStore = JSON.parse(localStorage.getItem("worldMasterSeenStore") || "{}");
        Object.keys(rawStore).forEach(msgId => {
            masterSeenStore[msgId] = {};
            const entry = rawStore[msgId] || {};
            Object.keys(entry).forEach(k => {
                const pureKey = extractPureUsername(k);
                if (pureKey && pureKey !== "you" && pureKey !== "system") {
                    if (!masterSeenStore[msgId][pureKey]) {
                        masterSeenStore[msgId][pureKey] = entry[k];
                    }
                }
            });
        });
        localStorage.setItem("worldMasterSeenStore", JSON.stringify(masterSeenStore));
    } catch(e) { masterSeenStore = {}; }

    let worldReactionsStore = {};
    try {
        worldReactionsStore = JSON.parse(localStorage.getItem("worldReactionsStore") || "{}");
    } catch(e) { worldReactionsStore = {}; }

    let worldUnsentIds = [];
    try {
        worldUnsentIds = JSON.parse(localStorage.getItem("worldUnsentIds") || "[]");
    } catch(e) { worldUnsentIds = []; }

    let worldAudioStore = {};
    try {
        worldAudioStore = JSON.parse(localStorage.getItem("worldAudioStore") || "{}");
    } catch(e) { worldAudioStore = {}; }

    let currentOpenInfoLi = null;

    function saveMasterSeen() {
        try { localStorage.setItem("worldMasterSeenStore", JSON.stringify(masterSeenStore)); } catch(e) {}
    }

    function saveWorldChatHistory() {
        if (messagesBox && messagesBox.innerHTML.trim() !== "") {
            localStorage.setItem("chat_history", messagesBox.innerHTML);
        }
    }

    // =========================================================================
    // MULTI-TOUCH TRACKER (Prevents 3-finger screenshot from clashing with holds)
    // =========================================================================
    let activeTouchCount = 0;
    let isMultiTouchGesture = false;
    let infoHoldTimer = null;
    let infoWasHeld = false;
    let msgBubbleHoldTimer = null;
    let sendHoldTimer = null;

    document.addEventListener("touchstart", (e) => {
        activeTouchCount = e.touches ? e.touches.length : 0;
        if (activeTouchCount > 1) {
            isMultiTouchGesture = true;
            clearTimeout(infoHoldTimer);
            clearTimeout(msgBubbleHoldTimer);
            clearTimeout(sendHoldTimer);
            infoWasHeld = false;
        } else {
            isMultiTouchGesture = false;
        }
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
        activeTouchCount = e.touches ? e.touches.length : 0;
        if (activeTouchCount === 0) {
            setTimeout(() => { isMultiTouchGesture = false; }, 80);
        }
    }, { passive: true });

    // =========================================================================
    // 1 & 2. UNSEND & EMOJI REACTION HANDLERS (Synced Globally via Socket)
    // =========================================================================
    window.onWorldInfoDown = function(e, msgId) {
        e.stopPropagation();
        if (isMultiTouchGesture || activeTouchCount > 1) return;
        infoWasHeld = false;
        clearTimeout(infoHoldTimer);
        infoHoldTimer = setTimeout(() => {
            if (isMultiTouchGesture || activeTouchCount > 1) return;
            infoWasHeld = true;
            document.querySelectorAll(".unsend-tablet.show").forEach(el => el.classList.remove("show"));
            const tab = document.getElementById(`unsend_tab_${msgId}`);
            if (tab) tab.classList.add("show");
        }, 420);
    };

    window.onWorldInfoUp = function(e) {
        e.stopPropagation();
        clearTimeout(infoHoldTimer);
    };

    window.onWorldInfoClick = function(e, msgId) {
        e.stopPropagation();
        clearTimeout(infoHoldTimer);
        if (isMultiTouchGesture) return;
        if (infoWasHeld) {
            infoWasHeld = false;
            return;
        }
        const tab = document.getElementById(`unsend_tab_${msgId}`);
        if (tab && tab.classList.contains("show")) {
            tab.classList.remove("show");
        } else {
            const li = document.querySelector(`li[data-id="${msgId}"]`);
            if (li) showWorldMsgInfo(li);
        }
    };

    function performWorldUnsendDOM(msgId) {
        if (!msgId) return;
        if (!worldUnsentIds.includes(msgId)) {
            worldUnsentIds.push(msgId);
            try { localStorage.setItem("worldUnsentIds", JSON.stringify(worldUnsentIds)); } catch(e) {}
        }
        const li = document.querySelector(`li[data-id="${msgId}"]`);
        if (li) {
            li.remove();
            saveWorldChatHistory();
        }
    }

    window.unsendWorldMessage = function(e, msgId) {
        e.stopPropagation();
        const li = document.querySelector(`li[data-id="${msgId}"]`);
        if (!li || !li.classList.contains("my-message")) return;

        performWorldUnsendDOM(msgId);
        // Broadcast unsend signal to all World Chat users via typing relay
        if (typeof socket !== "undefined" && socket) {
            socket.emit("typing", `__WORLD_UNSEND__:${msgId}:${getMyUsername()}`);
        }
    };

    window.onWorldMsgBubbleDown = function(e, msgId) {
        if (isMultiTouchGesture || activeTouchCount > 1) {
            clearTimeout(msgBubbleHoldTimer);
            return;
        }
        if (e.target.closest(".msg-info-trigger") || e.target.closest(".unsend-tablet") || e.target.closest(".reaction-picker-bar") || e.target.closest(".msg-reaction-corner") || e.target.closest(".custom-audio-play-btn")) {
            return;
        }
        clearTimeout(msgBubbleHoldTimer);
        msgBubbleHoldTimer = setTimeout(() => {
            if (isMultiTouchGesture || activeTouchCount > 1) return;
            document.querySelectorAll(".reaction-picker-bar.show").forEach(el => el.classList.remove("show"));
            const picker = document.getElementById(`react_picker_${msgId}`);
            if (picker) picker.classList.add("show");
        }, 420);
    };

    window.onWorldMsgBubbleUp = function() {
        clearTimeout(msgBubbleHoldTimer);
    };

    function renderReactionBadgeOnLi(li, msgId) {
        if (!li || !msgId) return;
        const oldCorner = li.querySelector(".msg-reaction-corner");
        const oldDetail = li.querySelector(".reaction-detail-bubble");
        if (oldCorner) oldCorner.remove();
        if (oldDetail) oldDetail.remove();

        const map = worldReactionsStore[msgId] || {};
        const entries = Object.entries(map).filter(([u, em]) => u && em);
        if (entries.length === 0) return;

        const emojisDisplay = entries.map(([u, em]) => em).join("");
        const detailsDisplay = entries.map(([u, em]) => `<span>${em} <b>@${u}</b></span>`).join(" • ");

        const corner = document.createElement("div");
        corner.className = "msg-reaction-corner";
        corner.onclick = (ev) => window.toggleWorldReactionDetail(ev, msgId);
        corner.innerHTML = emojisDisplay;

        const detail = document.createElement("div");
        detail.className = "reaction-detail-bubble";
        detail.id = `react_detail_${msgId}`;
        detail.onclick = (ev) => ev.stopPropagation();
        detail.innerHTML = detailsDisplay;

        li.appendChild(corner);
        li.appendChild(detail);
    }

    function applyWorldReaction(msgId, user, emoji) {
        const cleanU = extractPureUsername(user);
        if (!msgId || !cleanU) return;
        if (!worldReactionsStore[msgId]) worldReactionsStore[msgId] = {};

        if (!emoji) {
            delete worldReactionsStore[msgId][cleanU];
        } else {
            worldReactionsStore[msgId][cleanU] = emoji;
        }
        try { localStorage.setItem("worldReactionsStore", JSON.stringify(worldReactionsStore)); } catch(e) {}

        const li = document.querySelector(`li[data-id="${msgId}"]`);
        if (li) {
            renderReactionBadgeOnLi(li, msgId);
            saveWorldChatHistory();
        }
    }

    window.selectWorldMessageReaction = function(e, msgId, emoji) {
        e.stopPropagation();
        document.querySelectorAll(".reaction-picker-bar.show").forEach(el => el.classList.remove("show"));

        const myUser = getMyUsername();
        if (!myUser || !msgId) return;
        if (!worldReactionsStore[msgId]) worldReactionsStore[msgId] = {};

        const newEmoji = (worldReactionsStore[msgId][myUser] === emoji) ? "" : emoji;
        applyWorldReaction(msgId, myUser, newEmoji);

        // Broadcast reaction in real-time to all connected World Chat users
        if (typeof socket !== "undefined" && socket) {
            socket.emit("typing", `__WORLD_REACT__:${msgId}:${myUser}:${newEmoji}`);
        }
    };

    window.toggleWorldReactionDetail = function(e, msgId) {
        e.stopPropagation();
        const bubble = document.getElementById(`react_detail_${msgId}`);
        if (!bubble) return;
        const isShown = bubble.classList.contains("show");
        document.querySelectorAll(".reaction-detail-bubble.show").forEach(el => el.classList.remove("show"));
        if (!isShown) bubble.classList.add("show");
    };

    // =========================================================================
    // 3. HOLD SEND BUTTON FOR VOICE NOTE + PREVIEW BAR & CUSTOM AUDIO PLAYER
    // =========================================================================
    const PAPER_PLANE_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
    const MIC_ICON_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`;

    let isVoiceHoldActive = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let activeMicStream = null;
    let recTimerInterval = null;
    let recSeconds = 0;
    let pendingAudioBase64 = null;
    let pendingAudioDurationStr = "0:01";
    let previewAudioObj = new Audio();

    previewAudioObj.onended = () => {
        const btn = document.getElementById("previewPlayBtn");
        if (btn) btn.innerText = "▶";
    };

    window.handleWorldSendBtnDown = function(e) {
        e.preventDefault();
        if (isMultiTouchGesture || activeTouchCount > 1) return;
        isVoiceHoldActive = false;
        clearTimeout(sendHoldTimer);
        sendHoldTimer = setTimeout(() => {
            if (isMultiTouchGesture || activeTouchCount > 1) return;
            isVoiceHoldActive = true;
            startWorldVoiceRecording();
        }, 300);
    };

    window.handleWorldSendBtnUp = function(e) {
        e.preventDefault();
        clearTimeout(sendHoldTimer);
        if (isVoiceHoldActive) {
            stopWorldVoiceRecording();
            isVoiceHoldActive = false;
        } else if (!isMultiTouchGesture) {
            if (typeof window.handleSend === "function") window.handleSend();
        }
    };

    window.handleWorldSendBtnCancel = function() {
        clearTimeout(sendHoldTimer);
        if (isVoiceHoldActive) {
            stopWorldVoiceRecording();
            isVoiceHoldActive = false;
        }
    };

    async function startWorldVoiceRecording() {
        try {
            activeMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioChunks = [];
            pendingAudioBase64 = null;

            document.getElementById("mainSendBtn").classList.add("recording-active");
            document.getElementById("sendBtnIconWrap").innerHTML = MIC_ICON_SVG;
            document.getElementById("msg").style.display = "none";
            document.getElementById("audioPreviewBar").classList.remove("show");
            document.getElementById("recordingBar").classList.add("show");

            recSeconds = 0;
            pendingAudioDurationStr = "0:01";
            document.getElementById("recordingTimer").innerText = "0:00";
            clearInterval(recTimerInterval);
            recTimerInterval = setInterval(() => {
                recSeconds++;
                const mins = Math.floor(recSeconds / 60);
                const secs = recSeconds % 60;
                pendingAudioDurationStr = `${mins}:${secs < 10 ? '0' + secs : secs}`;
                document.getElementById("recordingTimer").innerText = pendingAudioDurationStr;
            }, 1000);

            mediaRecorder = new MediaRecorder(activeMicStream);
            mediaRecorder.ondataavailable = (evt) => {
                if (evt.data && evt.data.size > 0) audioChunks.push(evt.data);
            };

            mediaRecorder.onstop = () => {
                clearInterval(recTimerInterval);
                if (activeMicStream) {
                    activeMicStream.getTracks().forEach(t => t.stop());
                    activeMicStream = null;
                }
                document.getElementById("mainSendBtn").classList.remove("recording-active");
                document.getElementById("sendBtnIconWrap").innerHTML = PAPER_PLANE_SVG;
                document.getElementById("recordingBar").classList.remove("show");

                if (audioChunks.length === 0) {
                    document.getElementById("msg").style.display = "block";
                    return;
                }

                const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
                const reader = new FileReader();
                reader.onload = function(evt) {
                    pendingAudioBase64 = evt.target.result;
                    previewAudioObj.src = pendingAudioBase64;
                    document.getElementById("previewPlayBtn").innerText = "▶";
                    document.getElementById("previewDurationText").innerText = pendingAudioDurationStr;
                    document.getElementById("msg").style.display = "none";
                    document.getElementById("mainSendBtn").style.display = "none";
                    document.getElementById("audioPreviewBar").classList.add("show");
                };
                reader.readAsDataURL(audioBlob);
            };

            mediaRecorder.start();
        } catch (err) {
            isVoiceHoldActive = false;
            document.getElementById("mainSendBtn").classList.remove("recording-active");
            document.getElementById("sendBtnIconWrap").innerHTML = PAPER_PLANE_SVG;
            document.getElementById("recordingBar").classList.remove("show");
            document.getElementById("msg").style.display = "block";
            alert("Microphone permission allow karein!");
        }
    }

    function stopWorldVoiceRecording() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
        } else {
            clearInterval(recTimerInterval);
            if (activeMicStream) {
                activeMicStream.getTracks().forEach(t => t.stop());
                activeMicStream = null;
            }
            document.getElementById("mainSendBtn").classList.remove("recording-active");
            document.getElementById("sendBtnIconWrap").innerHTML = PAPER_PLANE_SVG;
            document.getElementById("recordingBar").classList.remove("show");
            document.getElementById("msg").style.display = "block";
        }
    }

    window.toggleWorldPreviewAudioPlay = function() {
        if (!pendingAudioBase64) return;
        const btn = document.getElementById("previewPlayBtn");
        if (previewAudioObj.paused) {
            previewAudioObj.play();
            if (btn) btn.innerText = "⏸";
        } else {
            previewAudioObj.pause();
            if (btn) btn.innerText = "▶";
        }
    };

    window.discardWorldRecordedAudio = function() {
        previewAudioObj.pause();
        previewAudioObj.src = "";
        pendingAudioBase64 = null;
        audioChunks = [];
        document.getElementById("audioPreviewBar").classList.remove("show");
        document.getElementById("msg").style.display = "block";
        document.getElementById("mainSendBtn").style.display = "flex";
    };

    window.sendWorldRecordedAudio = function() {
        if (!pendingAudioBase64 || typeof socket === "undefined" || !socket) return;
        const encodedText = `__VOICE_NOTE__::${pendingAudioDurationStr}::${pendingAudioBase64}`;
        socket.emit("sendMessage", {
            username: localStorage.getItem("username"),
            text: encodedText,
            time: typeof getCurrentTime === "function" ? getCurrentTime() : formatAMPM(new Date())
        });
        window.discardWorldRecordedAudio();
    };

    let activeWorldChatAudio = null;
    let activeWorldChatAudioId = null;

    window.toggleWorldCustomAudio = function(e, msgId) {
        e.stopPropagation();
        const li = document.querySelector(`li[data-id="${msgId}"]`);
        const audioSrc = (li && li.dataset.audioSrc) || worldAudioStore[msgId];
        if (!audioSrc) return;

        const wrap = document.getElementById(`custom_audio_${msgId}`);
        const btn = document.getElementById(`custom_audio_btn_${msgId}`);
        const timeEl = document.getElementById(`custom_audio_time_${msgId}`);
        const defaultDur = (li && li.dataset.audioDur) || "0:05";

        if (activeWorldChatAudio && activeWorldChatAudioId === msgId) {
            if (activeWorldChatAudio.paused) {
                activeWorldChatAudio.play();
                if (btn) btn.innerText = "⏸";
                if (wrap) wrap.classList.add("playing");
            } else {
                activeWorldChatAudio.pause();
                if (btn) btn.innerText = "▶";
                if (wrap) wrap.classList.remove("playing");
            }
            return;
        }

        if (activeWorldChatAudio) {
            activeWorldChatAudio.pause();
            const oldBtn = document.getElementById(`custom_audio_btn_${activeWorldChatAudioId}`);
            const oldWrap = document.getElementById(`custom_audio_${activeWorldChatAudioId}`);
            if (oldBtn) oldBtn.innerText = "▶";
            if (oldWrap) oldWrap.classList.remove("playing");
        }

        activeWorldChatAudio = new Audio(audioSrc);
        activeWorldChatAudioId = msgId;

        activeWorldChatAudio.ontimeupdate = () => {
            const sec = Math.floor(activeWorldChatAudio.currentTime || 0);
            const mins = Math.floor(sec / 60);
            const rem = sec % 60;
            if (timeEl) timeEl.innerText = `${mins}:${rem < 10 ? '0' + rem : rem}`;
        };

        activeWorldChatAudio.onended = () => {
            if (btn) btn.innerText = "▶";
            if (wrap) wrap.classList.remove("playing");
            if (timeEl) timeEl.innerText = defaultDur;
        };

        activeWorldChatAudio.play();
        if (btn) btn.innerText = "⏸";
        if (wrap) wrap.classList.add("playing");
    };

    // =========================================================================
    // MULTI-USER SEEN TRACKER & INFO MODAL
    // =========================================================================
    function recordUserSeenForMsg(msgId, rawUsers, timeStr) {
        if (!msgId || !rawUsers) return;
        const myUser = getMyUsername();
        const timeToUse = timeStr || formatAMPM(new Date());

        if (!masterSeenStore[msgId]) {
            masterSeenStore[msgId] = {};
        }

        let userArray = [];
        if (Array.isArray(rawUsers)) {
            userArray = rawUsers;
        } else if (typeof rawUsers === "string") {
            userArray = rawUsers.split(",");
        } else if (typeof rawUsers === "object") {
            userArray = Object.values(rawUsers);
        }

        let updated = false;
        userArray.forEach(u => {
            const cleanUser = extractPureUsername(u);
            if (!cleanUser || cleanUser === myUser || cleanUser === "system" || cleanUser === "you") return;

            if (!masterSeenStore[msgId][cleanUser]) {
                masterSeenStore[msgId][cleanUser] = timeToUse;
                updated = true;
            }
        });

        if (typeof seenMap !== "undefined") {
            seenMap[msgId] = Object.keys(masterSeenStore[msgId]);
        }

        const li = document.querySelector(`li[data-id="${msgId}"]`);
        if (li) {
            let domMap = {};
            try {
                const parsedDom = JSON.parse(li.dataset.seenTimes || "{}");
                Object.keys(parsedDom).forEach(k => {
                    const pureK = extractPureUsername(k);
                    if (pureK && pureK !== myUser && pureK !== "system" && pureK !== "you") {
                        if (!domMap[pureK]) domMap[pureK] = parsedDom[k];
                    }
                });
            } catch(e) { domMap = {}; }

            Object.keys(masterSeenStore[msgId]).forEach(u => {
                if (!domMap[u]) {
                    domMap[u] = masterSeenStore[msgId][u];
                    updated = true;
                } else {
                    masterSeenStore[msgId][u] = domMap[u];
                }
            });

            li.dataset.seenTimes = JSON.stringify(masterSeenStore[msgId]);

            if (Object.keys(masterSeenStore[msgId]).length > 0) {
                li.dataset.seen = "true";
                const tick = li.querySelector(".tick-icon");
                if (tick) {
                    tick.textContent = "✓✓";
                    tick.classList.add("seen");
                }
            }

            if (currentOpenInfoLi === li && document.getElementById("msgInfoModal").classList.contains("show")) {
                showWorldMsgInfo(li);
            }
        }

        if (updated) {
            saveMasterSeen();
        }
    }

    function markAllPreviousMyMessagesSeenBy(activeUsername) {
        const cleanUser = extractPureUsername(activeUsername);
        const myUser = getMyUsername();
        if (!cleanUser || cleanUser === myUser || cleanUser === "system" || cleanUser === "you" || !messagesBox) return;

        const nowTime = formatAMPM(new Date());
        messagesBox.querySelectorAll("li.my-message").forEach(li => {
            const msgId = li.dataset.id;
            if (msgId) {
                recordUserSeenForMsg(msgId, [cleanUser], nowTime);
            }
        });
    }

    function openMsgInfoModal(fromLabel, sentTime, statusText, seenTimeFormatted) {
        document.getElementById("infoFromVal").textContent = fromLabel;
        document.getElementById("infoSentVal").textContent = sentTime;
        document.getElementById("infoStatusVal").textContent = statusText;
        document.getElementById("infoSeenTimeVal").innerHTML = seenTimeFormatted;
        document.getElementById("msgInfoModal").classList.add("show");
    }

    function closeMsgInfoModal() {
        document.getElementById("msgInfoModal").classList.remove("show");
        currentOpenInfoLi = null;
    }

    function showWorldMsgInfo(li) {
        if (!li) return;
        const myUser = getMyUsername();
        const isMy = li.classList.contains("my-message");

        if (!isMy) return;

        currentOpenInfoLi = li;
        const senderLabel = `@${myUser} (You)`;
        const sentTime = li.dataset.sentTime || formatAMPM(new Date());
        const msgId = li.dataset.id;

        if (typeof seenMap !== "undefined" && msgId && seenMap[msgId]) {
            recordUserSeenForMsg(msgId, seenMap[msgId], li.dataset.seenAt || formatAMPM(new Date()));
        }

        let cleanCombinedMap = {};
        try {
            const rawDomMap = JSON.parse(li.dataset.seenTimes || "{}");
            Object.keys(rawDomMap).forEach(k => {
                const pureU = extractPureUsername(k);
                if (pureU && pureU !== myUser && pureU !== "system" && pureU !== "you") {
                    if (!cleanCombinedMap[pureU]) cleanCombinedMap[pureU] = rawDomMap[k];
                }
            });
        } catch(e) {}

        if (msgId && masterSeenStore[msgId]) {
            Object.keys(masterSeenStore[msgId]).forEach(k => {
                const pureU = extractPureUsername(k);
                if (pureU && pureU !== myUser && pureU !== "system" && pureU !== "you") {
                    if (!cleanCombinedMap[pureU]) cleanCombinedMap[pureU] = masterSeenStore[msgId][k];
                }
            });
        }

        const seenUsers = Object.keys(cleanCombinedMap);

        let seenStatusText = "Delivered ✓";
        let seenTimeHtml = "Nobody seen yet...";

        if (seenUsers.length > 0) {
            seenStatusText = seenUsers.map(u => `@${u}`).join(", ") + " ✓✓";

            seenTimeHtml = seenUsers.map(u => {
                const userSeenTime = cleanCombinedMap[u] || li.dataset.seenAt || formatAMPM(new Date());
                return `<div style="margin: 3px 0;"><b>@${u}</b> : ${userSeenTime}</div>`;
            }).join("");
        }

        openMsgInfoModal(senderLabel, sentTime, seenStatusText, seenTimeHtml);
    }

    window.showSeen = function(id) {
        const li = document.querySelector(`li[data-id="${id}"]`);
        if (li) {
            showWorldMsgInfo(li);
        } else {
            if (typeof seenMap !== "undefined" && seenMap[id]) {
                recordUserSeenForMsg(id, seenMap[id], formatAMPM(new Date()));
            }
            const userMap = masterSeenStore[id] || {};
            const users = Object.keys(userMap);
            const myUser = getMyUsername();
            const senderLabel = `You (@${myUser})`;
            const status = users.length > 0 ? users.map(u => `@${u}`).join(", ") + " ✓✓" : "Delivered ✓";
            const seenTime = users.length > 0 ? users.map(u => `<div style="margin: 3px 0;"><b>@${u}</b> : ${userMap[u]}</div>`).join("") : "Nobody seen yet...";
            openMsgInfoModal(senderLabel, formatAMPM(new Date()), status, seenTime);
        }
    };

    // =========================================================================
    // MESSAGE ENHANCER (Handles Voice Note Player, Reactions, Unsend, Ticks)
    // =========================================================================
    function enhanceSingleMessage(li) {
        if (!li || li.nodeType !== 1 || li.dataset.enhanced === "true") return;
        li.dataset.enhanced = "true";

        const rawText = (li.textContent || "").trim();
        const myUser = getMyUsername();

        if (rawText.toLowerCase().includes("screenshot") && !rawText.includes("__VOICE_NOTE__::")) {
            li.classList.add("screenshot-alert");
            li.classList.remove("my-message");
            
            let ssUser = myUser || "user";
            const match = rawText.match(/([a-zA-Z0-9._]+)\s+took\s+a\s+screenshot/i) || rawText.match(/@([a-zA-Z0-9._]+)/);
            if (match && match[1]) ssUser = extractPureUsername(match[1]);

            const timeMatch = rawText.match(/\b(\d{1,2}:\d{2}(?::\d{2})?\s?(?:AM|PM|am|pm)?)\b/);
            const ssTime = timeMatch ? timeMatch[1].toUpperCase() : formatAMPM(new Date());

            li.textContent = `@${ssUser}~Took A ScreenShot Of Chat • ${ssTime}`;
            return;
        }

        const timeMatch = rawText.match(/\b(\d{1,2}:\d{2}(?::\d{2})?\s?(?:AM|PM|am|pm)?)\b/);
        const msgTime = timeMatch ? timeMatch[1].toUpperCase() : formatAMPM(new Date());
        li.dataset.sentTime = msgTime;

        const existingInfoBtn = li.querySelector(".info-btn");
        if (existingInfoBtn) {
            const onclickAttr = existingInfoBtn.getAttribute("onclick") || "";
            const idMatch = onclickAttr.match(/showSeen\(['"]([^'"]+)['"]\)/);
            if (idMatch && idMatch[1]) {
                li.dataset.id = idMatch[1];
            }
            const parentTimeSpan = existingInfoBtn.parentElement;
            existingInfoBtn.remove();
            if (parentTimeSpan && parentTimeSpan !== li && parentTimeSpan.tagName === "SPAN" && !parentTimeSpan.querySelector("strong")) {
                parentTimeSpan.style.display = "none";
            }
        }

        if (!li.dataset.id) {
            li.dataset.id = "wmsg_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4);
        }

        const msgId = String(li.dataset.id).replace(/[^a-zA-Z0-9._-]/g, "");
        li.dataset.id = msgId;

        // If this message was unsent earlier, remove immediately
        if (worldUnsentIds.includes(msgId)) {
            li.remove();
            return;
        }

        let detectedSender = "";
        const nameNode = li.querySelector("strong, b, .sender, .username");
        if (nameNode) {
            detectedSender = extractPureUsername(nameNode.textContent);
        }

        let isMyMsg = li.classList.contains("my-message");
        if (!isMyMsg && myUser && detectedSender === myUser) {
            isMyMsg = true;
            li.classList.add("my-message");
        }

        li.dataset.sender = detectedSender || (isMyMsg ? myUser : "user");

        if (!isMyMsg && detectedSender && detectedSender !== myUser && detectedSender !== "system" && detectedSender !== "you") {
            markAllPreviousMyMessagesSeenBy(detectedSender);
        }

        if (isMyMsg) {
            const nameTags = li.querySelectorAll("strong, b, .sender, .username");
            let replaced = false;
            nameTags.forEach(el => {
                const txt = extractPureUsername(el.textContent);
                if (!myUser || txt === myUser || txt === "you") {
                    el.textContent = "You";
                    replaced = true;
                }
            });

            if (!replaced && myUser) {
                for (let node of li.childNodes) {
                    if (node.nodeType === 3) {
                        const regex = new RegExp(`^\\s*${myUser}\\s*:?`, "i");
                        if (regex.test(node.nodeValue)) {
                            node.nodeValue = node.nodeValue.replace(regex, "You:");
                            break;
                        }
                    }
                }
            }
        }

        // Convert __VOICE_NOTE__:: payload or cached custom audio into Custom Gold Theme Audio Player
        const contentSpan = li.querySelector("span:first-child");
        if (contentSpan && contentSpan.innerHTML.includes("__VOICE_NOTE__::")) {
            const rawHtml = contentSpan.innerHTML;
            const vnIndex = rawHtml.indexOf("__VOICE_NOTE__::");
            const prefixHtml = rawHtml.substring(0, vnIndex);
            const vnPayload = rawHtml.substring(vnIndex + "__VOICE_NOTE__::".length);
            const sepIndex = vnPayload.indexOf("::");
            if (sepIndex !== -1) {
                const dur = vnPayload.substring(0, sepIndex).trim() || "0:05";
                const b64 = vnPayload.substring(sepIndex + 2).trim();
                li.dataset.audioSrc = b64;
                li.dataset.audioDur = dur;
                worldAudioStore[msgId] = b64;
                try { localStorage.setItem("worldAudioStore", JSON.stringify(worldAudioStore)); } catch(e) {}

                contentSpan.innerHTML = `
                    ${prefixHtml}
                    <div class="custom-chat-audio" id="custom_audio_${msgId}">
                        <button type="button" class="custom-audio-play-btn" id="custom_audio_btn_${msgId}" onclick="toggleWorldCustomAudio(event, '${msgId}')">▶</button>
                        <div class="audio-wave-decor">
                            <span style="height:6px"></span><span style="height:12px"></span><span style="height:8px"></span><span style="height:14px"></span><span style="height:9px"></span><span style="height:15px"></span><span style="height:7px"></span><span style="height:13px"></span><span style="height:10px"></span><span style="height:6px"></span><span style="height:12px"></span><span style="height:8px"></span>
                        </div>
                        <span class="custom-audio-time" id="custom_audio_time_${msgId}">${dur}</span>
                    </div>
                `;
            }
        }

        // Bind Long-Press on Message Bubble for Emoji Reactions
        li.onpointerdown = (ev) => window.onWorldMsgBubbleDown(ev, msgId);
        li.onpointerup = () => window.onWorldMsgBubbleUp();
        li.onpointercancel = () => window.onWorldMsgBubbleUp();

        // Add Unsend Floating Tablet (Only for Sender)
        if (isMyMsg && !li.querySelector(".unsend-tablet")) {
            const unsendDiv = document.createElement("div");
            unsendDiv.className = "unsend-tablet";
            unsendDiv.id = `unsend_tab_${msgId}`;
            unsendDiv.innerHTML = `<button type="button" class="unsend-action-btn" onclick="unsendWorldMessage(event, '${msgId}')">🗑️ Unsend</button>`;
            li.appendChild(unsendDiv);
        }

        // Add Emoji Reaction Picker Bar
        if (!li.querySelector(".reaction-picker-bar")) {
            const pickerDiv = document.createElement("div");
            pickerDiv.className = "reaction-picker-bar";
            pickerDiv.id = `react_picker_${msgId}`;
            pickerDiv.onclick = (ev) => ev.stopPropagation();
            pickerDiv.innerHTML = ALLOWED_EMOJIS.map(em =>
                `<span class="react-emoji-opt" onclick="selectWorldMessageReaction(event, '${msgId}', '${em}')">${em}</span>`
            ).join("");
            li.appendChild(pickerDiv);
        }

        if (msgId) {
            if (typeof seenMap !== "undefined" && seenMap[msgId]) {
                recordUserSeenForMsg(msgId, seenMap[msgId], li.dataset.seenAt || msgTime);
            }
            if (masterSeenStore[msgId] && Object.keys(masterSeenStore[msgId]).length > 0) {
                li.dataset.seenTimes = JSON.stringify(masterSeenStore[msgId]);
                li.dataset.seen = "true";
            } else {
                li.dataset.seenTimes = "{}";
            }
        }

        const hasSeenUsers = (msgId && masterSeenStore[msgId] && Object.keys(masterSeenStore[msgId]).length > 0);

        const metaWrap = document.createElement("div");
        metaWrap.className = "msg-meta-ticks";

        if (isMyMsg) {
            metaWrap.innerHTML = `
                <span>${msgTime}</span>
                <span class="tick-icon ${hasSeenUsers ? 'seen' : ''}">${hasSeenUsers ? '✓✓' : '✓'}</span>
                <button type="button" class="msg-info-trigger" title="Tap: Info | Hold: Unsend"
                    onpointerdown="onWorldInfoDown(event, '${msgId}')"
                    onpointerup="onWorldInfoUp(event)"
                    onpointercancel="onWorldInfoUp(event)"
                    onclick="onWorldInfoClick(event, '${msgId}')">ⓘ</button>
            `;
        } else {
            metaWrap.innerHTML = `
                <span>${msgTime}</span>
                <span class="tick-icon ${hasSeenUsers ? 'seen' : ''}">${hasSeenUsers ? '✓✓' : '✓'}</span>
            `;
        }

        li.appendChild(metaWrap);

        // Render any existing reactions on this message
        renderReactionBadgeOnLi(li, msgId);
    }

    // Intercept script.js userTyping to handle real-time Unsend & Emoji Reaction signals silently
    if (typeof socket !== "undefined" && socket) {
        const rawListeners = socket.listeners("userTyping");
        socket.off("userTyping");

        socket.on("userTyping", (payload) => {
            if (!payload) return;
            const str = String(payload);

            // 1. Real-time Unsend Signal
            if (str.startsWith("__WORLD_UNSEND__:")) {
                const parts = str.split(":");
                const targetId = parts[1];
                if (targetId) performWorldUnsendDOM(targetId);
                return;
            }

            // 2. Real-time Emoji Reaction Signal
            if (str.startsWith("__WORLD_REACT__:")) {
                const parts = str.split(":");
                const targetId = parts[1];
                const reactUser = parts[2];
                const emoji = parts.slice(3).join(":");
                if (targetId && reactUser) {
                    applyWorldReaction(targetId, reactUser, emoji);
                }
                return;
            }

            // Ignore Private-Chat presence pings so they don't show as typing in World Chat
            if (str.startsWith("__ONLINE__:") || str.startsWith("__OFFLINE__:") || str.startsWith("__PRESENCE_")) {
                const who = str.split(":")[1];
                if (who) markAllPreviousMyMessagesSeenBy(who);
                return;
            }

            // Normal typing: mark previous messages seen & run original script.js typing UI
            markAllPreviousMyMessagesSeenBy(str);
            rawListeners.forEach(fn => fn(payload));
        });

        socket.on("connect", () => {
            updateConnIndicator();
            const myUser = getMyUsername();
            if (!myUser || !messagesBox) return;
            messagesBox.querySelectorAll("li:not(.my-message):not(.screenshot-alert)").forEach(li => {
                const msgId = li.dataset.id;
                if (msgId) {
                    socket.emit("messageSeen", { messageId: msgId, username: myUser });
                }
            });
        });

        socket.on("updateSeen", (payload) => {
            if (!payload) return;
            const messageId = payload.messageId || payload._id || payload.id;
            const seenBy = payload.seenBy || payload.username || payload.users;
            if (messageId && seenBy) {
                recordUserSeenForMsg(messageId, seenBy, formatAMPM(new Date()));
            }
        });

        socket.on("chatCleared", () => {
            masterSeenStore = {};
            worldReactionsStore = {};
            worldUnsentIds = [];
            worldAudioStore = {};
            localStorage.removeItem("worldMasterSeenStore");
            localStorage.removeItem("worldReactionsStore");
            localStorage.removeItem("worldUnsentIds");
            localStorage.removeItem("worldAudioStore");
        });
    }

    if (messagesBox) {
        messagesBox.querySelectorAll("li").forEach(li => {
            li.removeAttribute("data-enhanced");
            const oldMeta = li.querySelector(".msg-meta-ticks");
            if (oldMeta) oldMeta.remove();
            const oldUnsend = li.querySelector(".unsend-tablet");
            if (oldUnsend) oldUnsend.remove();
            const oldPicker = li.querySelector(".reaction-picker-bar");
            if (oldPicker) oldPicker.remove();
            enhanceSingleMessage(li);
        });

        const fastObserver = new MutationObserver((mutations) => {
            for (const m of mutations) {
                for (const node of m.addedNodes) {
                    if (node.nodeName === "LI") {
                        enhanceSingleMessage(node);
                    }
                }
            }
            saveWorldChatHistory();
        });

        fastObserver.observe(messagesBox, { childList: true, subtree: false });
    }
</script>
