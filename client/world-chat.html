<!DOCTYPE html>  <html lang="en">  
<head>  
    <!--  -->  
<script>  
    const token = localStorage.getItem("token");  if (!token) {  
    window.location.href = "login.html";  
}
</script>  <meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
<title>Secure Ultra Chat</title>  
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">  
<style>  
    :root {  
        --bg-base: #0a0a0a;  
        --bg-card: #141414;  
        --accent-gold: #b59461;  
        --accent-red: #ff4d4d;  
        --text-main: #e0e0e0;  
        --my-chat-bg: rgba(181, 148, 97, 0.15);  
    }  

    /* SECURITY & UI RESET */  
    * {   
        margin: 0; padding: 0; box-sizing: border-box;   
        font-family: 'Poppins', sans-serif;  
        -webkit-user-select: none; user-select: none;   
        -webkit-touch-callout: none;  
    }  

    @media print { body { display: none !important; } }  

    body {  
        background-color: var(--bg-base);  
        background-image: radial-gradient(at 0% 0%, rgba(30, 20, 16, 0.4) 0px, transparent 50%);  
        color: var(--text-main);  
        height: 100dvh; display: flex; flex-direction: column;   
        overflow: hidden; position: fixed; width: 100%;  
    }  

    header {  
        background: var(--bg-card); padding: 10px 20px;   
        display: flex; justify-content: space-between; align-items: center;   
        border-bottom: 1px solid rgba(181, 148, 97, 0.2); height: 75px;  
        z-index: 10;  
    }  

    .header-right { display: flex; align-items: center; gap: 12px; }  
      
    .user-profile-section {  
        display: flex; flex-direction: column; align-items: flex-end; gap: 4px;  
    }  

    .btn-group { display: flex; gap: 8px; }  

    .logout-btn, .clear-btn {  
        border: 1px solid var(--accent-gold); padding: 4px 10px;   
        border-radius: 5px; cursor: pointer; font-size: 0.7rem;   
        font-weight: 600; background: transparent; color: var(--accent-gold);  
    }  

    .clear-btn { border-color: var(--accent-red); color: var(--accent-red); }  

    #messages {   
        flex: 1; overflow-y: auto; padding: 15px;   
        display: flex; flex-direction: column; gap: 12px;  
        scroll-behavior: smooth;  
    }  

    #messages li {  
        list-style: none; padding: 10px 15px;   
        background: rgba(255, 255, 255, 0.07);  
        border-radius: 15px 15px 15px 2px; max-width: 85%;   
        width: fit-content; border: 1px solid rgba(255,255,255,0.05);  
        display: flex; flex-direction: column;  
        word-wrap: break-word;  
    }  

    #messages li.my-message {  
        align-self: flex-end;  
        background: var(--my-chat-bg);  
        border-color: var(--accent-gold);  
        border-radius: 15px 15px 2px 15px;  
    }  

    .input-area {  
        background: var(--bg-card); padding: 10px 12px;   
        display: flex; align-items: center; gap: 10px;  
        border-top: 1px solid rgba(181, 148, 97, 0.1);  
        padding-bottom: calc(10px + env(safe-area-inset-bottom));  
        position: relative;
    }  

    #msg {  
        flex: 1; min-width: 0; background: rgba(255,255,255,0.05);   
        border: 1px solid rgba(181, 148, 97, 0.3); padding: 12px 18px;   
        border-radius: 25px; color: #fff; outline: none;   
        user-select: text !important;  
        -webkit-user-select: text !important;
    }  

    .send-btn {  
        background: var(--accent-gold); border: none;   
        width: 45px; height: 45px; border-radius: 50%;   
        cursor: pointer; display: flex; align-items: center;   
        justify-content: center;  
    }   
      
    .info-btn {  
        background: transparent;  
        border: 0px solid #b59461;  
        color: #b59461;  
        border-radius: 50%;  
        width: 15px;  
        height: 15px;  
        font-size: 17px;  
        cursor: pointer;  
        display: inline-flex;  
        align-items: center;  
        justify-content: center;  
        padding: 0;  
        margin-left: 6px;
    }

    .info-btn:hover {
        background: #b59461;
        color: black;
    }

    /* ===== Fixed Attachment UI ===== */
    .attach-btn {
        width: 45px;
        height: 45px;
        border: none;
        border-radius: 50%;
        background: #202020;
        color: #b59461;
        font-size: 28px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        pointer-events: auto !important;
        -webkit-user-select: auto !important;
        user-select: auto !important;
    }

    .attach-btn:active {
        transform: scale(.95);
    }

    .attach-menu {
        position: fixed;  
        bottom: 82px;  
        left: 12px;  
        background: #141414;  
        border: 1px solid rgba(181, 148, 97, .3);  
        border-radius: 16px;  
        padding: 10px;  
        display: none;  
        flex-direction: column;  
        gap: 10px;  
        z-index: 99999 !important;
        box-shadow: 0 10px 30px rgba(0,0,0,.5);
        pointer-events: auto !important;
    }

    .attach-menu.show {
        display: flex !important;
    }

    .attach-item {
        display: flex;  
        align-items: center;  
        gap: 10px;  
        color: white;  
        cursor: pointer;  
        padding: 8px 12px;  
        border-radius: 10px;
        -webkit-user-select: auto !important;
        user-select: auto !important;
    }

    .attach-item:hover {
        background: #202020;
    }

    .attach-icon {
        width: 38px;  
        height: 38px;  
        border-radius: 50%;  
        display: flex;  
        align-items: center;  
        justify-content: center;  
        background: #2a2a2a;  
        font-size: 18px;
        pointer-events: none;
    }
    
    .attach-item span {
        pointer-events: none;
    }

    /* ===== STEP 2: Full Screen Media Preview Overlay CSS ===== */
    .media-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 999999;
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    .media-overlay.show {
        display: flex;
        opacity: 1;
    }
    .media-overlay img {
        max-width: 90%;
        max-height: 80dvh;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        object-fit: contain;
    }
    .media-overlay iframe {
        width: 90%;
        height: 85dvh;
        border: none;
        background: #fff;
        border-radius: 12px;
    }
    .close-overlay-btn {
        position: absolute;
        top: 20px; right: 20px;
        background: rgba(255,255,255,0.1);
        border: 1px solid var(--accent-gold);
        color: var(--accent-gold);
        font-size: 1.5rem;
        width: 45px; height: 45px;
        border-radius: 50%;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
    }
</style>
</head>  
<body oncontextmenu="return false;">  

<header>  
    <div class="header-left">  
        <a href="https://chat-room-three-pied.vercel.app/" class="home-btn">🏠</a>  
        <h2 style="font-family: 'Playfair Display', serif; color: var(--accent-gold); font-size: 0.9rem;"></h2>  
    </div>  
    <h2 style="font-family: 'Playfair Display', serif; color: var(--accent-gold); font-size: 1rem;">Secure Chat</h2>  
    <div class="header-right">  
        <div style="color: var(--accent-gold); font-size: 0.8rem; margin-right: 5px;">  
            👁️ <span id="online-count">0</span>  
        </div>  
        <div class="user-profile-section">  
            <div class="btn-group">  
                <button class="clear-btn" onclick="window.clearChat()">Clear</button>  
                <button class="logout-btn" onclick="window.logout()">Logout</button>  
            </div>  
            <span id="display-username" style="color: var(--accent-gold); font-size: 0.7rem; font-weight: 600;"></span>  
        </div>  
    </div>  
</header>  

<ul id="messages"></ul>  

<div class="input-area">  
    <button class="attach-btn" id="attachBtn" onclick="event.stopPropagation(); document.getElementById('attachMenu').classList.toggle('show');">
        +
    </button>
    <input id="msg" placeholder="Type a message..." autocomplete="off" />
    <button class="send-btn" onclick="window.handleSend()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
    </button>
</div>

<!-- Hidden native system input channels -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
<input type="file" id="galleryInput" accept="image/*" hidden>
<input type="file" id="videoInput" accept="video/*" hidden>
<input type="file" id="audioInput" accept="audio/*" hidden>

<!-- ===== STEP 1 FIXED: Changed accept to "*/*" to allow .apk, .html, .xml, etc. ===== -->
<input type="file" id="documentInput" accept="*/*" hidden>

<!-- ===== ENTIRE ATTACH-MENU SECTION WITH DIRECT TRIGGERS ===== -->
<div class="attach-menu" id="attachMenu">  
    <div class="attach-item" style="pointer-events: auto !important;" onclick="event.stopPropagation(); document.getElementById('cameraInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
        <div class="attach-icon" style="pointer-events: none;">📷</div>  
        <span style="pointer-events: none;">Camera</span>
    </div>  
    <div class="attach-item" style="pointer-events: auto !important;" onclick="event.stopPropagation(); document.getElementById('galleryInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
        <div class="attach-icon" style="pointer-events: none;">🖼️</div>  
        <span style="pointer-events: none;">Gallery</span>
    </div>  
    <div class="attach-item" style="pointer-events: auto !important;" onclick="event.stopPropagation(); document.getElementById('videoInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
        <div class="attach-icon" style="pointer-events: none;">🎥</div>  
        <span style="pointer-events: none;">Video</span>
    </div>  
    <div class="attach-item" style="pointer-events: auto !important;" onclick="event.stopPropagation(); document.getElementById('audioInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
        <div class="attach-icon" style="pointer-events: none;">🎵</div>  
        <span style="pointer-events: none;">Audio</span>
    </div>  
    <div class="attach-item" style="pointer-events: auto !important;" onclick="event.stopPropagation(); document.getElementById('documentInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
        <div class="attach-icon" style="pointer-events: none;">📄</div>  
        <span style="pointer-events: none;">Document</span>
    </div>  
</div>

<!-- ===== STEP 2 FIXED: Full-Screen Media Viewer Layer Container ===== -->
<div id="mediaOverlay" class="media-overlay">
    <button class="close-overlay-btn" onclick="document.getElementById('mediaOverlay').classList.remove('show')">&times;</button>
    <div id="overlayContent" style="width:100%; display:flex; justify-content:center; align-items:center;"></div>
</div>

<script src="https://chat-backend-gtg5.onrender.com/socket.io/socket.io.js"></script>  
<script src="js/mediaManager.js"></script>
<script src="js/attachments.js"></script>  
<script src="script.js"></script>

<script>
    // Universal screen backdrop click dynamic tracker for closing menu safely
    document.addEventListener("click", function(e) {
        const menu = document.getElementById("attachMenu");
        const btn = document.getElementById("attachBtn");
        if(menu && btn && !menu.contains(e.target) && e.target !== btn) {
            menu.classList.remove("show");
        }
    });
</script>

</body>  
    </html>
