<!DOCTYPE html>
<html lang="en">
<head>
    <!--  -->
<script>
    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "login.html";
    }
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Ultra Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0a;
            --bg-card: #141414;
            --accent-gold: #b59461;
            --accent-red: #ff4d4d;
            --text-main: #e0e0e0;
            --my-chat-bg: rgba(181, 148, 97, 0.15);
        }

        /* SECURITY & UI RESET */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Poppins', sans-serif;
            -webkit-user-select: none; user-select: none; 
            -webkit-touch-callout: none;
        }

        @media print { body { display: none !important; } }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(at 0% 0%, rgba(30, 20, 16, 0.4) 0px, transparent 50%);
            color: var(--text-main);
            height: 100dvh; display: flex; flex-direction: column; 
            overflow: hidden; position: fixed; width: 100%;
        }

        header {
            background: var(--bg-card); padding: 10px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(181, 148, 97, 0.2); height: 75px;
            z-index: 10;
        }

        .header-right { display: flex; align-items: center; gap: 12px; }
        
        .user-profile-section {
            display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
        }

        .btn-group { display: flex; gap: 8px; }

        .logout-btn, .clear-btn {
            border: 1px solid var(--accent-gold); padding: 4px 10px; 
            border-radius: 5px; cursor: pointer; font-size: 0.7rem; 
            font-weight: 600; background: transparent; color: var(--accent-gold);
        }

        .clear-btn { border-color: var(--accent-red); color: var(--accent-red); }

        #messages { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 12px;
            scroll-behavior: smooth;
        }

        #messages li {
            list-style: none; padding: 10px 15px; 
            background: rgba(255, 255, 255, 0.07);
            border-radius: 15px 15px 15px 2px; max-width: 85%; 
            width: fit-content; border: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column;
            word-wrap: break-word;
        }

        #messages li.my-message {
            align-self: flex-end;
            background: var(--my-chat-bg);
            border-color: var(--accent-gold);
            border-radius: 15px 15px 2px 15px;
        }

        .input-area {
            background: var(--bg-card); padding: 10px 12px; 
            display: flex; align-items: center; gap: 10px;
            border-top: 1px solid rgba(181, 148, 97, 0.1);
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        #msg {
            flex: 1; min-width: 0; background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(181, 148, 97, 0.3); padding: 12px 18px; 
            border-radius: 25px; color: #fff; outline: none; 
            user-select: text !important;
        }

        .send-btn {
            background: var(--accent-gold); border: none; 
            width: 45px; height: 45px; border-radius: 50%; 
            cursor: pointer; display: flex; align-items: center; 
            justify-content: center;

            .attach-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#1f1f1f;
    color:#b59461;
    font-size:26px;
    cursor:pointer;
}

.attach-menu{
    position:absolute;
    bottom:70px;
    left:12px;
    background:#181818;
    border:1px solid rgba(181,148,97,.25);
    border-radius:12px;
    display:none;
    flex-direction:column;
    overflow:hidden;
    z-index:999;
}

.attach-menu.show{
    display:flex;
}

.attach-item{
    padding:12px 18px;
    cursor:pointer;
    color:#fff;
    font-size:.85rem;
}

.attach-item:hover{
    background:rgba(181,148,97,.15);
}
            
        } 
        
        .info-btn {
    background: transparent;
    border: 0px solid #b59461;
    color: #b59461;
    border-radius: 50%;
    width: 15px;
    height: 15px;
    font-size: 17px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-left: 6px;
}

.info-btn:hover {
    background: #b59461;
    color: black;
}
/* ==========================
   Upload UI
========================== */

.upload-message{
    width:100%;
    max-width:320px;
}

.upload-card{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.upload-header{
    display:flex;
    align-items:center;
    gap:10px;
}

.upload-icon{
    font-size:30px;
}

.upload-details{
    flex:1;
}

.upload-name{
    font-size:.85rem;
    font-weight:600;
    color:#fff;
    word-break:break-word;
}

.upload-size{
    font-size:.7rem;
    color:#aaa;
}

.upload-progress-text{
    font-size:.72rem;
    color:#b59461;
}

.upload-progress{
    width:100%;
    height:6px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

.upload-fill{
    width:0%;
    height:100%;
    background:#b59461;
    transition:width .2s linear;
}

.upload-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.upload-btn{
    width:28px;
    height:28px;
    border:none;
    border-radius:50%;
    background:#202020;
    color:#fff;
    cursor:pointer;
    font-size:13px;
}

.upload-btn:hover{
    background:#b59461;
    color:#000;
}
    </style>
</head>
<body oncontextmenu="return false;">

    <header>
        <div class="header-left">
            <a href="https://chat-room-three-pied.vercel.app/" class="home-btn">🏠</a>
            <h2 style="font-family: 'Playfair Display', serif; color: var(--accent-gold); font-size: 0.9rem;"></h2>
        </div>
        <h2 style="font-family: 'Playfair Display', serif; color: var(--accent-gold); font-size: 1rem;">Secure Chat</h2>
        <div class="header-right">
            <div style="color: var(--accent-gold); font-size: 0.8rem; margin-right: 5px;">
                👁️ <span id="online-count">0</span>
            </div>
            <div class="user-profile-section">
                <div class="btn-group">
                    <button class="clear-btn" onclick="window.clearChat()">Clear</button>
                    <button class="logout-btn" onclick="window.logout()">Logout</button>
                </div>
                <span id="display-username" style="color: var(--accent-gold); font-size: 0.7rem; font-weight: 600;"></span>
            </div>
        </div>
    </header>

    <ul id="messages"></ul>

<div
id="attachMenu"
class="attach-menu">

<div
class="attach-item"
data-type="camera">
📷 Camera
</div>

<div
class="attach-item"
data-type="gallery">
🖼 Gallery
</div>

<div
class="attach-item"
data-type="video">
🎥 Video
</div>

<div
class="attach-item"
data-type="audio">
🎵 Audio
</div>

<div
class="attach-item"

</div>

</div>

<input
id="cameraInput"
type="file"

<input

<input

type="file"
accept="video/*"
hidden>

<input
id="audioInput"

accept="audio/*"
hidden>

<input
id="documentInput"
type="file"
hidden>

    <div class="input-area">

<button
id="attachBtn"
class="attach-btn">
+
</button>

<input
id="msg"
placeholder="Type a message..."
autocomplete="off">

<button
class="send-btn"
onclick="window.handleSend()">

<svg width="20"
height="20"
viewBox="0 0 24 24"
fill="none"
stroke="#000"
stroke-width="3">

<line
x1="22"
y1="2"
x2="11"
y2="13"/>

<polygon
points="22 2 15 22 11 13 2 9 22 2"/>

</svg>

</button>

</div>

<script src="mediaUtils.js"></script>

<script src="uploadAck.js"></script>

<script src="mediaStore.js"></script>

<script src="mediaPreview.js"></script>

<script src="chunkSender.js"></script>

<script src="uploadState.js"></script>

<script src="uploadQueue.js"></script>

<script src="uploadUI.js"></script>

<script src="attachments.js"></script>

<script src="script.js"></script>
</body>
    </html>
