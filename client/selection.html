<!DOCTYPE html>
<html lang="en">
<head>
    
<script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = "login.html"; 
    }
</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Mode | Private Chat</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Same Theme Variables --- */
        :root {
            --bg-base: #0a0a0a;
            --bg-card: #141414;
            --wood-accent-deep: #1e1410;
            --accent-gold: #b59461;
            --text-main: #e0e0e0;
            --text-muted: #999999;
            --border-color: rgba(181, 148, 97, 0.1);
            --radius-main: 12px;
            --transition-smooth: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(at 10% 10%, rgba(30, 20, 16, 0.5) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(10, 10, 10, 0.5) 0px, transparent 50%);
            padding: 20px;
        }

        .selection-container {
            text-align: center;
            max-width: 900px;
            width: 100%;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--accent-gold);
            margin-bottom: 40px;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--bg-card);
            background-image: linear-gradient(145deg, var(--bg-card) 0%, var(--wood-accent-deep) 100%);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: var(--radius-main);
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        
        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(181, 148, 97, 0.3);
            box-shadow: 0 20px 45px rgba(0,0,0,0.6);
        }

        h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 6px;
            transition: var(--transition-smooth);
            cursor: pointer;
            letter-spacing: 1px;
            border: 2px solid var(--accent-gold);
            background-color: var(--accent-gold);
            color: #000;
            width: 100%;
        }

        .btn:hover {
            background-color: transparent;
            color: var(--accent-gold);
            box-shadow: 0 10px 20px rgba(181, 148, 97, 0.2);
        }

        /* Footer matching index.html */
        footer {
            margin-top: 60px;
            text-align: center;
            width: 100%;
        }

        .managed-by {
            font-size: 0.9rem;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .crafted-by {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            h2 { font-size: 2rem; }
            .options { grid-template-columns: 1fr; }
            .card { padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="selection-container">
        <h2>Welcome! Choose your chat mode</h2>
        
        <div class="options">
            <!-- Global Arena Card -->
            <div class="card">
                <h3>Global Arena</h3>
                <p>Talk with everyone in the World Chat.</p>
                <a href="world-chat.html" class="btn">Enter World Chat</a>
            </div>

            <!-- Private Room Card -->
            <div class="card">
                <h3>Private Room</h3>
                <p>Chat 1-on-1 with your friends.</p>
                <a href="private-chat.html" class="btn">User to User</a>
            </div>
        </div>
    </div>

    <footer>
        <p class="managed-by">Managed By - <strong>Sharma's Organisation</strong></p>
        <p class="crafted-by">©2026 Crafted by <strong><a href="https://TheSumitSharma.in" target="_blank" style="color: var(--accent-gold);">TheSumitSharma.in</a></strong>. All Rights Reserved.</p>
    </footer>

</body>
    </html>
