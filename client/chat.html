<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Ultra Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-base: #0a0a0a; --bg-card: #141414; --accent-gold: #b59461; --text-main: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-user-select: none; user-select: none; }
        body { background-color: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { padding: 15px; background: var(--bg-card); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(181, 148, 97, 0.2); z-index: 10; }
        .mode-tabs { display: flex; background: #111; border-bottom: 1px solid #222; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #666; font-weight: 600; font-size: 0.85rem; transition: 0.3s; }
        .tab.active { color: var(--accent-gold); border-bottom: 2px solid var(--accent-gold); background: rgba(181,148,97,0.05); }

        #messages { flex: 1; overflow-y: auto; padding: 15px; list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .msg-container { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 0.9rem; line-height: 1.4; position: relative; }
        .my-msg { align-self: flex-end; background: rgba(181, 148, 97, 0.15); border: 1px solid rgba(181, 148, 97, 0.2); border-bottom-right-radius: 2px; }
        .other-msg { align-self: flex-start; background: #1a1a1a; border: 1px solid #333; border-bottom-left-radius: 2px; }
        
        .typing-indicator { height: 20px; font-size: 0.75rem; color: var(--accent-gold); padding: 0 20px; font-style: italic; }
        .input-area { padding: 15px; background: var(--bg-card); display: flex; gap: 10px; border-top: 1px solid #222; }
        #msg { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 12px 18px; border-radius: 25px; outline: none; }
        .send-btn { background: var(--accent-gold); border: none; padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: bold; color: #000; }
        
        #add-private { position: fixed; bottom: 85px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: var(--accent-gold); color: #000; display: none; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;">
    <header>
        <h2 id="view-title" style="color: var(--accent-gold); font-size: 1rem; font-family: 'Playfair Display';">World Chat</h2>
        <div style="display: flex; gap: 12px; align-items: center;">
            <span style="font-size: 0.8rem; color: var(--accent-gold);">👁️ <span id="online-count">0</span></span>
            <button onclick="window.clearChat()" style="background:none; border:1px solid #444; color:#888; font-size:0.7rem; padding:3px 8px; border-radius:4px;">Clear</button>
            <button onclick="window.logout()" style="background:none; border:1px solid #ff4d4d; color:#ff4d4d; font-size:0.7rem; padding:3px 8px; border-radius:4px;">Logout</button>
        </div>
    </header>

    <div class="mode-tabs">
        <div id="tab-world" class="tab active" onclick="switchMode('world')">WORLD CHAT</div>
        <div id="tab-private" class="tab" onclick="switchMode('private')">PRIVATE MESSAGES</div>
    </div>

    <ul id="messages"></ul>
    <div id="typing-info" class="typing-indicator"></div>
    <div id="add-private" onclick="startPrivate()">+</div>

    <div class="input-area">
        <input id="msg" placeholder="Type message..." autocomplete="off" oninput="isTyping()" />
        <button class="send-btn" onclick="window.handleSend()">Send</button>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
