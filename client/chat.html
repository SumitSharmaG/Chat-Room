<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Ultra Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-base: #0a0a0a; --bg-card: #141414; --accent-gold: #b59461; --text-main: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-user-select: none; user-select: none; }
        
        body { background-color: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; justify-content: center; overflow: hidden; }

        /* Responsive Container */
        .app-container { width: 100%; max-width: 800px; background: var(--bg-card); display: flex; flex-direction: column; position: relative; border-left: 1px solid #222; border-right: 1px solid #222; }

        header { padding: 15px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(181,148,97,0.2); }
        
        .tab-bar { display: flex; background: #0d0d0d; border-bottom: 1px solid #222; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; color: #555; font-weight: 600; font-size: 0.8rem; transition: 0.3s; }
        .tab.active { color: var(--accent-gold); border-bottom: 2px solid var(--accent-gold); background: rgba(181,148,97,0.05); }

        /* Inbox List (WhatsApp style auto-detect) */
        #inbox-list { display: none; flex: 1; overflow-y: auto; padding: 10px; }
        .inbox-item { padding: 15px; background: #1a1a1a; margin-bottom: 8px; border-radius: 10px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .inbox-item:active { background: #222; }

        /* Messages Area */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 0.9rem; position: relative; line-height: 1.4; }
        .my-msg { align-self: flex-end; background: rgba(181, 148, 97, 0.15); border: 1px solid rgba(181, 148, 97, 0.3); border-bottom-right-radius: 2px; }
        .other-msg { align-self: flex-start; background: #1a1a1a; border: 1px solid #333; border-bottom-left-radius: 2px; }

        .input-area { padding: 15px; background: #0d0d0d; display: flex; gap: 10px; border-top: 1px solid #222; }
        #msg-input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px 18px; border-radius: 25px; outline: none; }
        .send-btn { background: var(--accent-gold); border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        
        #new-chat-btn { position: absolute; bottom: 85px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: var(--accent-gold); color: #000; display: none; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h3 id="chat-title" style="color: var(--accent-gold); font-family: 'Playfair Display'; font-size: 1rem;">World Chat</h3>
            <div style="font-size: 0.7rem; color: var(--accent-gold);">
                <span id="online-count">0</span> Online | <span onclick="logout()" style="color:red; cursor:pointer;">Logout</span>
            </div>
        </header>

        <div class="tab-bar">
            <div id="tab-world" class="tab active" onclick="switchTab('world')">WORLD CHAT</div>
            <div id="tab-private" class="tab" onclick="switchTab('private')">PRIVATE INBOX</div>
        </div>

        <ul id="messages"></ul>
        <div id="inbox-list"></div>

        <div id="new-chat-btn" onclick="startNewChat()">+</div>

        <div class="input-area">
            <input id="msg-input" placeholder="Write message..." autocomplete="off" />
            <button class="send-btn" onclick="handleSend()">Send</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
