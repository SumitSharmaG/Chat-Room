<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Ultra Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-base: #0a0a0a; --bg-card: #141414; --accent-gold: #b59461; --text-main: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-user-select: none; user-select: none; }
        body { background-color: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* New UI Elements */
        #mode-selector { display: flex; justify-content: space-around; padding: 15px; background: var(--bg-card); border-bottom: 1px solid rgba(181,148,97,0.2); }
        .mode-btn { background: none; border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .mode-btn.active { background: var(--accent-gold); color: #000; }
        
        header { padding: 15px; background: var(--bg-card); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(181,148,97,0.1); }
        #messages { flex: 1; overflow-y: auto; padding: 15px; list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .my-message { align-self: flex-end; background: rgba(181,148,97,0.2); padding: 10px; border-radius: 12px 12px 0 12px; max-width: 80%; }
        .other-message { align-self: flex-start; background: #1a1a1a; padding: 10px; border-radius: 12px 12px 12px 0; max-width: 80%; border: 1px solid #333; }
        .input-area { padding: 15px; background: var(--bg-card); display: flex; gap: 10px; }
        #msg { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 25px; outline: none; }
        .send-btn { background: var(--accent-gold); border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        
        #new-chat-plus { position: fixed; bottom: 85px; right: 20px; background: var(--accent-gold); width: 50px; height: 50px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 24px; color: #000; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-weight: bold; }
        .typing-box { font-size: 0.7rem; color: var(--accent-gold); padding: 5px 15px; height: 20px; }
    </style>
</head>
<body>
    <header>
        <h2 id="chat-title" style="color: var(--accent-gold); font-size: 1rem;">Secure Chat</h2>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 0.8rem;">👁️ <span id="online-count">0</span></span>
            <button onclick="window.logout()" style="background: none; border: 1px solid red; color: red; font-size: 0.7rem; padding: 2px 8px; border-radius: 5px;">Logout</button>
        </div>
    </header>

    <div id="mode-selector">
        <button id="btn-world" class="mode-btn active" onclick="switchMode('world')">World Chat</button>
        <button id="btn-private" class="mode-btn" onclick="switchMode('private')">Private Chat</button>
    </div>

    <ul id="messages"></ul>
    <div id="typing-indicator" class="typing-box"></div>

    <div id="new-chat-plus" onclick="startNewPrivate()">+</div>

    <div class="input-area">
        <input id="msg" placeholder="Type a message..." autocomplete="off" />
        <button class="send-btn" onclick="window.handleSend()">Send</button>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
