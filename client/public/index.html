<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Private Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#090909;
    --card:#141414;
    --gold:#b59461;
    --text:#f2f2f2;
    --mine:rgba(181,148,97,0.15);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

.hidden{
    display:none !important;
}

/* AUTH */
#auth{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:340px;
    background:var(--card);
    border:1px solid rgba(181,148,97,0.15);
    border-radius:20px;
    padding:30px;
}

.auth-box h1{
    text-align:center;
    margin-bottom:25px;
    color:var(--gold);
    font-family:'Playfair Display',serif;
}

.auth-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-bottom:14px;
    background:#1d1d1d;
    color:white;
    outline:none;
}

.auth-box button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    background:var(--gold);
    font-weight:600;
    cursor:pointer;
}

/* APP */
#app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:330px;
    background:var(--card);
    border-right:1px solid rgba(181,148,97,0.12);
    display:flex;
    flex-direction:column;
}

.sidebar-top{
    padding:20px;
    border-bottom:1px solid rgba(181,148,97,0.12);
}

.sidebar-top h2{
    color:var(--gold);
    font-family:'Playfair Display',serif;
}

#myUser{
    margin-top:6px;
    opacity:0.7;
    font-size:0.85rem;
}

.search-box{
    padding:15px;
    border-bottom:1px solid rgba(181,148,97,0.1);
}

.search-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#1d1d1d;
    color:white;
    outline:none;
}

.user{
    padding:18px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    cursor:pointer;
    transition:0.2s;
}

.user:hover{
    background:rgba(255,255,255,0.04);
}

.user.active{
    background:rgba(181,148,97,0.1);
}

/* CHAT */
.chat-area{
    flex:1;
    display:flex;
    flex-direction:column;
}

.chat-header{
    height:75px;
    background:var(--card);
    border-bottom:1px solid rgba(181,148,97,0.12);
    display:flex;
    align-items:center;
    padding:0 25px;
    color:var(--gold);
    font-weight:600;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:75%;
    width:fit-content;
    padding:12px 16px;
    border-radius:16px;
    background:rgba(255,255,255,0.06);
    word-break:break-word;
}

.mine{
    align-self:flex-end;
    background:var(--mine);
    border:1px solid rgba(181,148,97,0.35);
}

.time{
    font-size:0.7rem;
    opacity:0.5;
    margin-top:6px;
}

.input-area{
    background:var(--card);
    border-top:1px solid rgba(181,148,97,0.12);
    padding:12px;
    display:flex;
    gap:10px;
}

#messageInput{
    flex:1;
    border:none;
    border-radius:25px;
    background:#1c1c1c;
    padding:14px 18px;
    color:white;
    outline:none;
}

.send-btn{
    width:50px;
    border:none;
    border-radius:50%;
    background:var(--gold);
    cursor:pointer;
    font-size:18px;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
    <div class="auth-box">
        <h1>Secure Chat</h1>
        <input id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="register()">Register</button>
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
    <div class="sidebar">
        <div class="sidebar-top">
            <h2>Private Chats</h2>
            <div id="myUser"></div>
        </div>
        <div class="search-box">
            <input id="searchUser" placeholder="Search username...">
        </div>
        <div id="usersList"></div>
    </div>

    <div class="chat-area">
        <div class="chat-header" id="chatHeader">
            Select a user
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>
// Make sure this points to your actual backend URL when hosting
const socket = io("https://chat-backend-gtg5.onrender.com");

let currentUser = null;
let currentChatUser = null;
let onlineUsers = [];

/* INIT STORAGE SAFETY */
if(!localStorage.getItem("global_users")){
    localStorage.setItem("global_users","[]");
}

/* REGISTER */
function register(){
    const username = document.getElementById("username").value.trim().toLowerCase();
    const password = document.getElementById("password").value.trim();

    if(!username || !password) {
        alert("Please enter both username and password.");
        return;
    }

    let users = JSON.parse(localStorage.getItem("global_users") || "[]");

    if(users.find(u=>u.username===username)){
        alert("Username already exists");
        return;
    }

    users.push({
        id: Date.now().toString(),
        username,
        password
    });

    localStorage.setItem("global_users", JSON.stringify(users));
    alert("Registered successfully! You can now login.");
}

/* LOGIN */
function login() {
    const username = document.getElementById("username").value.trim().toLowerCase();
    const password = document.getElementById("password").value.trim();
    const users = JSON.parse(localStorage.getItem("global_users") || "[]");

    const user = users.find(u => u.username === username && u.password === password);

    if (!user) {
        alert("Invalid credentials");
        return;
    }

    currentUser = user;
    document.getElementById("auth").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("myUser").innerText = "@" + user.username;

    // IMPORTANT: Tell the server who we are
    socket.emit("userJoined", user.username);
    
    // Request the list again just to be sure
    socket.emit("requestOnlineUsers");
}

/* ONLINE USERS */
socket.on("onlineUsers", (users) => {
    onlineUsers = users || [];
    if (currentUser) renderUsers();
});

function renderUsers(){
    const box = document.getElementById("usersList");
    box.innerHTML = "";

    if(!currentUser) return;

    onlineUsers.forEach(username => {
        if(username === currentUser.username) return;

        const div = document.createElement("div");
        div.className = "user";
        
        // Highlight the user we are currently chatting with
        if(currentChatUser === username) {
            div.classList.add("active");
        }

        div.innerHTML = `
            <div>🟢 @${username}</div>
            <button style="
                margin-top:8px;
                padding:6px 10px;
                border:none;
                border-radius:8px;
                background:#b59461;
                color:black;
                cursor:pointer;
                font-size:0.7rem;
            ">
                Connect
            </button>
        `;

        div.querySelector("button").onclick = () => {
            socket.emit("connectRequest", {
                from: currentUser.username,
                to: username
            });
            alert("Request sent to @" + username);
        };

        box.appendChild(div);
    });
}

/* CONNECT REQUEST (When someone wants to chat with YOU) */
socket.on("connectRequest", ({from})=>{
    const accept = confirm(`Connect with @${from}?`);
    
    if (accept) {
        currentChatUser = from;
        document.getElementById("chatHeader").innerText = "Chatting with @" + from;
        document.getElementById("messages").innerHTML = ""; // Clear old chat
        renderUsers(); // Update active state in sidebar
    }

    socket.emit("connectResponse", {
        from: currentUser.username,
        to: from,
        accepted: accept
    });
});

/* CONNECT RESPONSE (When someone responds to YOUR request) */
socket.on("connectResponse", ({from, accepted})=>{
    if (accepted) {
        currentChatUser = from;
        document.getElementById("chatHeader").innerText = "Chatting with @" + from;
        document.getElementById("messages").innerHTML = ""; // Clear old chat
        renderUsers(); // Update active state in sidebar
        alert("Connected with @" + from);
    } else {
        alert("Rejected by @" + from);
    }
});

/* SEND MESSAGE */
function sendMessage() {
    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!text) return;
    if (!currentChatUser) {
        alert("Please connect with a user first!");
        return;
    }

    const messageData = {
        sender: currentUser.username,
        receiver: currentChatUser,
        text: text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    };

    socket.emit("sendMessage", messageData);
    input.value = "";
}

/* ALLOW ENTER KEY TO SEND */
function handleKeyPress(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}

/* RECEIVE MESSAGE */
socket.on("receiveMessage", (msg) => {
    // Only render the message if it belongs to the active conversation
    if (
        (msg.sender === currentChatUser && msg.receiver === currentUser.username) ||
        (msg.sender === currentUser.username && msg.receiver === currentChatUser)
    ) {
        const box = document.getElementById("messages");
        const div = document.createElement("div");
        
        const isMine = msg.sender === currentUser.username;
        div.className = `message ${isMine ? 'mine' : ''}`;
        
        div.innerHTML = `
            <div class="text">${msg.text}</div>
            <div class="time">${msg.timestamp || 'Just now'}</div>
        `;
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight; // Auto-scroll to bottom
    }
});

socket.on("connect", () => {
    console.log("Socket connected:", socket.id);
});
</script>

</body>
</html>
