<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Secure Private Chat | Premium</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
<style>
:root { --bg:#090909; --card:#141414; --gold:#b59461; --text:#f2f2f2; --mine:rgba(181,148,97,0.15); --status-off:#ff4b4b; --status-on:#4bffb9; }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body { background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
.hidden { display:none !important; }

#auth { height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.auth-box { width:340px; background:var(--card); border:1px solid rgba(181,148,97,0.15); border-radius:20px; padding:30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.auth-box h1 { text-align:center; margin-bottom:25px; color:var(--gold); font-family:'Playfair Display',serif; }
.auth-box input { width:100%; padding:14px; border:none; border-radius:12px; margin-bottom:14px; background:#1d1d1d; color:white; outline:none; border: 1px solid transparent; transition: 0.3s; }
.auth-box input:focus { border-color: var(--gold); }
.auth-box button { width:100%; padding:14px; border:none; border-radius:12px; margin-top:10px; background:var(--gold); font-weight:600; cursor:pointer; transition: 0.3s; }
.auth-box button:hover { opacity: 0.8; transform: translateY(-2px); }

#app { display:flex; height:100vh; }
.sidebar { width:330px; background:var(--card); border-right:1px solid rgba(181,148,97,0.12); display:flex; flex-direction:column; }
.sidebar-top { padding:20px; border-bottom:1px solid rgba(181,148,97,0.12); }
.sidebar-top h2 { color:var(--gold); font-family:'Playfair Display',serif; display: flex; justify-content: space-between; align-items: center; }
#conn-status { width: 10px; height: 10px; border-radius: 50%; background: var(--status-off); display: inline-block; }
#conn-status.online { background: var(--status-on); box-shadow: 0 0 8px var(--status-on); }
#myUser { margin-top:6px; opacity:0.7; font-size:0.85rem; letter-spacing: 1px; }
#connectSection { display:flex; align-items:center; padding: 15px; border-bottom:1px solid rgba(181,148,97,0.1); }
#connectInput { flex:1; padding:12px; border:none; border-radius:12px; background:#1d1d1d; color:white; outline:none; font-size:1rem; }
#connectButton { margin-left:10px; padding:10px 15px; border:none; border-radius:8px; background:var(--gold); cursor:pointer; font-weight:600; font-size:0.9rem; }
#connectStatus { margin-left:10px; font-size:0.9rem; color:#f55; }

#usersList { flex: 1; overflow-y: auto; }
.user { padding:18px; border-bottom:1px solid rgba(255,255,255,0.03); cursor:pointer; transition:0.2s; display: flex; justify-content: space-between; align-items: center; }
.user:hover { background:rgba(255,255,255,0.04); }
.user.active { background:rgba(181,148,97,0.12); border-left: 3px solid var(--gold); }
.user-info { display: flex; align-items: center; gap: 10px; }
.dot { width: 8px; height: 8px; background: var(--status-on); border-radius: 50%; }

.chat-area { flex:1; display:flex; flex-direction:column; background: #0c0c0c; }
.chat-header { height:75px; background:var(--card); border-bottom:1px solid rgba(181,148,97,0.12); display:flex; align-items:center; padding:0 25px; color:var(--gold); font-weight:600; font-size: 1.1rem; }
#messages { flex:1; overflow-y:auto; padding:25px; display:flex; flex-direction:column; gap:15px; }
.message { max-width:70%; padding:12px 18px; border-radius:18px; background:rgba(255,255,255,0.07); word-break:break-word; line-height: 1.5; position: relative; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.mine { align-self:flex-end; background:var(--mine); border:1px solid rgba(181,148,97,0.3); border-bottom-right-radius: 4px; }
.time { font-size:0.65rem; opacity:0.4; margin-top:6px; text-align: right; }

.input-area { background:var(--card); border-top:1px solid rgba(181,148,97,0.12); padding:20px; display:flex; gap:12px; }
#messageInput { flex:1; border:none; border-radius:15px; background:#1c1c1c; padding:14px 20px; color:white; outline:none; border: 1px solid transparent; }
#messageInput:focus { border-color: rgba(181,148,97,0.3); }
.send-btn { width:50px; height: 50px; border:none; border-radius:15px; background:var(--gold); cursor:pointer; font-size:20px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.send-btn:hover { transform: scale(1.05); }
</style>
</head>
<body>

<!-- Authentication Panel -->
<div id="auth">
    <div class="auth-box">
        <h1>Secure Chat</h1>
        <input id="username" placeholder="Username" autocomplete="off" />
        <input type="password" id="password" placeholder="Password" />
        <button onclick="register()">Register</button>
        <button onclick="login()" style="background: transparent; color: var(--gold); border: 1px solid var(--gold); margin-top: 15px;">Login</button>
    </div>
</div>

<!-- Main Application -->
<div id="app" class="hidden">
    <div class="sidebar">
        <div class="sidebar-top">
            <h2>Private Chats <span id="conn-status"></span></h2>
            <div id="myUser"></div>
        </div>
        <!-- Manual Connect Section -->
        <div id="connectSection">
            <input type="text" id="connectInput" placeholder="Enter username..." />
            <button id="connectButton" onclick="connectToUser()">Connect</button>
            <div id="connectStatus"></div>
        </div>
        <!-- Optional: User list (not used here) -->
    </div>
    <!-- Chat Area -->
    <div class="chat-area">
        <div class="chat-header" id="chatHeader">Select a contact to start</div>
        <div id="messages"></div>
        <div class="input-area">
            <input id="messageInput" placeholder="Write a message..." onkeypress="if(event.key==='Enter') sendMessage()" />
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<!-- Socket.io -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
const socket = io("https://chat-backend-gtg5.onrender.com", {
    transports: ["websocket"],
    reconnection: true
});

let currentUser = null;
let currentChatUser = null;

// Connection status indicator
socket.on("connect", () => {
    document.getElementById("conn-status").classList.add("online");
});
socket.on("disconnect", () => {
    document.getElementById("conn-status").classList.remove("online");
});

// Register new user
function register() {
    const u = document.getElementById("username").value.trim().toLowerCase();
    const p = document.getElementById("password").value.trim();
    if (!u || !p) return alert("Fields required");
    let users = JSON.parse(localStorage.getItem("global_users") || "[]");
    if (users.find(x => x.username === u)) return alert("User exists");
    users.push({ username: u, password: p });
    localStorage.setItem("global_users", JSON.stringify(users));
    alert("Registered! Now Login.");
}
// Login user
function login() {
    const u = document.getElementById("username").value.trim().toLowerCase();
    const p = document.getElementById("password").value.trim();
    const users = JSON.parse(localStorage.getItem("global_users") || "[]");
    const found = users.find(x => x.username === u && x.password === p);
    if (!found) return alert("Invalid Login");
    currentUser = found;
    document.getElementById("auth").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("myUser").innerText = "@" + u;
    // Notify server of user joining
    socket.emit("userJoined", u);
}

// Manual connect to user
function connectToUser() {
    const username = document.getElementById("connectInput").value.trim().toLowerCase();
    if (!username) {
        alert("Please enter a username");
        return;
    }
    // Save target
    window.targetUser = username;
    document.getElementById("connectStatus").innerText = "Checking user...";
    socket.emit("checkUserOnline", username);
}

// Handle server response for user online
socket.on("userOnlineStatus", (data) => {
    document.getElementById("connectStatus").innerText = "";
    if (data.online) {
        startChat(data.username);
    } else {
        alert("User not found or offline");
    }
});

// Start chat
function startChat(username) {
    currentChatUser = username;
    document.getElementById("chatHeader").innerText = "Chatting with @" + username;
    document.getElementById("messages").innerHTML = "";
}

// Send message
function sendMessage() {
    const input = document.getElementById("messageInput");
    const val = input.value.trim();
    if (!val || !currentChatUser || !currentUser) return;
    const data = {
        sender: currentUser.username,
        receiver: currentChatUser,
        text: val,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    };
    socket.emit("sendMessage", data);
    input.value = "";
}

// Receive message
socket.on("receiveMessage", (msg) => {
    if (
        (msg.sender === currentChatUser && msg.receiver === currentUser.username) ||
        (msg.sender === currentUser.username && msg.receiver === currentChatUser)
    ) {
        renderMessage(msg);
    }
});

// Render message
function renderMessage(msg) {
    const box = document.getElementById("messages");
    const isMine = msg.sender === currentUser.username;
    const div = document.createElement("div");
    div.className = `message ${isMine ? "mine" : ""}`;
    div.innerHTML = `<div>${msg.text}</div><div class="time">${msg.timestamp}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
