        // ==========================================
        // 7. VOICE RECORDING & AUDIO PLAYER
        // ==========================================
        const PAPER_PLANE_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
        const MIC_ICON_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`;

        let sendHoldTimer = null;
        let isVoiceHoldActive = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let activeMicStream = null;
        let recTimerInterval = null;
        let recSeconds = 0;
        let pendingAudioBase64 = null;
        let pendingAudioDurationStr = "0:01";
        let previewAudioObj = new Audio();

        previewAudioObj.onended = () => {
            if ($("previewPlayBtn")) $("previewPlayBtn").innerText = "▶";
        };

        window.handleSendBtnDown = function(e) {
            e.preventDefault();
            if (!selectedUser) {
                alert("Pehle koi chat select karein!");
                return;
            }
            isVoiceHoldActive = false;
            clearTimeout(sendHoldTimer);
            sendHoldTimer = setTimeout(() => {
                isVoiceHoldActive = true;
                startVoiceNoteRecording();
            }, 300);
        };

        window.handleSendBtnUp = function(e) {
            e.preventDefault();
            clearTimeout(sendHoldTimer);
            if (isVoiceHoldActive) {
                stopVoiceNoteRecording();
                isVoiceHoldActive = false;
            } else {
                sendMessage();
            }
        };

        window.handleSendBtnCancel = function(e) {
            clearTimeout(sendHoldTimer);
            if (isVoiceHoldActive) {
                stopVoiceNoteRecording();
                isVoiceHoldActive = false;
            }
        };

        async function startVoiceNoteRecording() {
            try {
                activeMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                pendingAudioBase64 = null;

                $("mainSendBtn").classList.add("recording-active");
                $("sendBtnIconWrap").innerHTML = MIC_ICON_SVG;
                $("messageInput").style.display = "none";
                $("audioPreviewBar").classList.remove("show");
                $("recordingBar").classList.add("show");

                recSeconds = 0;
                pendingAudioDurationStr = "0:01";
                $("recordingTimer").innerText = "0:00";
                clearInterval(recTimerInterval);
                recTimerInterval = setInterval(() => {
                    recSeconds++;
                    const mins = Math.floor(recSeconds / 60);
                    const secs = recSeconds % 60;
                    pendingAudioDurationStr = `${mins}:${secs < 10 ? '0' + secs : secs}`;
                    $("recordingTimer").innerText = pendingAudioDurationStr;
                }, 1000);

                mediaRecorder = new MediaRecorder(activeMicStream);
                mediaRecorder.ondataavailable = (evt) => {
                    if (evt.data && evt.data.size > 0) audioChunks.push(evt.data);
                };

                mediaRecorder.onstop = () => {
                    clearInterval(recTimerInterval);
                    if (activeMicStream) {
                        activeMicStream.getTracks().forEach(t => t.stop());
                        activeMicStream = null;
                    }
                    $("mainSendBtn").classList.remove("recording-active");
                    $("sendBtnIconWrap").innerHTML = PAPER_PLANE_SVG;
                    $("recordingBar").classList.remove("show");

                    if (audioChunks.length === 0) {
                        $("messageInput").style.display = "block";
                        return;
                    }

                    const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        pendingAudioBase64 = evt.target.result;
                        previewAudioObj.src = pendingAudioBase64;
                        $("previewPlayBtn").innerText = "▶";
                        $("previewDurationText").innerText = pendingAudioDurationStr;
                        $("messageInput").style.display = "none";
                        $("mainSendBtn").style.display = "none";
                        $("audioPreviewBar").classList.add("show");
                    };
                    reader.readAsDataURL(audioBlob);
                };

                mediaRecorder.start();
            } catch (err) {
                isVoiceHoldActive = false;
                $("mainSendBtn").classList.remove("recording-active");
                $("sendBtnIconWrap").innerHTML = PAPER_PLANE_SVG;
                $("recordingBar").classList.remove("show");
                $("messageInput").style.display = "block";
                alert("Microphone permission allow karein!");
            }
        }

        function stopVoiceNoteRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            } else {
                clearInterval(recTimerInterval);
                if (activeMicStream) {
                    activeMicStream.getTracks().forEach(t => t.stop());
                    activeMicStream = null;
                }
                $("mainSendBtn").classList.remove("recording-active");
                $("sendBtnIconWrap").innerHTML = PAPER_PLANE_SVG;
                $("recordingBar").classList.remove("show");
                $("messageInput").style.display = "block";
            }
        }

        window.togglePreviewAudioPlay = function() {
            if (!pendingAudioBase64) return;
            if (previewAudioObj.paused) {
                previewAudioObj.play();
                $("previewPlayBtn").innerText = "⏸";
            } else {
                previewAudioObj.pause();
                $("previewPlayBtn").innerText = "▶";
            }
        };

        window.discardRecordedAudio = function() {
            previewAudioObj.pause();
            previewAudioObj.src = "";
            pendingAudioBase64 = null;
            audioChunks = [];
            $("audioPreviewBar").classList.remove("show");
            $("messageInput").style.display = "block";
            $("mainSendBtn").style.display = "flex";
        };

        window.sendRecordedAudio = function() {
            if (!pendingAudioBase64 || !selectedUser) return;
            const msgData = {
                id: "msg_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                sender: currentUser,
                receiver: selectedUser,
                text: "🎤 Voice Message",
                mediaUrl: pendingAudioBase64,
                mediaType: "audio",
                audioDuration: pendingAudioDurationStr,
                fileName: "voice_note.webm",
                time: formatAMPM(new Date()),
                delivered: isPartnerOnline(selectedUser),
                seen: false
            };
            saveAndRender(msgData);
            socket.emit("private_message", msgData);
            discardRecordedAudio();
        };

        let activeChatAudio = null;
        let activeChatAudioId = null;

        window.toggleCustomChatAudio = function(e, msgId) {
            e.stopPropagation();
            const chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            const m = chats.find(c => String(c.id) === String(msgId));
            if (!m || !m.mediaUrl) return;

            const wrap = $(`custom_audio_${msgId}`);
            const btn = $(`custom_audio_btn_${msgId}`);
            const timeEl = $(`custom_audio_time_${msgId}`);

            if (activeChatAudio && activeChatAudioId === msgId) {
                if (activeChatAudio.paused) {
                    activeChatAudio.play();
                    if (btn) btn.innerText = "⏸";
                    if (wrap) wrap.classList.add("playing");
                } else {
                    activeChatAudio.pause();
                    if (btn) btn.innerText = "▶";
                    if (wrap) wrap.classList.remove("playing");
                }
                return;
            }

            if (activeChatAudio) {
                activeChatAudio.pause();
                const oldBtn = $(`custom_audio_btn_${activeChatAudioId}`);
                const oldWrap = $(`custom_audio_${activeChatAudioId}`);
                if (oldBtn) oldBtn.innerText = "▶";
                if (oldWrap) oldWrap.classList.remove("playing");
            }

            activeChatAudio = new Audio(m.mediaUrl);
            activeChatAudioId = msgId;

            activeChatAudio.ontimeupdate = () => {
                const sec = Math.floor(activeChatAudio.currentTime || 0);
                const mins = Math.floor(sec / 60);
                const rem = sec % 60;
                if (timeEl) timeEl.innerText = `${mins}:${rem < 10 ? '0' + rem : rem}`;
            };

            activeChatAudio.onended = () => {
                if (btn) btn.innerText = "▶";
                if (wrap) wrap.classList.remove("playing");
                if (timeEl) timeEl.innerText = m.audioDuration || "0:05";
            };

            activeChatAudio.play();
            if (btn) btn.innerText = "⏸";
            if (wrap) wrap.classList.add("playing");
        };

        // ==========================================
        // 8. ATTACHMENTS & MEDIA PREVIEW
        // ==========================================
        window.triggerFileSelect = function(inputId) {
            $("attachMenu").classList.remove("show");
            if (!selectedUser) {
                alert("Pehle koi chat select karein!");
                return;
            }
            $(inputId).click();
        };

        function setupMediaInputs() {
            const inputs = [
                { id: "cameraInput", mediaType: "image" },
                { id: "galleryInput", mediaType: "image" },
                { id: "videoInput", mediaType: "video" },
                { id: "audioInput", mediaType: "audio" },
                { id: "documentInput", mediaType: "document" }
            ];

            inputs.forEach(item => {
                const el = $(item.id);
                if (!el) return;
                el.addEventListener("change", function(e) {
                    const file = e.target.files[0];
                    if (!file || !selectedUser) return;
                    if (file.size > 10 * 1024 * 1024) {
                        alert("File size 10MB se kam honi chahiye!");
                        e.target.value = "";
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const base64Data = evt.target.result;
                        let detectedType = item.mediaType;
                        if (file.type.startsWith("image/")) detectedType = "image";
                        else if (file.type.startsWith("video/")) detectedType = "video";
                        else if (file.type.startsWith("audio/")) detectedType = "audio";

                        const msgData = {
                            id: "msg_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                            sender: currentUser,
                            receiver: selectedUser,
                            text: file.name,
                            mediaUrl: base64Data,
                            mediaType: detectedType,
                            fileName: file.name,
                            time: formatAMPM(new Date()),
                            delivered: isPartnerOnline(selectedUser),
                            seen: false
                        };
                        saveAndRender(msgData);
                        socket.emit("private_message", msgData);
                    };
                    reader.readAsDataURL(file);
                    e.target.value = "";
                });
            });
        }
        setupMediaInputs();

        window.openMediaPreview = function(url, type) {
            const overlay = $("mediaOverlay");
            const content = $("overlayContent");
            if (type === "image") {
                content.innerHTML = `<img src="${url}" alt="Preview">`;
            } else {
                content.innerHTML = `<iframe src="${url}"></iframe>`;
            }
            overlay.classList.add("show");
        };

        window.closeMediaPreview = function() {
            $("mediaOverlay").classList.remove("show");
            $("overlayContent").innerHTML = "";
        };

        // ==========================================
        // 9. SEND, RECEIVE & CORE LOGIC
        // ==========================================
        window.sendMessage = function() {
            const input = $("messageInput");
            const txt = input.value.trim();
            if (!txt || !selectedUser) return;

            const data = {
                id: "msg_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                sender: currentUser,
                receiver: selectedUser,
                text: txt,
                time: formatAMPM(new Date()),
                delivered: isPartnerOnline(selectedUser),
                seen: false
            };

            saveAndRender(data);
            socket.emit("private_message", data);
            socket.emit("stopTyping", currentUser);
            input.value = "";
            input.focus();
        };

        $("messageInput").addEventListener("input", handleTyping);
        $("messageInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function performLocalClear(partnerUser) {
            partnerUser = partnerUser.toLowerCase();
            let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            chats = chats.filter(c => {
                const s = (c.sender || "").toLowerCase();
                const r = (c.receiver || "").toLowerCase();
                return !((s === currentUser && r === partnerUser) || (s === partnerUser && r === currentUser));
            });
            localStorage.setItem("privateChats", JSON.stringify(chats));

            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (meta[partnerUser]) {
                meta[partnerUser].unread = 0;
                meta[partnerUser].lastMessage = "";
                localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
            }
            if (selectedUser === partnerUser) renderMessages();
            loadInbox();
        }

        window.clearAllChat = function() {
            if (!selectedUser) {
                alert("Pehle koi chat select karein!");
                return;
            }
            if (confirm(`@${selectedUser} ke sath dono side ki chat clear karein?`)) {
                performLocalClear(selectedUser);
                socket.emit("private_message", {
                    id: "clear_" + Date.now(),
                    sender: currentUser,
                    receiver: selectedUser,
                    text: "__CLEAR_CHAT__",
                    type: "clear_action",
                    time: formatAMPM(new Date())
                });
                socket.emit("clear_private_chat", { sender: currentUser, receiver: selectedUser });
            }
        };

        function saveAndRender(data) {
            if (!data) return;
            const sender = (data.sender || "").toLowerCase();
            const receiver = (data.receiver || "").toLowerCase();

            if (data.type === "presence_offline" || data.text === "__PRESENCE_OFFLINE__") {
                if (sender !== currentUser) setUserOnlineStatus(sender, false);
                return;
            }

            if (sender !== currentUser && sender !== "system") {
                setUserOnlineStatus(sender, true);
            }

            if (sender !== currentUser && receiver !== currentUser) return;

            if (data.type === "presence_ping" || data.text === "__PRESENCE_PING__") {
                if (sender !== currentUser && !document.hidden) {
                    socket.emit("private_message", {
                        id: "pong_" + Date.now(),
                        sender: currentUser,
                        receiver: sender,
                        type: "presence_pong",
                        text: "__PRESENCE_PONG__"
                    });
                }
                return;
            }

            if (data.type === "presence_pong" || data.text === "__PRESENCE_PONG__") {
                if (sender !== currentUser) setUserOnlineStatus(sender, true);
                return;
            }

            if (data.type === "clear_action" || data.text === "__CLEAR_CHAT__") {
                performLocalClear(sender === currentUser ? receiver : sender);
                return;
            }

            if (data.type === "unsend_action" || data.text === "__UNSEND_MSG__") {
                const targetId = data.targetMsgId;
                if (targetId) {
                    let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
                    chats = chats.filter(c => String(c.id) !== String(targetId));
                    localStorage.setItem("privateChats", JSON.stringify(chats));
                    renderMessages();
                    loadInbox();
                }
                return;
            }

            if (data.type === "reaction_action" || data.text === "__REACTION_MSG__") {
                const targetId = data.targetMsgId;
                if (targetId) {
                    let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
                    const m = chats.find(c => String(c.id) === String(targetId));
                    if (m) {
                        if (!m.reactions) m.reactions = {};
                        if (data.emoji) m.reactions[sender] = data.emoji;
                        else delete m.reactions[sender];
                        localStorage.setItem("privateChats", JSON.stringify(chats));
                        renderMessages();
                    }
                }
                return;
            }

            if (data.type === "delivered_receipt" || data.text === "__DELIVERED_RECEIPT__") {
                if (sender !== currentUser) markMyMessagesDeliveredTo(sender);
                return;
            }

            if (data.type === "seen_receipt" || data.text === "__SEEN_RECEIPT__") {
                if (sender !== currentUser) {
                    let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
                    let changed = false;
                    chats.forEach(c => {
                        if ((c.sender || "").toLowerCase() === currentUser && (c.receiver || "").toLowerCase() === sender && !c.seen) {
                            c.seen = true;
                            c.delivered = true;
                            c.seenAt = data.seenAt || formatAMPM(new Date());
                            changed = true;
                        }
                    });
                    if (changed) {
                        localStorage.setItem("privateChats", JSON.stringify(chats));
                        if (selectedUser === sender) renderMessages();
                    }
                }
                return;
            }

            const partner = sender === currentUser ? receiver : sender;
            addInbox(partner);

            let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            if (data.id && chats.some(c => String(c.id) === String(data.id))) return;

            if (sender !== currentUser) {
                if (selectedUser === sender) {
                    data.seen = true;
                    data.delivered = true;
                    data.seenAt = formatAMPM(new Date());
                    socket.emit("private_message", {
                        id: "seen_" + Date.now(),
                        sender: currentUser,
                        receiver: sender,
                        type: "seen_receipt",
                        text: "__SEEN_RECEIPT__",
                        seenAt: data.seenAt
                    });
                } else {
                    data.delivered = true;
                    socket.emit("private_message", {
                        id: "deliv_" + Date.now(),
                        sender: currentUser,
                        receiver: sender,
                        type: "delivered_receipt",
                        text: "__DELIVERED_RECEIPT__"
                    });
                }
            }

            chats.push(data);
            localStorage.setItem("privateChats", JSON.stringify(chats));

            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (!meta[partner]) meta[partner] = { unread: 0, lastMessage: "", lastTime: "", lastActivity: 0 };
            meta[partner].lastMessage = data.mediaType ? `📎 ${data.mediaType}` : data.text;
            meta[partner].lastTime = data.time;
            meta[partner].lastActivity = Date.now();

            if (sender !== currentUser && selectedUser !== sender) {
                meta[partner].unread = (meta[partner].unread || 0) + 1;
            }

            localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
            if (selectedUser === sender || selectedUser === receiver) renderMessages();
            loadInbox();
        }

        socket.on("receive_private_message", data => saveAndRender(data));
        socket.on("clear_private_chat", data => {
            if (!data) return;
            const sender = (data.sender || "").toLowerCase();
            const receiver = (data.receiver || "").toLowerCase();
            if (receiver === currentUser || sender === currentUser) {
                performLocalClear(sender === currentUser ? receiver : sender);
            }
        });
        socket.on("private_chat_created", data => {
            if (data && data.username) addInbox(data.username.toLowerCase());
        });

        function escapeHTML(str) {
            const div = document.createElement("div");
            div.textContent = str || "";
            return div.innerHTML;
        }

        function renderMediaContent(m) {
            if (!m.mediaUrl) return `<div>${escapeHTML(m.text)}</div>`;
            if (m.mediaType === "image") {
                return `<img src="${m.mediaUrl}" class="chat-media-img" alt="Image" onclick="openMediaPreview('${m.mediaUrl}', 'image')">`;
            }
            if (m.mediaType === "video") {
                return `<video src="${m.mediaUrl}" class="chat-media-video" controls controlsList="nodownload"></video>`;
            }
            if (m.mediaType === "audio") {
                const dur = m.audioDuration || "0:05";
                return `
                    <div class="custom-chat-audio" id="custom_audio_${m.id}">
                        <button type="button" class="custom-audio-play-btn" id="custom_audio_btn_${m.id}" onclick="toggleCustomChatAudio(event, '${m.id}')">▶</button>
                        <div class="audio-wave-decor">
                            <span style="height:6px"></span><span style="height:12px"></span><span style="height:8px"></span><span style="height:14px"></span><span style="height:9px"></span><span style="height:15px"></span><span style="height:7px"></span><span style="height:13px"></span><span style="height:10px"></span><span style="height:6px"></span><span style="height:12px"></span><span style="height:8px"></span>
                        </div>
                        <span class="custom-audio-time" id="custom_audio_time_${m.id}">${dur}</span>
                    </div>
                `;
            }
            return `<a href="${m.mediaUrl}" download="${escapeHTML(m.fileName || 'document')}" class="chat-media-doc"><span style="font-size:20px;">📄</span><span>${escapeHTML(m.fileName || m.text || "Download File")}</span></a>`;
        }

        function renderMessages() {
            const b = $("messages");
            if (!b) return;
            b.innerHTML = "";
            if (!selectedUser) return;

            const chats = JSON.parse(localStorage.getItem("privateChats")) || [];

            chats.filter(c => {
                const s = (c.sender || "").toLowerCase();
                const r = (c.receiver || "").toLowerCase();
                return (s === currentUser && r === selectedUser) || (s === selectedUser && r === currentUser);
            }).forEach(m => {
                if (m.type === "alert" || (m.sender && m.sender.toLowerCase() === "system")) {
                    b.insertAdjacentHTML("beforeend", `<div class="screenshot-alert">${escapeHTML(m.text)}</div>`);
                } else {
                    const isMy = (m.sender || "").toLowerCase() === currentUser;
                    const senderName = isMy ? "You" : `@${escapeHTML(m.sender)}`;

                    let tickHtml = "";
                    if (isMy) {
                        if (m.seen) tickHtml = `<span class="tick-icon seen">✓✓</span>`;
                        else if (m.delivered || isPartnerOnline(m.receiver)) tickHtml = `<span class="tick-icon">✓✓</span>`;
                        else tickHtml = `<span class="tick-icon">✓</span>`;
                    } else {
                        tickHtml = `<span class="tick-icon seen">✓✓</span>`;
                    }

                    const infoButtonHtml = isMy ? `
                        <button type="button" class="info-btn" title="Tap: Info | Hold: Unsend"
                            onpointerdown="onInfoDown(event, '${m.id}')"
                            onpointerup="onInfoUp(event, '${m.id}')"
                            onpointercancel="onInfoUp(event, '${m.id}')"
                            onclick="onInfoClick(event, '${m.id}')">ⓘ</button>
                    ` : "";

                    const unsendFloatingHtml = isMy ? `
                        <div class="unsend-tablet" id="unsend_tab_${m.id}">
                            <button type="button" class="unsend-action-btn" onclick="unsendMessage(event, '${m.id}')">🗑️ Unsend</button>
                        </div>
                    ` : "";

                    const emojiOptionsHtml = ALLOWED_EMOJIS.map(em =>
                        `<span class="react-emoji-opt" onclick="selectMessageReaction(event, '${m.id}', '${em}')">${em}</span>`
                    ).join("");

                    const reactionPickerHtml = `
                        <div class="reaction-picker-bar" id="react_picker_${m.id}" onclick="event.stopPropagation()">
                            ${emojiOptionsHtml}
                        </div>
                    `;

                    let reactionBadgeHtml = "";
                    if (m.reactions && Object.keys(m.reactions).length > 0) {
                        const reactEntries = Object.entries(m.reactions);
                        const emojisDisplay = reactEntries.map(([u, em]) => em).join("");
                        const detailsDisplay = reactEntries.map(([u, em]) => `<span>${em} <b>@${escapeHTML(u)}</b></span>`).join(" • ");

                        reactionBadgeHtml = `
                            <div class="msg-reaction-corner" onclick="toggleReactionDetailBubble(event, '${m.id}')">
                                ${emojisDisplay}
                            </div>
                            <div class="reaction-detail-bubble" id="react_detail_${m.id}" onclick="event.stopPropagation()">
                                ${detailsDisplay}
                            </div>
                        `;
                    }

                    b.insertAdjacentHTML("beforeend", `
                        <div class="msg ${isMy ? "my-msg" : "received-msg"}"
                            onpointerdown="onMsgBubbleDown(event, '${m.id}')"
                            onpointerup="onMsgBubbleUp()"
                            onpointercancel="onMsgBubbleUp()">
                            ${unsendFloatingHtml}
                            ${reactionPickerHtml}
                            <div class="msg-sender">${senderName}</div>
                            ${renderMediaContent(m)}
                            <div class="msg-meta">
                                <span>${m.time}</span>
                                ${tickHtml}
                                ${infoButtonHtml}
                            </div>
                            ${reactionBadgeHtml}
                        </div>
                    `);
                }
            });

            b.scrollTop = b.scrollHeight;
        }

        window.logout = function() {
            if (confirm("Confirm to LogOut !!!")) {
                broadcastPagePresence(false);
                localStorage.clear();
                sessionStorage.clear();
                window.location.replace("login.html");
            }
        };
    </script>

    <script src="js/mediaManager.js"></script>
    <script src="js/attachments.js"></script>

    <script>
        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("selectstart", e => {
            if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") e.preventDefault();
        });
        document.addEventListener("copy", e => e.preventDefault());
        document.addEventListener("cut", e => e.preventDefault());
        document.addEventListener("dragstart", e => e.preventDefault());
    </script>
</body>
