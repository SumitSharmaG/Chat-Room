<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private Chat</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#0f0f0f;
            color:white;
            height:100vh;
            overflow:hidden;
        }

        .container{
            display:flex;
            height:100vh;
            width:100%;
        }

        /* SIDEBAR */

        .sidebar{
            width:320px;
            min-width:280px;
            background:#121212;
            border-right:1px solid #232323;
            display:flex;
            flex-direction:column;
        }

        .sidebar-header{
            padding:18px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid #232323;
        }

        .sidebar-header h2{
            color:#d4af6a;
            font-size:24px;
        }

        .header-right{
            display:flex;
            align-items:center;
            gap:10px;
        }

        #addBtn{
            width:36px;
            height:36px;
            border:none;
            border-radius:50%;
            background:#d4af6a;
            color:black;
            font-size:24px;
            cursor:pointer;
            font-weight:bold;
        }

        .online-dot{
            width:12px;
            height:12px;
            background:#3cff9b;
            border-radius:50%;
            box-shadow:0 0 10px #3cff9b;
        }

        /* SEARCH BOX */

        #searchBox{
            display:none;
            padding:12px;
            border-bottom:1px solid #232323;
        }

        #usernameInput{
            width:100%;
            padding:12px;
            border:none;
            outline:none;
            border-radius:12px;
            background:#1d1d1d;
            color:white;
            font-size:15px;
        }

        #startBtn{
            width:100%;
            margin-top:10px;
            padding:12px;
            border:none;
            border-radius:12px;
            background:#d4af6a;
            font-weight:bold;
            cursor:pointer;
        }

        /* USER LIST */

        .user-list{
            flex:1;
            overflow-y:auto;
            padding:12px;
        }

        .user{
            background:#1b1b1b;
            padding:14px;
            border-radius:14px;
            margin-bottom:10px;
            cursor:pointer;
            transition:0.3s;
        }

        .user:hover{
            background:#242424;
        }

        /* CHAT AREA */

        .chat-area{
            flex:1;
            display:flex;
            flex-direction:column;
            background:#0f0f0f;
        }

        .chat-header{
            padding:18px;
            border-bottom:1px solid #232323;
            background:#151515;
            color:#d4af6a;
            font-weight:bold;
            display:flex;
            align-items:center;
            gap:15px;
        }

        #backBtn{
            display:none;
            background:none;
            border:none;
            color:#d4af6a;
            font-size:24px;
            cursor:pointer;
        }

        #messages{
            flex:1;
            overflow-y:auto;
            padding:18px;
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .message{
            background:#1f1f1f;
            padding:12px 15px;
            border-radius:14px;
            max-width:80%;
            word-wrap:break-word;
        }

        .my-message{
            align-self:flex-end;
            background:#d4af6a;
            color:black;
        }

        /* SEND BOX */

        .send-box{
            padding:15px;
            display:flex;
            gap:10px;
            border-top:1px solid #232323;
            background:#111;
        }

        #messageInput{
            flex:1;
            padding:14px;
            border:none;
            outline:none;
            border-radius:14px;
            background:#1d1d1d;
            color:white;
            font-size:15px;
        }

        .send-box button{
            width:58px;
            border:none;
            border-radius:14px;
            background:#d4af6a;
            font-size:20px;
            cursor:pointer;
            font-weight:bold;
        }

        /* MOBILE VIEW */

        @media(max-width:768px){

            .container{
                flex-direction:column;
            }

            .sidebar{
                width:100%;
                min-width:100%;
                height:100vh;
            }

            .chat-area{
                display:none;
                height:100vh;
            }

            .chat-area.active{
                display:flex;
            }

            #backBtn{
                display:block;
            }

            .message{
                max-width:90%;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <div class="sidebar-header">

                <h2>Private Chats</h2>

                <div class="header-right">

                    <button
                        onclick="openSearchBox()"
                        id="addBtn"
                    >
                        +
                    </button>

                    <div class="online-dot"></div>

                </div>

            </div>


            <!-- SEARCH BOX -->

            <div id="searchBox">

                <input
                    type="text"
                    id="usernameInput"
                    placeholder="@username"
                >

                <button
                    id="startBtn"
                    onclick="addUser()"
                >
                    Start Chat
                </button>

            </div>


            <!-- USER LIST -->

            <div
                class="user-list"
                id="userList"
            ></div>

        </div>



        <!-- CHAT AREA -->

        <div class="chat-area">

            <div class="chat-header">

                <button
                    id="backBtn"
                    onclick="goBack()"
                >
                    ←
                </button>

                <span id="chatWith">
                    Select a contact
                </span>

            </div>


            <!-- MESSAGES -->

            <div id="messages"></div>


            <!-- SEND BOX -->

            <div class="send-box">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type message..."
                >

                <button
                    onclick="sendPrivateMessage()"
                >
                    ➤
                </button>

            </div>

        </div>

    </div>



    <!-- SOCKET -->

    <script src="/socket.io/socket.io.js"></script>

    <script>

        const socket = io();

        const currentUser =
            localStorage.getItem("username") || "@guest";

        let selectedUser = "";



        // SEARCH BOX

        function openSearchBox(){

            const box =
                document.getElementById("searchBox");

            if(box.style.display === "block"){

                box.style.display = "none";

            }else{

                box.style.display = "block";
            }
        }



        // ADD USER

        function addUser(){

            const username =
                document.getElementById(
                    "usernameInput"
                ).value.trim();

            if(!username) return;


            const userList =
                document.getElementById("userList");


            // DUPLICATE CHECK

            const alreadyExists =
                document.getElementById(
                    "user-" + username
                );

            if(alreadyExists){

                selectUser(username);

                return;
            }


            // CREATE USER

            const div =
                document.createElement("div");

            div.classList.add("user");

            div.id =
                "user-" + username;

            div.innerText = username;


            div.onclick = () => {

                selectUser(username);

            };


            userList.appendChild(div);


            // SAVE USER LIST

            let users =
                JSON.parse(
                    localStorage.getItem("chatUsers")
                ) || [];

            users.push(username);

            localStorage.setItem(
                "chatUsers",
                JSON.stringify(users)
            );


            // AUTO OPEN CHAT

            selectUser(username);


            // CLEAR INPUT

            document.getElementById(
                "usernameInput"
            ).value = "";


            // CLOSE SEARCH

            document.getElementById(
                "searchBox"
            ).style.display = "none";

        }



        // LOAD USERS AFTER REFRESH

        window.addEventListener("load", () => {

            const users =
                JSON.parse(
                    localStorage.getItem("chatUsers")
                ) || [];

            users.forEach((username) => {

                const div =
                    document.createElement("div");

                div.classList.add("user");

                div.id =
                    "user-" + username;

                div.innerText = username;

                div.onclick = () => {

                    selectUser(username);

                };

                document
                    .getElementById("userList")
                    .appendChild(div);

            });

        });



        // SELECT USER

        function selectUser(username){

            selectedUser = username;

            document.getElementById(
                "chatWith"
            ).innerText =
                "Chat with " + username;

            loadMessages();


            // MOBILE VIEW

            if(window.innerWidth <= 768){

                document.querySelector(
                    ".sidebar"
                ).style.display = "none";

                document.querySelector(
                    ".chat-area"
                ).classList.add("active");
            }
        }



        // BACK BUTTON

        function goBack(){

            if(window.innerWidth <= 768){

                document.querySelector(
                    ".sidebar"
                ).style.display = "flex";

                document.querySelector(
                    ".chat-area"
                ).classList.remove("active");
            }
        }



        // LOAD MESSAGES

        function loadMessages(){

            const messagesDiv =
                document.getElementById("messages");

            messagesDiv.innerHTML = "";


            const chats =
                JSON.parse(
                    localStorage.getItem("privateChats")
                ) || [];


            chats.forEach((chat) => {

                if(

                    (
                        chat.sender === currentUser &&
                        chat.receiver === selectedUser
                    )

                    ||

                    (
                        chat.sender === selectedUser &&
                        chat.receiver === currentUser
                    )

                ){

                    const div =
                        document.createElement("div");

                    div.classList.add("message");

                    if(chat.sender === currentUser){

                        div.classList.add("my-message");
                    }

                    div.innerHTML =
                        `<b>${chat.sender}</b><br>${chat.text}`;

                    messagesDiv.appendChild(div);
                }

            });


            messagesDiv.scrollTop =
                messagesDiv.scrollHeight;
        }



        // SEND MESSAGE

        function sendPrivateMessage(){

            if(!selectedUser) return;


            const input =
                document.getElementById("messageInput");

            const text =
                input.value.trim();

            if(!text) return;


            const data = {

                sender: currentUser,
                receiver: selectedUser,
                text: text

            };


            // SOCKET SEND

            socket.emit(
                "private_message",
                data
            );


            // SAVE LOCAL

            const oldChats =
                JSON.parse(
                    localStorage.getItem("privateChats")
                ) || [];

            oldChats.push(data);

            localStorage.setItem(
                "privateChats",
                JSON.stringify(oldChats)
            );


            input.value = "";

            loadMessages();
        }



        // RECEIVE MESSAGE

        socket.on(
            "receive_private_message",
            (data) => {

                if(
    data.receiver === currentUser
    ||
    data.sender === currentUser
)

                    const oldChats =
                        JSON.parse(
                            localStorage.getItem("privateChats")
                        ) || [];

                    oldChats.push(data);

                    localStorage.setItem(
                        "privateChats",
                        JSON.stringify(oldChats)
                    );

                    loadMessages();
                }

            }
        );

    </script>

</body>
    </html>
