<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
        body { background:#0f0f0f; color:white; height:100vh; overflow:hidden; }
        .app { display:flex; height:100vh; width:100%; }
        
        /* Sidebar & Search */
        .sidebar { width:320px; background:#121212; border-right:1px solid #222; display:flex; flex-direction:column; }
        .top { padding:16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222; }
        .top h2 { color:#d4af6a; }
        .add-btn { width:38px; height:38px; border:none; border-radius:50%; background:#d4af6a; cursor:pointer; font-size:24px; }
        .search-box { display:none; padding:12px; border-bottom:1px solid #222; }
        .search-box input, .send-box input { width:100%; padding:12px; border:none; border-radius:12px; background:#1d1d1d; color:white; outline:none; }
        .search-box button { width:100%; margin-top:8px; padding:10px; background:#d4af6a; border:none; border-radius:12px; cursor:pointer; font-weight:bold; }

        /* Inbox & Chat Area */
        .inbox-list { flex:1; overflow-y:auto; padding:12px; }
        .inbox { background:#1b1b1b; padding:14px; border-radius:14px; margin-bottom:10px; cursor:pointer; transition:0.3s; }
        .inbox:hover { background:#262626; }
        .chat-area { flex:1; display:flex; flex-direction:column; background:#0f0f0f; }
        .chat-header { padding:16px; background:#151515; border-bottom:1px solid #222; color:#d4af6a; font-weight:bold; display:flex; gap:15px; }
        .back-btn { display:none; background:none; border:none; color:#d4af6a; font-size:24px; cursor:pointer; }

        /* Messages */
        .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
        .msg { max-width:80%; background:#1d1d1d; padding:12px; border-radius:14px; line-height:1.4; word-wrap:break-word; }
        .my-msg { align-self:flex-end; background:#d4af6a; color:black; }
        .send-box { padding:14px; display:flex; gap:10px; background:#111; border-top:1px solid #222; }
        .send-box button { width:60px; border-radius:14px; border:none; background:#d4af6a; cursor:pointer; font-size:20px; }

        @media(max-width:768px){
            .sidebar { width:100%; }
            .chat-area { display:none; width:100%; position:fixed; top:0; left:0; height:100%; z-index:99; }
            .back-btn { display:block; }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="sidebar" id="sidebar">
        <div class="top"><h2>Private</h2><button class="add-btn" onclick="toggleSearch()">+</button></div>
        <div class="search-box" id="searchBox">
            <input type="text" id="usernameInput" placeholder="username">
            <button onclick="startChat()">Start Chat</button>
        </div>
        <div class="inbox-list" id="inboxList"></div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="chat-header">
            <button class="back-btn" onclick="goBack()">←</button>
            <span id="chatTitle">Select Chat</span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="send-box">
            <input type="text" id="messageInput" placeholder="Type message...">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const $ = id => document.getElementById(id);
    const socket = io("https://chat-backend-gtg5.onrender.com", { transports: ["websocket"] });
    const currentUser = localStorage.getItem("username") || "guest";
    let selectedUser = "";

    socket.on("connect", () => {
        socket.emit("userJoined", currentUser);
        loadInbox();
    });

    const toggleSearch = () => $("searchBox").style.display = ($("searchBox").style.display === "block" ? "none" : "block");

    function startChat() {
        const user = $("usernameInput").value.trim().replace("@","");
        if (!user) return;
        addInbox(user);
        openChat(user);
        $("usernameInput").value = "";
        $("searchBox").style.display = "none";
    }

    function addInbox(user) {
        let users = JSON.parse(localStorage.getItem("privateUsers")) || [];
        if (!users.includes(user)) {
            users.push(user);
            localStorage.setItem("privateUsers", JSON.stringify(users));
            renderInbox(user);
        }
    }

    function renderInbox(user) {
        const div = document.createElement("div");
        div.className = "inbox";
        div.innerText = "@" + user;
        div.onclick = () => openChat(user);
        $("inboxList").appendChild(div);
    }

    function loadInbox() {
        $("inboxList").innerHTML = "";
        (JSON.parse(localStorage.getItem("privateUsers")) || []).forEach(renderInbox);
    }

    function openChat(user) {
        selectedUser = user;
        $("chatTitle").innerText = "Chat with @" + user;
        loadMessages();
        if (window.innerWidth <= 768) {
            $("sidebar").style.display = "none";
            $("chatArea").style.display = "flex";
        }
    }

    const goBack = () => { $("sidebar").style.display = "flex"; $("chatArea").style.display = "none"; };

    function loadMessages() {
        const box = $("messages");
        box.innerHTML = "";
        const chats = JSON.parse(localStorage.getItem("privateChats")) || [];
        chats.filter(c => (c.sender === currentUser && c.receiver === selectedUser) || (c.sender === selectedUser && c.receiver === currentUser))
             .forEach(chat => {
                const div = document.createElement("div");
                div.className = `msg ${chat.sender === currentUser ? 'my-msg' : ''}`;
                div.innerHTML = `<b>@${chat.sender}</b><br>${chat.text}`;
                box.appendChild(div);
             });
        box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
        const text = $("messageInput").value.trim();
        if (!text || !selectedUser) return;
        socket.emit("private_message", { sender: currentUser, receiver: selectedUser, text });
        $("messageInput").value = "";
    }

    socket.on("receive_private_message", (data) => {
        const me = currentUser.replace("@","");
        if (data.receiver === me || data.sender === me) {
            let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            chats.push(data);
            localStorage.setItem("privateChats", JSON.stringify(chats));
            const other = data.sender === me ? data.receiver : data.sender;
            addInbox(other);
            if (selectedUser === other) loadMessages();
        }
    });

    $("messageInput").onkeydown = (e) => e.key === "Enter" && sendMessage();
</script>
</body>
</html>
