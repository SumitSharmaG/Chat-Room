<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private Chat</title>

    <link rel="stylesheet" href="style.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#0f0f0f;
            color:white;
            height:100vh;
            overflow:hidden;
        }

        .container{
            display:flex;
            height:100vh;
        }

        /* SIDEBAR */

        .sidebar{
            width:35%;
            background:#111;
            border-right:1px solid #222;
            display:flex;
            flex-direction:column;
        }

        .sidebar-header{
            padding:20px;
            border-bottom:1px solid #222;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .sidebar-header h2{
            color:#d4af6a;
            font-size:28px;
        }

        .header-right{
            display:flex;
            gap:10px;
            align-items:center;
        }

        #addBtn{
            width:35px;
            height:35px;
            border:none;
            border-radius:50%;
            background:#d4af6a;
            color:black;
            font-size:22px;
            cursor:pointer;
            font-weight:bold;
        }

        .online-dot{
            width:12px;
            height:12px;
            border-radius:50%;
            background:#3cff9b;
            box-shadow:0 0 10px #3cff9b;
        }

        /* SEARCH BOX */

        #searchBox{
            display:none;
            padding:10px;
            border-bottom:1px solid #222;
        }

        #usernameInput{
            width:100%;
            padding:12px;
            border:none;
            outline:none;
            border-radius:10px;
            background:#1c1c1c;
            color:white;
        }

        #startBtn{
            width:100%;
            margin-top:10px;
            padding:10px;
            border:none;
            border-radius:10px;
            background:#d4af6a;
            font-weight:bold;
            cursor:pointer;
        }

        /* USER LIST */

        .user-list{
            padding:15px;
            overflow-y:auto;
        }

        .user{
            background:#1a1a1a;
            padding:14px;
            border-radius:10px;
            margin-bottom:10px;
            cursor:pointer;
            transition:0.3s;
        }

        .user:hover{
            background:#242424;
        }

        /* CHAT AREA */

        .chat-area{
            width:65%;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
        }

        .chat-header{
            padding:20px;
            border-bottom:1px solid #222;
            color:#d4af6a;
            font-weight:bold;
            background:#121212;
        }

        #messages{
            flex:1;
            overflow-y:auto;
            padding:20px;
        }

        .message{
            background:#1c1c1c;
            padding:10px 14px;
            border-radius:10px;
            margin-bottom:10px;
            width:fit-content;
            max-width:80%;
        }

        .my-message{
            margin-left:auto;
            background:#d4af6a;
            color:black;
        }

        /* SEND BOX */

        .send-box{
            display:flex;
            gap:10px;
            padding:15px;
            border-top:1px solid #222;
            background:#111;
        }

        #messageInput{
            flex:1;
            padding:14px;
            border:none;
            outline:none;
            border-radius:12px;
            background:#1c1c1c;
            color:white;
            font-size:16px;
        }

        .send-box button{
            width:60px;
            border:none;
            border-radius:12px;
            background:#d4af6a;
            cursor:pointer;
            font-size:20px;
            font-weight:bold;
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT SIDEBAR -->

        <div class="sidebar">

            <div class="sidebar-header">

                <h2>Private Chats</h2>

                <div class="header-right">

                    <button
                        onclick="openSearchBox()"
                        id="addBtn"
                    >
                        +
                    </button>

                    <div class="online-dot"></div>

                </div>

            </div>


            <!-- SEARCH USER -->

            <div id="searchBox">

                <input
                    type="text"
                    id="usernameInput"
                    placeholder="@username"
                >

                <button
                    id="startBtn"
                    onclick="addUser()"
                >
                    Start Chat
                </button>

            </div>


            <!-- USER LIST -->

            <div class="user-list" id="userList"></div>

        </div>



        <!-- RIGHT CHAT AREA -->

        <div class="chat-area">

            <div class="chat-header" id="chatWith">
                Select a contact to start
            </div>

            <div id="messages"></div>


            <!-- SEND MESSAGE -->

            <div class="send-box">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type message..."
                >

                <button onclick="sendPrivateMessage()">
                    ➤
                </button>

            </div>

        </div>

    </div>



    <!-- SOCKET -->

    <script src="/socket.io/socket.io.js"></script>

    <script>

        const socket = io();

        const currentUser =
            localStorage.getItem("username") || "@guest";

        let selectedUser = "";



        // OPEN SEARCH BOX

        function openSearchBox(){

            const box =
                document.getElementById("searchBox");

            if(box.style.display === "none"){

                box.style.display = "block";

            }else{

                box.style.display = "none";
            }
        }



        // ADD USER TO SIDEBAR

        function addUser(){

            const username =
                document.getElementById(
                    "usernameInput"
                ).value.trim();

            if(!username) return;


            const userList =
                document.getElementById("userList");


            // CHECK DUPLICATE

            const alreadyExists =
                document.getElementById(username);

            if(alreadyExists){

                selectUser(username);

                return;
            }


            // CREATE USER DIV

            const div =
                document.createElement("div");

            div.classList.add("user");

            div.id = username;

            div.innerText = username;


            div.onclick = () => {

                selectUser(username);

            };


            userList.appendChild(div);


            // SAVE USER LIST

            let users =
                JSON.parse(
                    localStorage.getItem("chatUsers")
                ) || [];

            users.push(username);

            localStorage.setItem(
                "chatUsers",
                JSON.stringify(users)
            );


            // AUTO OPEN CHAT

            selectUser(username);


            // CLEAR INPUT

            document.getElementById(
                "usernameInput"
            ).value = "";


            // CLOSE SEARCH BOX

            document.getElementById(
                "searchBox"
            ).style.display = "none";

        }



        // LOAD USER LIST AFTER REFRESH

        window.addEventListener("load", () => {

            const users =
                JSON.parse(
                    localStorage.getItem("chatUsers")
                ) || [];

            users.forEach((username) => {

                const div =
                    document.createElement("div");

                div.classList.add("user");

                div.id = username;

                div.innerText = username;

                div.onclick = () => {

                    selectUser(username);

                };

                document
                    .getElementById("userList")
                    .appendChild(div);

            });

        });



        // SELECT USER

        function selectUser(username){

            selectedUser = username;

            document.getElementById(
                "chatWith"
            ).innerText =
                "Chat with " + username;

            loadMessages();
        }



        // LOAD OLD MESSAGES

        function loadMessages(){

            const messagesDiv =
                document.getElementById("messages");

            messagesDiv.innerHTML = "";

            const chats =
                JSON.parse(
                    localStorage.getItem("privateChats")
                ) || [];

            chats.forEach((chat) => {

                if(

                    (
                        chat.sender === currentUser &&
                        chat.receiver === selectedUser
                    )

                    ||

                    (
                        chat.sender === selectedUser &&
                        chat.receiver === currentUser
                    )

                ){

                    const div =
                        document.createElement("div");

                    div.classList.add("message");

                    if(chat.sender === currentUser){

                        div.classList.add("my-message");
                    }

                    div.innerHTML =
                        `<b>${chat.sender}</b><br>${chat.text}`;

                    messagesDiv.appendChild(div);
                }

            });

        }



        // SEND MESSAGE

        function sendPrivateMessage(){

            if(!selectedUser) return;

            const input =
                document.getElementById("messageInput");

            const text =
                input.value.trim();

            if(!text) return;

            const data = {

                sender: currentUser,
                receiver: selectedUser,
                text: text

            };


            // SOCKET SEND

            socket.emit(
                "private_message",
                data
            );


            // SAVE LOCAL

            const oldChats =
                JSON.parse(
                    localStorage.getItem("privateChats")
                ) || [];

            oldChats.push(data);

            localStorage.setItem(
                "privateChats",
                JSON.stringify(oldChats)
            );


            input.value = "";

            loadMessages();
        }



        // RECEIVE MESSAGE

        socket.on(
            "receive_private_message",
            (data) => {

                if(
                    data.receiver === currentUser
                ){

                    const oldChats =
                        JSON.parse(
                            localStorage.getItem("privateChats")
                        ) || [];

                    oldChats.push(data);

                    localStorage.setItem(
                        "privateChats",
                        JSON.stringify(oldChats)
                    );

                    loadMessages();

                }

            }
        );

    </script>

</body>
    </html>
