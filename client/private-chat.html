<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "login.html";
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Private Chat Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0a;
            --bg-card: #141414;
            --accent-gold: #b59461;
            --accent-red: #ff4d4d;
            --text-main: #e0e0e0;
            --my-chat-bg: rgba(181, 148, 97, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        @media print {
            body { display: none !important; }
        }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            height: 100dvh;
            overflow: hidden;
            width: 100%;
            position: fixed;
        }

        .app {
            display: flex;
            height: 100dvh;
            width: 100%;
            position: relative;
        }

        /* SIDEBAR */
        .sidebar {
            width: 340px;
            background: #121212;
            border-right: 1px solid rgba(181, 148, 97, 0.2);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
            z-index: 2;
        }

        .top {
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(181, 148, 97, 0.2);
            height: 70px;
            background: var(--bg-card);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-back-btn {
            background: rgba(181, 148, 97, 0.12);
            border: 1px solid rgba(181, 148, 97, 0.4);
            color: var(--accent-gold);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .page-back-btn:active {
            transform: scale(0.95);
        }

        .home-link {
            text-decoration: none;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .top h2 {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold);
            font-size: 1.05rem;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 35px;
            height: 35px;
            border: 1px solid rgba(181, 148, 97, 0.35);
            border-radius: 50%;
            background: #1d1d1d;
            color: var(--accent-gold);
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 50%;
            background: var(--accent-gold);
            color: #000;
            cursor: pointer;
            font-weight: bold;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* NEW CHAT & FILTER SEARCH BOXES */
        #searchBox, #inboxFilterBox {
            display: none;
            padding: 12px;
            background: #161616;
            border-bottom: 1px solid #222;
        }

        #usernameInput, #inboxSearchInput {
            width: 100%;
            padding: 10px 12px;
            background: #1d1d1d;
            color: white;
            border: 1px solid rgba(181, 148, 97, 0.4);
            border-radius: 8px;
            outline: none;
            font-size: 13px;
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        #usernameStatus {
            font-size: 11px;
            margin-top: 6px;
            min-height: 16px;
            color: #ff6b6b;
        }

        #startChatBtn {
            width: 100%;
            margin-top: 6px;
            padding: 9px;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        /* INBOX LIST & 3-DOT MENU */
        .inbox-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            padding-bottom: 80px;
        }

        .inbox {
            background: #1b1b1b;
            padding: 13px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .inbox:hover, .inbox.active {
            border-color: var(--accent-gold);
            background: #222;
        }

        .inbox.pinned-chat {
            border-left: 3px solid var(--accent-gold);
            background: #1e1c18;
        }

        .inbox-right {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .three-dot-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 18px;
            font-weight: bold;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .three-dot-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-gold);
        }

        .inbox-dropdown {
            position: absolute;
            right: 0;
            top: 34px;
            background: #181818;
            border: 1px solid rgba(181, 148, 97, 0.4);
            border-radius: 10px;
            width: 175px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            z-index: 9999;
            overflow: hidden;
        }

        .inbox-dropdown.show {
            display: flex;
        }

        .dropdown-item {
            padding: 10px 12px;
            font-size: 12px;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            width: 100%;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: #252525;
            color: var(--accent-gold);
        }

        .dropdown-item.delete-opt {
            color: var(--accent-red);
        }

        .dropdown-item.delete-opt:hover {
            background: rgba(255, 77, 77, 0.12);
        }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            background-image: radial-gradient(at 0% 0%, rgba(30, 20, 16, 0.4) 0px, transparent 50%);
            height: 100%;
            z-index: 1;
            position: relative;
        }

        .chat-header {
            padding: 10px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(181, 148, 97, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .back-btn {
            display: none;
            background: none;
            border: none;
            color: var(--accent-gold);
            font-size: 22px;
            cursor: pointer;
            padding-right: 6px;
        }

        #chatTitle {
            color: var(--accent-gold);
            font-weight: 600;
            font-size: 15px;
        }

        .header-btn {
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
        }

        .clear-btn {
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .logout-btn {
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }

        /* MESSAGES */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 85%;
            width: fit-content;
            padding: 10px 15px;
            border-radius: 15px 15px 15px 2px;
            word-wrap: break-word;
            font-size: 14px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .received-msg {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .my-msg {
            background: var(--my-chat-bg);
            color: var(--text-main);
            align-self: flex-end;
            border-radius: 15px 15px 2px 15px;
            border: 1px solid var(--accent-gold);
        }

        .msg-sender {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent-gold);
            margin-bottom: 4px;
        }

        /* SYSTEM & SCREENSHOT ALERT STYLE */
        .system-alert {
            background: #f1c40f;
            color: #000;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            text-align: center;
            align-self: center;
            font-weight: 600;
            margin: 5px 0;
            max-width: 90%;
            box-shadow: 0 2px 10px rgba(241, 196, 15, 0.25);
        }

        .msg-meta {
            font-size: 10px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 6px;
            opacity: 0.85;
            gap: 4px;
        }

        .info-btn {
            background: transparent;
            border: 0px solid #b59461;
            color: #b59461;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin-left: 6px;
        }

        .info-btn:hover {
            background: #b59461;
            color: black;
        }

        /* MEDIA ITEMS INSIDE CHAT */
        .chat-media-img {
            max-width: 240px;
            max-height: 240px;
            border-radius: 10px;
            margin-top: 4px;
            cursor: pointer;
            object-fit: cover;
            border: 1px solid rgba(181, 148, 97, 0.3);
        }

        .chat-media-video {
            max-width: 250px;
            max-height: 240px;
            border-radius: 10px;
            margin-top: 4px;
            background: #000;
        }

        .chat-media-audio {
            width: 230px;
            height: 38px;
            margin-top: 4px;
        }

        .chat-media-doc {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.35);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(181, 148, 97, 0.3);
            margin-top: 4px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
        }

        /* INPUT AREA & ATTACHMENT UI */
        .send-box {
            padding: 10px 12px;
            background: var(--bg-card);
            border-top: 1px solid rgba(181, 148, 97, 0.15);
            display: flex;
            gap: 10px;
            align-items: center;
            padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            position: relative;
        }

        .attach-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: #202020;
            color: #b59461;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            pointer-events: auto !important;
        }

        .attach-btn:active {
            transform: scale(.95);
        }

        .attach-menu {
            position: absolute;
            bottom: 72px;
            left: 12px;
            background: #141414;
            border: 1px solid rgba(181, 148, 97, .3);
            border-radius: 16px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 99999 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,.6);
            pointer-events: auto !important;
        }

        .attach-menu.show {
            display: flex !important;
        }

        .attach-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
        }

        .attach-item:hover {
            background: #202020;
        }

        .attach-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a2a2a;
            font-size: 18px;
            pointer-events: none;
        }

        .attach-item span {
            pointer-events: none;
            font-size: 13px;
        }

        .send-box input {
            flex: 1;
            min-width: 0;
            padding: 12px 18px;
            border: 1px solid rgba(181, 148, 97, 0.3);
            outline: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 14px;
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: var(--accent-gold);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* FULL SCREEN MEDIA OVERLAY */
        .media-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .media-overlay.show {
            display: flex;
            opacity: 1;
        }
        .media-overlay img {
            max-width: 90%;
            max-height: 80dvh;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            object-fit: contain;
        }
        .media-overlay iframe {
            width: 90%;
            height: 85dvh;
            border: none;
            background: #fff;
            border-radius: 12px;
        }
        .close-overlay-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 1.5rem;
            width: 45px; height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* RESPONSIVE MOBILE + PC LOGIC */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                left: 0;
                top: 0;
            }
            .chat-area {
                width: 100%;
                position: absolute;
                left: 0;
                top: 0;
                display: none;
            }
            .app.mobile-chat-open .sidebar {
                display: none;
            }
            .app.mobile-chat-open .chat-area {
                display: flex;
            }
            .back-btn {
                display: inline-block;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="app" id="appContainer">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="top">
                <div class="nav-left">
                    <button class="page-back-btn" onclick="navigateBack()" title="Go Back">←</button>
                    <a href="https://chat-room-three-pied.vercel.app/" class="home-link" title="Home">🏠</a>
                </div>
                <h2>Private Chats</h2>
                <div class="top-actions">
                    <!-- Search Icon 🔎 next to + Icon -->
                    <button class="icon-btn" onclick="toggleInboxFilter()" title="Search Inbox">🔎</button>
                    <button class="add-btn" onclick="toggleSearch()" title="New Chat">+</button>
                </div>
            </div>

            <!-- INBOX SEARCH FILTER BOX (🔎) -->
            <div id="inboxFilterBox">
                <input type="text" id="inboxSearchInput" placeholder="🔎 Search user or nickname..." autocomplete="off" oninput="loadInbox()">
            </div>

            <!-- NEW CHAT USERNAME BOX (+) WITH VALIDATION -->
            <div id="searchBox">
                <input type="text" id="usernameInput" placeholder="Enter username (e.g. rahul_01)" autocomplete="off">
                <div id="usernameStatus"></div>
                <button id="startChatBtn" onclick="startChat()" disabled>Start Chat</button>
            </div>

            <div class="inbox-list" id="inboxList"></div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-area" id="chatArea">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:8px;">
                    <button class="back-btn" onclick="goBack()">←</button>
                    <div>
                        <span id="chatTitle">Select a Chat</span><br>
                        <span id="typing-indicator" style="font-size:11px; color:var(--accent-gold); display:none;">typing...</span>
                    </div>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <span style="font-size:12px; color:var(--accent-gold); margin-right:4px;">👁️ <span id="online-count">0</span></span>
                    <button class="header-btn clear-btn" onclick="clearAllChat()">Clear</button>
                    <button class="header-btn logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <!-- INPUT AREA WITH + MEDIA BUTTON -->
            <div class="send-box">
                <button class="attach-btn" id="attachBtn" onclick="event.stopPropagation(); document.getElementById('attachMenu').classList.toggle('show');">
                    +
                </button>
                <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>

                <!-- ATTACH MENU POPUP -->
                <div class="attach-menu" id="attachMenu">
                    <div class="attach-item" onclick="event.stopPropagation(); triggerFileSelect('cameraInput');">
                        <div class="attach-icon">📷</div>
                        <span>Camera</span>
                    </div>
                    <div class="attach-item" onclick="event.stopPropagation(); triggerFileSelect('galleryInput');">
                        <div class="attach-icon">🖼️</div>
                        <span>Gallery</span>
                    </div>
                    <div class="attach-item" onclick="event.stopPropagation(); triggerFileSelect('videoInput');">
                        <div class="attach-icon">🎥</div>
                        <span>Video</span>
                    </div>
                    <div class="attach-item" onclick="event.stopPropagation(); triggerFileSelect('audioInput');">
                        <div class="attach-icon">🎵</div>
                        <span>Audio</span>
                    </div>
                    <div class="attach-item" onclick="event.stopPropagation(); triggerFileSelect('documentInput');">
                        <div class="attach-icon">📄</div>
                        <span>Document</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Native System Input Channels -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="galleryInput" accept="image/*" hidden>
    <input type="file" id="videoInput" accept="video/*" hidden>
    <input type="file" id="audioInput" accept="audio/*" hidden>
    <input type="file" id="documentInput" accept="*/*" hidden>

    <!-- Full-Screen Media Viewer Overlay -->
    <div id="mediaOverlay" class="media-overlay">
        <button class="close-overlay-btn" onclick="closeMediaPreview()">&times;</button>
        <div id="overlayContent" style="width:100%; display:flex; justify-content:center; align-items:center;"></div>
    </div>

    <script src="https://chat-backend-gtg5.onrender.com/socket.io/socket.io.js"></script>
    <script>
        const $ = id => document.getElementById(id);

        const socket = io("https://chat-backend-gtg5.onrender.com", {
            transports: ["websocket"],
            auth: { token: localStorage.getItem("token") }
        });

        const currentUser = (localStorage.getItem("username") || "guest").toLowerCase();
        let selectedUser = "";
        let typingTimeout;

        // Screenshot & Reload Timers
        let gestureTimer = null;
        let lastScreenshotAlert = 0;
        let backReloadTimer = null;
        let inboxIdleReloadInterval = null;
        let openDropdownUser = null;

        // ==========================================
        // 1. AUTO-RELOAD TIMERS (3s on Back, 10s on Inbox)
        // ==========================================
        function startInboxIdleReloadTimer() {
            clearInterval(inboxIdleReloadInterval);
            inboxIdleReloadInterval = setInterval(() => {
                const isSearchOpen = $("searchBox").style.display === "block" || $("inboxFilterBox").style.display === "block";
                // Reload every 10s only when user is idle on Inbox Home (no active chat, no open dropdown/search)
                if (!selectedUser && !isSearchOpen && !openDropdownUser) {
                    location.reload();
                }
            }, 10000);
        }

        function navigateBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "https://chat-room-three-pied.vercel.app/";
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            loadInbox();
            const lastOpen = sessionStorage.getItem("activePrivateChat");
            if (lastOpen) {
                openChat(lastOpen);
            } else {
                startInboxIdleReloadTimer();
            }
        });

        // Close attach menu & 3-dot dropdown when clicking outside
        document.addEventListener("click", function(e) {
            const menu = $("attachMenu");
            const btn = $("attachBtn");
            if (menu && btn && !menu.contains(e.target) && e.target !== btn) {
                menu.classList.remove("show");
            }
            if (!e.target.closest(".inbox-right")) {
                closeAllDropdowns();
            }
        });

        // ==========================================
        // 2. SCREENSHOT ALERT (EXACT 800ms + PrintScreen)
        // ==========================================
        function sendScreenshotAlert(reason = ": took a screenshot of chat") {
            const now = Date.now();
            if (!selectedUser || now - lastScreenshotAlert < 2500) return;
            lastScreenshotAlert = now;

            const time = formatAMPM(new Date());
            const alertData = {
                id: "alert_" + now + "_" + Math.random().toString(36).substr(2, 5),
                sender: currentUser,
                receiver: selectedUser,
                text: ` @${currentUser} ${reason}`,
                time: time,
                type: "alert"
            };
            saveAndRender(alertData);
            socket.emit("private_message", alertData);
        }

        // 📱 Mobile (Exact 3-finger 800ms logic)
        document.addEventListener("touchstart", (e) => {
            if (e.touches.length === 3) {
                gestureTimer = setTimeout(() => sendScreenshotAlert(), 800);
            }
        });

        document.addEventListener("touchend", () => {
            if (gestureTimer) clearTimeout(gestureTimer);
        });

        // 💻 PC
        window.addEventListener("keyup", (e) => {
            if (e.key === "PrintScreen" || e.key === "PrtSc") {
                sendScreenshotAlert();
            }
        });

        // ==========================================
        // 3. SEARCH (🔎) & NEW CHAT (+) VALIDATION
        // ==========================================
        function toggleInboxFilter() {
            const filterBox = $("inboxFilterBox");
            const searchBox = $("searchBox");
            searchBox.style.display = "none";

            const isHidden = filterBox.style.display === "none" || filterBox.style.display === "";
            filterBox.style.display = isHidden ? "block" : "none";

            if (isHidden) {
                $("inboxSearchInput").value = "";
                $("inboxSearchInput").focus();
            } else {
                $("inboxSearchInput").value = "";
                loadInbox();
            }
        }

        function toggleSearch() {
            const box = $("searchBox");
            const filterBox = $("inboxFilterBox");
            filterBox.style.display = "none";
            $("inboxSearchInput").value = "";

            const isHidden = box.style.display === "none" || box.style.display === "";
            box.style.display = isHidden ? "block" : "none";
            if (isHidden) {
                usernameInput.value = "";
                usernameStatus.innerHTML = "";
                registerBtn.disabled = true;
                registerBtn.style.opacity = "0.5";
                usernameInput.focus();
            }
        }

        const usernameInput = $("usernameInput");
        const usernameStatus = $("usernameStatus");
        const registerBtn = $("startChatBtn");

        usernameInput.addEventListener("input", function(e) {
            let value = e.target.value;

            value = value.toLowerCase();
            value = value.replace(/\s+/g, "_");
            value = value.replace(/[^a-z0-9._]/g, "");
            value = value.slice(0, 20);

            e.target.value = value;

            registerBtn.disabled = true;
            registerBtn.style.opacity = "0.5";

            if (value.length === 0) {
                usernameStatus.innerHTML = "";
                return;
            }

            if (value.length < 3) {
                usernameStatus.style.color = "#ff6b6b";
                usernameStatus.innerHTML = "Username must be at least 3 characters";
                return;
            }

            if (value.length > 20) {
                usernameStatus.style.color = "#ff6b6b";
                usernameStatus.innerHTML = "Username cannot exceed 20 characters";
                registerBtn.disabled = true;
                registerBtn.style.opacity = "0.5";
                return;
            }

            if (
                value.startsWith("_") ||
                value.startsWith(".") ||
                value.endsWith("_") ||
                value.endsWith(".") ||
                value.includes("__") ||
                value.includes("..") ||
                value.includes("_.") ||
                value.includes("._")
            ) {
                usernameStatus.style.color = "#ff6b6b";
                usernameStatus.innerHTML = "❌ Invalid username format";
                registerBtn.disabled = true;
                registerBtn.style.opacity = "0.5";
                return;
            }

            if (value === currentUser) {
                usernameStatus.style.color = "#ff6b6b";
                usernameStatus.innerHTML = "❌ You cannot chat with yourself";
                return;
            }

            usernameStatus.style.color = "#00d26a";
            usernameStatus.innerHTML = "✓ Valid username";
            registerBtn.disabled = false;
            registerBtn.style.opacity = "1";
        });

        usernameInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !registerBtn.disabled) {
                e.preventDefault();
                startChat();
            }
        });

        // ==========================================
        // 4. SOCKET CONNECTION & TYPING LOGIC
        // ==========================================
        socket.on("connect", () => {
            socket.emit("userJoined", currentUser);
            loadInbox();
        });

        socket.on("updateUserCount", count => {
            $("online-count").innerText = count;
        });

        function handleTyping() {
            if (!selectedUser) return;
            socket.emit("typing", currentUser);

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit("stopTyping", currentUser);
            }, 1000);
        }

        socket.on("userTyping", username => {
            if (!username || username.toLowerCase() !== selectedUser.toLowerCase()) return;
            $("typing-indicator").innerText = "@" + username + " is typing...";
            $("typing-indicator").style.display = "inline-block";
        });

        socket.on("userStopTyping", username => {
            if (!username || username.toLowerCase() === selectedUser.toLowerCase()) {
                $("typing-indicator").style.display = "none";
            }
        });

        // ==========================================
        // 5. INBOX & 3-DOT MENU OPTIONS (Pin, Nickname, Read/Unread, Delete)
        // ==========================================
        function formatAMPM(date) {
            let hours = date.getHours();
            let minutes = date.getMinutes();
            let ampm = hours >= 12 ? "pm" : "am";
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            return (hours < 10 ? "0" + hours : hours) + ":" + minutes + ampm;
        }

        function getDisplayTitle(u) {
            const meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            const nick = meta[u]?.nickname;
            return nick ? `${nick} (@${u})` : `@${u}`;
        }

        function startChat() {
            if (registerBtn.disabled) return;
            const u = usernameInput.value.trim();
            if (u) {
                addInbox(u);
                openChat(u);
                usernameInput.value = "";
                usernameStatus.innerHTML = "";
                registerBtn.disabled = true;
                registerBtn.style.opacity = "0.5";
                $("searchBox").style.display = "none";
            }
        }

        function addInbox(u) {
            u = u.toLowerCase();
            let users = JSON.parse(localStorage.getItem("privateUsers")) || [];
            if (!users.includes(u)) {
                users.push(u);
                localStorage.setItem("privateUsers", JSON.stringify(users));
                loadInbox();
            }
        }

        function closeAllDropdowns() {
            openDropdownUser = null;
            document.querySelectorAll(".inbox-dropdown").forEach(el => el.classList.remove("show"));
        }

        function toggleUserDropdown(e, u) {
            e.stopPropagation();
            const menuId = `dropdown_${u}`;
            const menu = $(menuId);
            const isAlreadyOpen = menu && menu.classList.contains("show");
            closeAllDropdowns();
            if (menu && !isAlreadyOpen) {
                menu.classList.add("show");
                openDropdownUser = u;
            }
        }

        // Option 1: Pin / Unpin Chat
        function togglePinChat(e, u) {
            e.stopPropagation();
            closeAllDropdowns();
            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (!meta[u]) meta[u] = { unread: 0, lastMessage: "", lastTime: "", lastActivity: 0 };
            meta[u].pinned = !meta[u].pinned;
            localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
            loadInbox();
        }

        // Option 2: Set Nickname
        function setChatNickname(e, u) {
            e.stopPropagation();
            closeAllDropdowns();
            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (!meta[u]) meta[u] = { unread: 0, lastMessage: "", lastTime: "", lastActivity: 0 };

            const currentNick = meta[u].nickname || "";
            const newNick = prompt(`@${u} ke liye nickname enter karein (Khali chhodne par hat jayega):`, currentNick);

            if (newNick !== null) {
                meta[u].nickname = newNick.trim();
                localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
                if (selectedUser === u) {
                    $("chatTitle").innerText = getDisplayTitle(u);
                }
                loadInbox();
            }
        }

        // Option 3: Mark as Unread
        function markChatUnread(e, u) {
            e.stopPropagation();
            closeAllDropdowns();
            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (!meta[u]) meta[u] = { unread: 0, lastMessage: "", lastTime: "", lastActivity: Date.now() };
            meta[u].unread = Math.max(1, meta[u].unread || 1);
            localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
            loadInbox();
        }

        // Option 4: Mark as Read
        function markChatRead(e, u) {
            e.stopPropagation();
            closeAllDropdowns();
            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (meta[u]) {
                meta[u].unread = 0;
                localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
            }
            loadInbox();
        }

        // Option 5: Delete User from Inbox + Clear History
        function deleteUserChat(e, u) {
            e.stopPropagation();
            closeAllDropdowns();
            if (confirm(`Kya aap sach me @${u} ko inbox se delete karna chahte hain?`)) {
                // Remove from privateUsers list
                let users = JSON.parse(localStorage.getItem("privateUsers")) || [];
                users = users.filter(item => item.toLowerCase() !== u.toLowerCase());
                localStorage.setItem("privateUsers", JSON.stringify(users));

                // Remove messages with this user
                let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
                chats = chats.filter(c => {
                    const s = (c.sender || "").toLowerCase();
                    const r = (c.receiver || "").toLowerCase();
                    return !((s === currentUser && r === u) || (s === u && r === currentUser));
                });
                localStorage.setItem("privateChats", JSON.stringify(chats));

                // Remove metadata
                let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
                delete meta[u];
                localStorage.setItem("privateInboxMeta", JSON.stringify(meta));

                if (selectedUser === u) {
                    selectedUser = "";
                    sessionStorage.removeItem("activePrivateChat");
                    $("chatTitle").innerText = "Select a Chat";
                    $("messages").innerHTML = "";
                    $("appContainer").classList.remove("mobile-chat-open");
                }
                loadInbox();
            }
        }

        function loadInbox() {
            const inbox = $("inboxList");
            inbox.innerHTML = "";

            const users = JSON.parse(localStorage.getItem("privateUsers")) || [];
            const meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            const query = ($("inboxSearchInput")?.value || "").trim().toLowerCase();

            // Sort: Pinned chats on top first, then latest activity
            users.sort((a, b) => {
                const pinA = meta[a]?.pinned ? 1 : 0;
                const pinB = meta[b]?.pinned ? 1 : 0;
                if (pinA !== pinB) return pinB - pinA;

                const timeA = meta[a]?.lastActivity || 0;
                const timeB = meta[b]?.lastActivity || 0;
                return timeB - timeA;
            });

            users.forEach(u => {
                const info = meta[u] || {};
                const nickname = (info.nickname || "").toLowerCase();

                // Filter by search query (matches username or nickname)
                if (query && !u.includes(query) && !nickname.includes(query)) {
                    return;
                }

                const unread = info.unread || 0;
                const isPinned = !!info.pinned;

                const dot = unread > 0
                    ? `<span style="width:10px;height:10px;background:#00d26a;border-radius:50%;display:inline-block;margin-right:8px;flex-shrink:0;"></span>`
                    : "";

                const badge = unread > 0
                    ? `<span style="background:#00d26a;color:#000;font-weight:bold;border-radius:20px;padding:2px 8px;font-size:11px;">${unread}</span>`
                    : "";

                const pinIcon = isPinned
                    ? `<span title="Pinned" style="margin-right:6px;font-size:13px;">📌</span>`
                    : "";

                const displayLabel = info.nickname
                    ? `<strong>${escapeHTML(info.nickname)}</strong> <span style="font-size:11px;color:#888;">(@${escapeHTML(u)})</span>`
                    : `<strong>@${escapeHTML(u)}</strong>`;

                const d = document.createElement("div");
                d.className = "inbox" + (selectedUser === u ? " active" : "") + (isPinned ? " pinned-chat" : "");
                d.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div style="display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                            ${dot}
                            ${pinIcon}
                            <span>${displayLabel}</span>
                        </div>
                        <div class="inbox-right">
                            ${badge}
                            <button class="three-dot-btn" onclick="toggleUserDropdown(event, '${u}')" title="Options">⋮</button>
                            <div class="inbox-dropdown" id="dropdown_${u}">
                                <button class="dropdown-item" onclick="togglePinChat(event, '${u}')">
                                    📌 ${isPinned ? "Unpin Chat" : "Pin Chat"}
                                </button>
                                <button class="dropdown-item" onclick="setChatNickname(event, '${u}')">
                                    ✏️ Set Nickname
                                </button>
                                <button class="dropdown-item" onclick="markChatUnread(event, '${u}')">
                                    🔵 Mark as Unread
                                </button>
                                <button class="dropdown-item" onclick="markChatRead(event, '${u}')">
                                    ✔️ Mark as Read
                                </button>
                                <button class="dropdown-item delete-opt" onclick="deleteUserChat(event, '${u}')">
                                    🗑️ Delete Chat
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                d.onclick = () => openChat(u);
                inbox.appendChild(d);
            });
        }

        function openChat(u) {
            // Cancel any pending auto-reload timers while inside active chat
            clearTimeout(backReloadTimer);
            clearInterval(inboxIdleReloadInterval);

            selectedUser = u.toLowerCase();
            sessionStorage.setItem("activePrivateChat", selectedUser);
            $("chatTitle").innerText = getDisplayTitle(selectedUser);
            $("typing-indicator").style.display = "none";

            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (meta[selectedUser]) {
                meta[selectedUser].unread = 0;
                localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
            }

            markMessagesAsSeen(selectedUser);
            loadInbox();
            renderMessages();

            $("appContainer").classList.add("mobile-chat-open");
            setTimeout(() => $("messageInput").focus(), 100);
        }

        function goBack() {
            $("appContainer").classList.remove("mobile-chat-open");
            selectedUser = "";
            sessionStorage.removeItem("activePrivateChat");
            loadInbox();

            // 1. Trigger Auto-Reload 3 seconds after coming back to Inbox Home
            clearTimeout(backReloadTimer);
            backReloadTimer = setTimeout(() => {
                location.reload();
            }, 3000);

            // 2. Also keep 10-second idle reload timer active
            startInboxIdleReloadTimer();
        }

        // ==========================================
        // 6. SEEN STATUS & MESSAGE INFO (ⓘ) LOGIC
        // ==========================================
        function markMessagesAsSeen(partnerUser) {
            partnerUser = partnerUser.toLowerCase();
            let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            let updated = false;
            const seenTime = formatAMPM(new Date());

            chats.forEach(c => {
                if ((c.sender || "").toLowerCase() === partnerUser && (c.receiver || "").toLowerCase() === currentUser && !c.seen) {
                    c.seen = true;
                    c.seenAt = seenTime;
                    updated = true;
                }
            });

            if (updated) {
                localStorage.setItem("privateChats", JSON.stringify(chats));
            }

            const seenSignal = {
                id: "seen_" + Date.now(),
                sender: currentUser,
                receiver: partnerUser,
                type: "seen_receipt",
                text: "__SEEN_RECEIPT__",
                seenAt: seenTime
            };
            socket.emit("private_message", seenSignal);
        }

        function showMsgInfo(msgId) {
            const chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            const m = chats.find(c => String(c.id) === String(msgId));
            if (!m) return;

            const isMy = (m.sender || "").toLowerCase() === currentUser;
            const senderLabel = isMy ? `You (@${currentUser})` : `@${m.sender}`;

            let seenStatus = "Delivered ✓";
            let seenTimeText = "Not seen yet";

            if (isMy) {
                if (m.seen) {
                    seenStatus = `Seen by @${m.receiver} ✓✓`;
                    seenTimeText = m.seenAt || m.time;
                }
            } else {
                seenStatus = "Seen by You ✓✓";
                seenTimeText = m.seenAt || m.time;
            }

            alert(
                `📋 Message Info\n` +
                `────────────────────\n` +
                `👤 From: ${senderLabel}\n` +
                `🕒 Sent Time: ${m.time}\n` +
                `👁️ Status: ${seenStatus}\n` +
                `⏱️ Seen Time: ${seenTimeText}`
            );
        }

        // ==========================================
        // 7. MEDIA (+) ATTACHMENT LOGIC
        // ==========================================
        function triggerFileSelect(inputId) {
            $("attachMenu").classList.remove("show");
            if (!selectedUser) {
                alert("Media bhejne ke liye pehle koi chat select karein!");
                return;
            }
            $(inputId).click();
        }

        function setupMediaInputs() {
            const inputs = [
                { id: "cameraInput", mediaType: "image" },
                { id: "galleryInput", mediaType: "image" },
                { id: "videoInput", mediaType: "video" },
                { id: "audioInput", mediaType: "audio" },
                { id: "documentInput", mediaType: "document" }
            ];

            inputs.forEach(item => {
                const el = $(item.id);
                if (!el) return;
                el.addEventListener("change", function(e) {
                    const file = e.target.files[0];
                    if (!file || !selectedUser) return;

                    if (file.size > 10 * 1024 * 1024) {
                        alert("File size 10MB se kam honi chahiye!");
                        e.target.value = "";
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const base64Data = evt.target.result;
                        let detectedType = item.mediaType;
                        if (file.type.startsWith("image/")) detectedType = "image";
                        else if (file.type.startsWith("video/")) detectedType = "video";
                        else if (file.type.startsWith("audio/")) detectedType = "audio";

                        const msgData = {
                            id: "msg_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                            sender: currentUser,
                            receiver: selectedUser,
                            text: file.name,
                            mediaUrl: base64Data,
                            mediaType: detectedType,
                            fileName: file.name,
                            time: formatAMPM(new Date()),
                            seen: false
                        };

                        saveAndRender(msgData);
                        socket.emit("private_message", msgData);
                    };
                    reader.readAsDataURL(file);
                    e.target.value = "";
                });
            });
        }
        setupMediaInputs();

        function openMediaPreview(url, type) {
            const overlay = $("mediaOverlay");
            const content = $("overlayContent");
            if (type === "image") {
                content.innerHTML = `<img src="${url}" alt="Preview">`;
            } else {
                content.innerHTML = `<iframe src="${url}"></iframe>`;
            }
            overlay.classList.add("show");
        }

        function closeMediaPreview() {
            $("mediaOverlay").classList.remove("show");
            $("overlayContent").innerHTML = "";
        }

        // ==========================================
        // 8. SEND, RECEIVE (NO DUPLICATES) & CLEAR
        // ==========================================
        function sendMessage() {
            const input = $("messageInput");
            const txt = input.value.trim();
            if (!txt || !selectedUser) return;

            const data = {
                id: "msg_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                sender: currentUser,
                receiver: selectedUser,
                text: txt,
                time: formatAMPM(new Date()),
                seen: false
            };

            saveAndRender(data);
            socket.emit("private_message", data);
            socket.emit("stopTyping", currentUser);

            input.value = "";
            input.focus();
        }

        $("messageInput").addEventListener("input", handleTyping);
        $("messageInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function performLocalClear(partnerUser) {
            partnerUser = partnerUser.toLowerCase();
            let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            chats = chats.filter(c => {
                const s = (c.sender || "").toLowerCase();
                const r = (c.receiver || "").toLowerCase();
                const isBetweenUsers = (s === currentUser && r === partnerUser) || (s === partnerUser && r === currentUser);
                return !isBetweenUsers;
            });
            localStorage.setItem("privateChats", JSON.stringify(chats));

            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (meta[partnerUser]) {
                meta[partnerUser].unread = 0;
                meta[partnerUser].lastMessage = "";
                localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
            }

            if (selectedUser === partnerUser) {
                renderMessages();
            }
            loadInbox();
        }

        function clearAllChat() {
            if (!selectedUser) {
                alert("Pehle koi chat select karein!");
                return;
            }
            if (confirm(`@${selectedUser} ke sath dono side ki chat clear karein?`)) {
                performLocalClear(selectedUser);

                const clearSignal = {
                    id: "clear_" + Date.now(),
                    sender: currentUser,
                    receiver: selectedUser,
                    text: "__CLEAR_CHAT__",
                    type: "clear_action",
                    time: formatAMPM(new Date())
                };
                socket.emit("private_message", clearSignal);
                socket.emit("clear_private_chat", { sender: currentUser, receiver: selectedUser });
            }
        }

        function saveAndRender(data) {
            if (!data) return;
            const sender = (data.sender || "").toLowerCase();
            const receiver = (data.receiver || "").toLowerCase();

            if (sender !== currentUser && receiver !== currentUser) return;

            // 1. Handle Both-Side Clear Signal
            if (data.type === "clear_action" || data.text === "__CLEAR_CHAT__") {
                const partner = sender === currentUser ? receiver : sender;
                performLocalClear(partner);
                return;
            }

            // 2. Handle Real-time Seen Receipt Signal
            if (data.type === "seen_receipt" || data.text === "__SEEN_RECEIPT__") {
                if (sender !== currentUser) {
                    let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
                    let changed = false;
                    chats.forEach(c => {
                        if ((c.sender || "").toLowerCase() === currentUser && (c.receiver || "").toLowerCase() === sender && !c.seen) {
                            c.seen = true;
                            c.seenAt = data.seenAt || formatAMPM(new Date());
                            changed = true;
                        }
                    });
                    if (changed) {
                        localStorage.setItem("privateChats", JSON.stringify(chats));
                        if (selectedUser === sender) renderMessages();
                    }
                }
                return;
            }

            const partner = sender === currentUser ? receiver : sender;
            addInbox(partner);

            let chats = JSON.parse(localStorage.getItem("privateChats")) || [];

            // 3. Duplicate Prevention Check
            if (data.id && chats.some(c => String(c.id) === String(data.id))) {
                return;
            }

            if (sender !== currentUser && selectedUser === sender) {
                data.seen = true;
                data.seenAt = formatAMPM(new Date());
                socket.emit("private_message", {
                    id: "seen_" + Date.now(),
                    sender: currentUser,
                    receiver: sender,
                    type: "seen_receipt",
                    text: "__SEEN_RECEIPT__",
                    seenAt: data.seenAt
                });
            }

            chats.push(data);
            localStorage.setItem("privateChats", JSON.stringify(chats));

            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (!meta[partner]) {
                meta[partner] = { unread: 0, lastMessage: "", lastTime: "", lastActivity: 0 };
            }

            meta[partner].lastMessage = data.mediaType ? `📎 ${data.mediaType}` : data.text;
            meta[partner].lastTime = data.time;
            meta[partner].lastActivity = Date.now();

            if (sender !== currentUser && selectedUser !== sender) {
                meta[partner].unread = (meta[partner].unread || 0) + 1;
            }

            localStorage.setItem("privateInboxMeta", JSON.stringify(meta));

            if (selectedUser === sender || selectedUser === receiver) {
                renderMessages();
            }
            loadInbox();
        }

        socket.on("receive_private_message", data => {
            saveAndRender(data);
        });

        socket.on("clear_private_chat", data => {
            if (!data) return;
            const sender = (data.sender || "").toLowerCase();
            const receiver = (data.receiver || "").toLowerCase();
            if (receiver === currentUser || sender === currentUser) {
                const partner = sender === currentUser ? receiver : sender;
                performLocalClear(partner);
            }
        });

        socket.on("private_chat_created", data => {
            if (data && data.username) {
                addInbox(data.username.toLowerCase());
            }
        });

        function escapeHTML(str) {
            const div = document.createElement("div");
            div.textContent = str || "";
            return div.innerHTML;
        }

        function renderMediaContent(m) {
            if (!m.mediaUrl) {
                return `<div>${escapeHTML(m.text)}</div>`;
            }
            if (m.mediaType === "image") {
                return `<img src="${m.mediaUrl}" class="chat-media-img" alt="Image" onclick="openMediaPreview('${m.mediaUrl}', 'image')">`;
            }
            if (m.mediaType === "video") {
                return `<video src="${m.mediaUrl}" class="chat-media-video" controls></video>`;
            }
            if (m.mediaType === "audio") {
                return `<audio src="${m.mediaUrl}" class="chat-media-audio" controls></audio>`;
            }
            return `
                <a href="${m.mediaUrl}" download="${escapeHTML(m.fileName || 'document')}" class="chat-media-doc">
                    <span style="font-size:20px;">📄</span>
                    <span>${escapeHTML(m.fileName || m.text || "Download File")}</span>
                </a>
            `;
        }

        function renderMessages() {
            const b = $("messages");
            b.innerHTML = "";
            if (!selectedUser) return;

            const chats = JSON.parse(localStorage.getItem("privateChats")) || [];

            chats.filter(c => {
                const s = (c.sender || "").toLowerCase();
                const r = (c.receiver || "").toLowerCase();
                return (s === currentUser && r === selectedUser) || (s === selectedUser && r === currentUser);
            }).forEach(m => {
                if (m.type === "alert" || (m.sender && m.sender.toLowerCase() === "system")) {
                    b.insertAdjacentHTML("beforeend", `<div class="system-alert">${escapeHTML(m.text)} (${m.time})</div>`);
                } else {
                    const isMy = (m.sender || "").toLowerCase() === currentUser;
                    const senderName = isMy ? "You" : `@${escapeHTML(m.sender)}`;
                    const tickIcon = isMy ? (m.seen ? `<span style="color:#00d26a;font-weight:bold;">✓✓</span>` : `<span>✓</span>`) : "";

                    b.insertAdjacentHTML("beforeend", `
                        <div class="msg ${isMy ? "my-msg" : "received-msg"}">
                            <div class="msg-sender">${senderName}</div>
                            ${renderMediaContent(m)}
                            <div class="msg-meta">
                                <span>${m.time}</span>
                                ${tickIcon}
                                <button class="info-btn" title="Message Info" onclick="showMsgInfo('${m.id}')">ⓘ</button>
                            </div>
                        </div>
                    `);
                }
            });

            b.scrollTop = b.scrollHeight;
        }

        
            function logout() {
    if (confirm("Confirm to LogOut !!!")) {
   localStorage.removeItem("privateChats");
        localStorage.removeItem("privateUsers");
        localStorage.removeItem("privateInboxMeta");
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        sessionStorage.clear();
        localStorage.clear();
        window.location.replace("login.html");
    }
}

    </script>

    <script src="js/mediaManager.js"></script>
    <script src="js/attachments.js"></script>

    <script>
        // Right Click Block
        document.addEventListener("contextmenu", function(e) {
            e.preventDefault();
        });

        // Text Selection Block (Allowed inside inputs)
        document.addEventListener("selectstart", function(e) {
            if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
                e.preventDefault();
            }
        });

        // Copy / Cut / Drag Block
        document.addEventListener("copy", e => e.preventDefault());
        document.addEventListener("cut", e => e.preventDefault());
        document.addEventListener("dragstart", e => e.preventDefault());
    </script>
</body>
