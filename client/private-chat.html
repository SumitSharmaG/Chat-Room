<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "login.html";
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0a;
            --bg-card: #141414;
            --accent-gold: #b59461;
            --accent-red: #ff4d4d;
            --text-main: #e0e0e0;
            --my-chat-bg: rgba(181, 148, 97, 0.18);
            --tick-blue: #34b7f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        @media print {
            body { display: none !important; }
        }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            height: 100dvh;
            overflow: hidden;
            width: 100%;
            position: fixed;
        }

        .app {
            display: flex;
            height: 100dvh;
            width: 100%;
            position: relative;
        }

        /* SIDEBAR */
        .sidebar {
            width: 340px;
            background: #121212;
            border-right: 1px solid rgba(181, 148, 97, 0.2);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
            z-index: 2;
        }

        .top {
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(181, 148, 97, 0.2);
            height: 78px;
            background: var(--bg-card);
        }

        .header-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }

        .home-btn {
            text-decoration: none;
            color: var(--accent-gold);
            font-size: 0.78rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border: 1px solid rgba(181, 148, 97, 0.35);
            border-radius: 20px;
            background: rgba(20, 20, 20, 0.7);
            transition: all 0.2s ease;
        }

        .home-btn:hover {
            background: var(--accent-gold);
            color: #000;
        }

        .nav-back-btn {
            text-decoration: none;
            color: #a0a0a0;
            font-size: 0.68rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
            margin-top: 7px;
            cursor: pointer;
        }

        .nav-back-btn:hover {
            color: var(--accent-gold);
            border-color: rgba(181, 148, 97, 0.4);
            background: rgba(181, 148, 97, 0.1);
        }

        .chat-title-trigger {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold);
            font-size: 1.05rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: transform 0.15s ease, background 0.2s ease;
            text-align: center;
        }

        .chat-title-trigger:hover {
            background: rgba(181, 148, 97, 0.1);
        }

        .chat-title-trigger:active {
            transform: scale(0.95);
        }

        .top-right-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
        }

        .mini-exit-btn {
            background: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.35);
            color: var(--accent-red);
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 9px;
            border-radius: 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .mini-exit-btn:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(181, 148, 97, 0.35);
            border-radius: 50%;
            background: #1d1d1d;
            color: var(--accent-gold);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: var(--accent-gold);
            color: #000;
            cursor: pointer;
            font-weight: bold;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #searchBox, #inboxFilterBox {
            display: none;
            padding: 12px;
            background: #161616;
            border-bottom: 1px solid #222;
        }

        #usernameInput, #inboxSearchInput {
            width: 100%;
            padding: 10px 12px;
            background: #1d1d1d;
            color: white;
            border: 1px solid rgba(181, 148, 97, 0.4);
            border-radius: 8px;
            outline: none;
            font-size: 13px;
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        #usernameStatus {
            font-size: 11px;
            margin-top: 6px;
            min-height: 16px;
            color: #ff6b6b;
        }

        #startChatBtn {
            width: 100%;
            margin-top: 6px;
            padding: 9px;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .inbox-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            padding-bottom: 80px;
        }

        .inbox {
            background: #1b1b1b;
            padding: 11px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .inbox:hover, .inbox.active {
            border-color: var(--accent-gold);
            background: #222;
        }

        .inbox.pinned-chat {
            border-left: 3px solid var(--accent-gold);
            background: #1e1c18;
        }

        .user-status-sub {
            font-size: 0.65rem;
            opacity: 0.65;
            display: block;
            margin-top: 1px;
            font-weight: 400;
        }

        .user-status-sub.is-online {
            color: #00d26a;
            opacity: 0.9;
        }

        .user-status-sub.is-offline {
            color: #aaa;
            opacity: 0.55;
        }

        .inbox-right {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .three-dot-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 18px;
            font-weight: bold;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .three-dot-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-gold);
        }

        .inbox-dropdown {
            position: absolute;
            right: 0;
            top: 34px;
            background: #181818;
            border: 1px solid rgba(181, 148, 97, 0.4);
            border-radius: 10px;
            width: 175px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            z-index: 9999;
            overflow: hidden;
        }

        .inbox-dropdown.show {
            display: flex;
        }

        .dropdown-item {
            padding: 10px 12px;
            font-size: 12px;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            width: 100%;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: #252525;
            color: var(--accent-gold);
        }

        .dropdown-item.delete-opt {
            color: var(--accent-red);
        }

        .dropdown-item.delete-opt:hover {
            background: rgba(255, 77, 77, 0.12);
        }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            background-image: radial-gradient(at 0% 0%, rgba(30, 20, 16, 0.4) 0px, transparent 50%);
            height: 100%;
            z-index: 1;
            position: relative;
        }

        .chat-header {
            padding: 8px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(181, 148, 97, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 75px;
            z-index: 20;
        }

        .back-btn {
            display: none;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(181, 148, 97, 0.3);
            color: var(--accent-gold);
            font-size: 14px;
            cursor: pointer;
            padding: 4px 9px;
            border-radius: 10px;
            margin-right: 4px;
        }

        #chatTitle {
            color: var(--accent-gold);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }

        .header-right-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .header-btn {
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
        }

        .clear-btn {
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .logout-btn {
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }

        /* MESSAGES */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 15px 24px 15px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .msg {
            max-width: 78%;
            width: fit-content;
            min-width: 115px;
            padding: 7px 12px;
            border-radius: 12px 12px 12px 2px;
            word-wrap: break-word;
            font-size: 0.85rem;
            line-height: 1.38;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s ease;
        }

        .received-msg {
            background: #1a1a1a;
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .my-msg {
            background: #281e15;
            color: var(--text-main);
            align-self: flex-end;
            border-radius: 12px 12px 2px 12px;
            border: 1px solid rgba(181, 148, 97, 0.45);
        }

        .msg-sender {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent-gold);
            margin-bottom: 2px;
        }

        /* SCREENSHOT ALERT STYLE */
        .screenshot-alert {
            align-self: center !important;
            background: rgba(18, 18, 18, 0.9) !important;
            border: 1px dashed rgba(181, 148, 97, 0.35) !important;
            color: var(--accent-gold) !important;
            font-size: 0.72rem !important;
            padding: 4px 12px !important;
            border-radius: 20px !important;
            font-style: italic;
            text-align: center;
            max-width: 90%;
            margin: 4px 0;
        }

        .msg-meta {
            font-size: 0.64rem;
            color: #999;
            display: inline-flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 4px;
            align-self: flex-end;
            gap: 5px;
            position: relative;
            z-index: 30;
        }

        .tick-icon {
            font-size: 0.76rem;
            font-weight: bold;
            letter-spacing: -2px;
            color: #888;
        }

        .tick-icon.seen {
            color: var(--tick-blue) !important;
        }

        /* Fixed Reliable Info Button */
        .info-btn {
            background: rgba(181, 148, 97, 0.15);
            border: 1px solid rgba(181, 148, 97, 0.4);
            color: var(--accent-gold);
            font-size: 0.76rem;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin-left: 3px;
            position: relative;
            z-index: 50;
            pointer-events: auto !important;
        }

        .info-btn:hover, .info-btn:active {
            background: var(--accent-gold);
            color: #000;
            transform: scale(1.1);
        }

        /* --- Unsend Tablet --- */
        .unsend-tablet {
            position: absolute;
            top: -28px;
            right: 0;
            background: #181818;
            border: 1px solid var(--accent-red);
            border-radius: 14px;
            padding: 3px 9px;
            display: none;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.9);
            z-index: 9999;
            white-space: nowrap;
            animation: popUnsend 0.15s ease-out;
        }

        .msg:first-child .unsend-tablet {
            top: auto;
            bottom: -26px;
            right: 0;
        }

        .unsend-tablet.show {
            display: inline-flex;
        }

        @keyframes popUnsend {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .unsend-action-btn {
            background: transparent;
            border: none;
            color: var(--accent-red);
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        /* --- Emoji Reaction Picker Bar --- */
        .reaction-picker-bar {
            position: absolute;
            top: -42px;
            background: #181818;
            border: 1px solid rgba(181, 148, 97, 0.5);
            border-radius: 30px;
            padding: 4px 8px;
            display: none;
            align-items: center;
            gap: 5px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.85);
            z-index: 9998;
            max-width: 270px;
            overflow-x: auto;
            scrollbar-width: none;
            animation: popUnsend 0.15s ease-out;
        }

        .reaction-picker-bar::-webkit-scrollbar {
            display: none;
        }

        .my-msg .reaction-picker-bar {
            right: 0;
        }

        .received-msg .reaction-picker-bar {
            left: 0;
        }

        .msg:first-child .reaction-picker-bar {
            top: auto;
            bottom: -42px;
        }

        .reaction-picker-bar.show {
            display: flex;
        }

        .react-emoji-opt {
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 3px;
            transition: transform 0.15s ease;
            flex-shrink: 0;
        }

        .react-emoji-opt:hover, .react-emoji-opt:active {
            transform: scale(1.3);
        }

        .msg-reaction-corner {
            position: absolute;
            bottom: -11px;
            background: #1f1b16;
            border: 1px solid rgba(181, 148, 97, 0.5);
            border-radius: 12px;
            padding: 1px 6px;
            font-size: 0.72rem;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            z-index: 40;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .my-msg .msg-reaction-corner {
            left: 8px;
        }

        .received-msg .msg-reaction-corner {
            right: 8px;
        }

        .reaction-detail-bubble {
            position: absolute;
            bottom: -36px;
            background: #141414;
            border: 1px solid var(--accent-gold);
            color: #fff;
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 0.66rem;
            white-space: nowrap;
            display: none;
            align-items: center;
            gap: 6px;
            z-index: 9999;
            box-shadow: 0 4px 14px rgba(0,0,0,0.9);
        }

        .my-msg .reaction-detail-bubble {
            left: 0;
        }

        .received-msg .reaction-detail-bubble {
            right: 0;
        }

        .reaction-detail-bubble.show {
            display: inline-flex;
        }

        /* --- Custom Compact Message Info Modal --- */
        .msg-info-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .msg-info-modal-overlay.show {
            display: flex;
        }

        .msg-info-modal-box {
            background: #141414;
            border: 1px solid var(--accent-gold);
            border-radius: 12px;
            width: 100%;
            max-width: 280px;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.9);
            color: var(--text-main);
            animation: fadeInModal 0.18s ease-out;
        }

        @keyframes fadeInModal {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .msg-info-header {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold);
            font-size: 1rem;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(181, 148, 97, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .msg-info-body {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 2px;
        }

        .msg-info-row {
            font-size: 0.75rem;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px dashed rgba(255,255,255,0.06);
            padding-bottom: 5px;
        }

        .msg-info-label {
            color: #aaa;
            font-weight: 500;
            flex-shrink: 0;
        }

        .msg-info-val {
            color: #fff;
            font-weight: 600;
            text-align: right;
            word-break: break-word;
        }

        .msg-info-close-btn {
            margin-top: 10px;
            width: 100%;
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 7px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.76rem;
            cursor: pointer;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* MEDIA ITEMS & CUSTOM AUDIO PLAYER */
        .chat-media-img {
            max-width: 230px;
            max-height: 230px;
            border-radius: 10px;
            margin-top: 4px;
            cursor: pointer;
            object-fit: cover;
            border: 1px solid rgba(181, 148, 97, 0.3);
        }

        .chat-media-video {
            max-width: 240px;
            max-height: 230px;
            border-radius: 10px;
            margin-top: 4px;
            background: #000;
        }

        .custom-chat-audio {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(181, 148, 97, 0.35);
            padding: 6px 10px;
            border-radius: 20px;
            margin-top: 4px;
            min-width: 175px;
        }

        .custom-audio-play-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--accent-gold);
            color: #000;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .audio-wave-decor {
            display: flex;
            align-items: center;
            gap: 2px;
            flex: 1;
            height: 16px;
        }

        .audio-wave-decor span {
            display: inline-block;
            width: 3px;
            background: rgba(181, 148, 97, 0.5);
            border-radius: 2px;
            transition: background 0.2s ease;
        }

        .custom-chat-audio.playing .audio-wave-decor span {
            background: var(--accent-gold);
            animation: waveBounce 0.6s infinite ease-in-out alternate;
        }

        @keyframes waveBounce {
            from { transform: scaleY(0.5); }
            to { transform: scaleY(1.25); }
        }

        .custom-audio-time {
            font-size: 0.68rem;
            color: var(--accent-gold);
            font-weight: 600;
            min-width: 28px;
            text-align: right;
        }

        .chat-media-doc {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.35);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(181, 148, 97, 0.3);
            margin-top: 4px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
        }

        /* INPUT AREA */
        .send-box {
            padding: 8px 10px;
            background: var(--bg-card);
            border-top: 1px solid rgba(181, 148, 97, 0.15);
            display: flex;
            gap: 8px;
            align-items: center;
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
            position: relative;
            z-index: 20;
        }

        .attach-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #202020;
            color: #b59461;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            pointer-events: auto !important;
        }

        .attach-btn:active {
            transform: scale(.95);
        }

        .attach-menu {

    <script src="https://chat-backend-gtg5.onrender.com/socket.io/socket.io.js"></script>
    <script>
        const $ = id => document.getElementById(id);

        const socket = io("https://chat-backend-gtg5.onrender.com", {
            transports: ["websocket"],
            auth: { token: localStorage.getItem("token") }
        });

        const currentUser = (localStorage.getItem("username") || "guest").toLowerCase();
        let selectedUser = "";
        let typingTimeout;

        const ALLOWED_EMOJIS = ["👍", "👋🏻", "😁", "😅", "😃", "😄", "🤔", "🤧", "🙉", "🙈", "😭"];

        let onlineUsersMap = {};
        try {
            onlineUsersMap = JSON.parse(sessionStorage.getItem("privateOnlineUsers") || "{}");
        } catch(e) { onlineUsersMap = {}; }

        let gestureTimer = null;
        let lastScreenshotAlert = 0;
        let openDropdownUser = null;

        const chatBackgrounds = [
            "none",
            "linear-gradient(rgba(10, 10, 10, 0.75), rgba(10, 10, 10, 0.75)), url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1000&q=75')",
            "linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.8)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1000&q=75')",
            "linear-gradient(rgba(12, 10, 8, 0.78), rgba(12, 10, 8, 0.78)), url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1000&q=75')"
        ];

        let currentBgIndex = parseInt(localStorage.getItem("privateChatBgIndex") !== null ? localStorage.getItem("privateChatBgIndex") : "2", 10);

        function applyChatBackground(index) {
            const messagesBox = $("messages");
            if (!messagesBox) return;
            messagesBox.style.backgroundImage = chatBackgrounds[index] || chatBackgrounds[2];
        }

        window.cycleChatBackground = function() {
            currentBgIndex = (currentBgIndex + 1) % chatBackgrounds.length;
            localStorage.setItem("privateChatBgIndex", currentBgIndex);
            applyChatBackground(currentBgIndex);
        };

        function startInboxIdleReloadTimer() {}

        window.addEventListener("DOMContentLoaded", () => {
            if ($("display-username") && currentUser) {
                $("display-username").innerText = `@${currentUser}`;
            }
            applyChatBackground(currentBgIndex);
            loadInbox();
            const lastOpen = sessionStorage.getItem("activePrivateChat");
            if (lastOpen) {
                openChat(lastOpen);
            }
        });

        document.addEventListener("click", function(e) {
            const menu = $("attachMenu");
            const btn = $("attachBtn");
            if (menu && btn && !menu.contains(e.target) && e.target !== btn) {
                menu.classList.remove("show");
            }
            if (!e.target.closest(".inbox-right")) {
                closeAllDropdowns();
            }
            if (!e.target.closest(".unsend-tablet") && !e.target.closest(".info-btn")) {
                document.querySelectorAll(".unsend-tablet.show").forEach(el => el.classList.remove("show"));
            }
            if (!e.target.closest(".reaction-picker-bar")) {
                document.querySelectorAll(".reaction-picker-bar.show").forEach(el => el.classList.remove("show"));
            }
            if (!e.target.closest(".msg-reaction-corner") && !e.target.closest(".reaction-detail-bubble")) {
                document.querySelectorAll(".reaction-detail-bubble.show").forEach(el => el.classList.remove("show"));
            }
        });

        function sendScreenshotAlert(reason = "Took A ScreenShot Of Chat") {
            const now = Date.now();
            if (!selectedUser || now - lastScreenshotAlert < 2500) return;
            lastScreenshotAlert = now;

            const time = formatAMPM(new Date());
            const alertData = {
                id: "alert_" + now + "_" + Math.random().toString(36).substr(2, 5),
                sender: currentUser,
                receiver: selectedUser,
                text: `@${currentUser} ~ ${reason} • ${time}`,
                time: time,
                type: "alert"
            };
            saveAndRender(alertData);
            socket.emit("private_message", alertData);
        }

        document.addEventListener("touchstart", (e) => {
            if (e.touches.length === 3) {
                gestureTimer = setTimeout(() => sendScreenshotAlert(), 800);
            }
        });

        document.addEventListener("touchend", () => {
            if (gestureTimer) clearTimeout(gestureTimer);
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "PrintScreen" || e.key === "PrtSc") {
                sendScreenshotAlert();
            }
        });

        window.toggleInboxFilter = function() {
            const filterBox = $("inboxFilterBox");
            const searchBox = $("searchBox");
            searchBox.style.display = "none";
            const isHidden = filterBox.style.display === "none" || filterBox.style.display === "";
            filterBox.style.display = isHidden ? "block" : "none";
            if (isHidden) {
                $("inboxSearchInput").value = "";
                $("inboxSearchInput").focus();
            } else {
                $("inboxSearchInput").value = "";
                loadInbox();
            }
        };

        window.toggleSearch = function() {
            const box = $("searchBox");
            const filterBox = $("inboxFilterBox");
            filterBox.style.display = "none";
            $("inboxSearchInput").value = "";
            const isHidden = box.style.display === "none" || box.style.display === "";
            box.style.display = isHidden ? "block" : "none";
            if (isHidden) {
                usernameInput.value = "";
                usernameStatus.innerHTML = "";
                registerBtn.disabled = true;
                registerBtn.style.opacity = "0.5";
                usernameInput.focus();
            }
        };

        const usernameInput = $("usernameInput");
        const usernameStatus = $("usernameStatus");
        const registerBtn = $("startChatBtn");
        let checkUserTimer;

        usernameInput.addEventListener("input", function(e) {
            let value = e.target.value.toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9._]/g, "").slice(0, 20);
            e.target.value = value;
            registerBtn.disabled = true;
            registerBtn.style.opacity = "0.5";

            if (value.length === 0) {
                usernameStatus.innerHTML = "";
                return;
            }
            if (value.length < 3) {
                usernameStatus.style.color = "#ff6b6b";
                usernameStatus.innerHTML = "Username must be at least 3 characters";
                return;
            }
            if (value === currentUser) {
                usernameStatus.style.color = "#ff6b6b";
                usernameStatus.innerHTML = "❌ You cannot chat with yourself";
                return;
            }

            usernameStatus.style.color = "#aaa";
            usernameStatus.innerHTML = "Checking user...";

            clearTimeout(checkUserTimer);
            checkUserTimer = setTimeout(async () => {
                try {
                    const res = await fetch("https://chat-backend-gtg5.onrender.com/api/check-username/" + value);
                    const data = await res.json();
                    if (usernameInput.value !== value) return;
                    if (!data.available) {
                        usernameStatus.style.color = "#00d26a";
                        usernameStatus.innerHTML = "✅ Valid User Found";
                        registerBtn.disabled = false;
                        registerBtn.style.opacity = "1";
                    } else {
                        usernameStatus.style.color = "#ff6b6b";
                        usernameStatus.innerHTML = "❌ Username does not exist";
                    }
                } catch {
                    usernameStatus.style.color = "#00d26a";
                    usernameStatus.innerHTML = "✓ Valid username";
                    registerBtn.disabled = false;
                    registerBtn.style.opacity = "1";
                }
            }, 400);
        });

        // ==========================================
        // 4. INSTANT ONLINE / OFFLINE ENGINE
        // ==========================================
        const PRESENCE_TIMEOUT_MS = 8500;

        function setUserOnlineStatus(user, isOnline) {
            if (!user) return;
            const u = String(user).replace(/^__PRESENCE_(ONLINE|OFFLINE)__:/, "").toLowerCase().trim();
            if (!u || u === currentUser || u === "system") return;

            const wasOnline = isPartnerOnline(u);
            onlineUsersMap[u] = isOnline ? Date.now() : 0;
            sessionStorage.setItem("privateOnlineUsers", JSON.stringify(onlineUsersMap));

            if (isOnline) {
                markMyMessagesDeliveredTo(u);
            }

            if (wasOnline !== isOnline || selectedUser === u) {
                updateHeaderPartnerStatus();
                if (!openDropdownUser) loadInbox();
            }
        }

        function isPartnerOnline(user) {
            if (!user) return false;
            const u = user.toLowerCase().trim();
            const lastActive = onlineUsersMap[u] || 0;
            return lastActive > 0 && (Date.now() - lastActive < PRESENCE_TIMEOUT_MS);
        }

        function updateHeaderPartnerStatus() {
            const statusEl = $("partner-status");
            if (!statusEl) return;
            if (!selectedUser) {
                statusEl.style.display = "none";
                return;
            }
            const online = isPartnerOnline(selectedUser);
            statusEl.style.display = "inline-block";
            statusEl.className = "user-status-sub " + (online ? "is-online" : "is-offline");
            statusEl.innerText = online ? "● Online" : "○ Offline";
        }

        function getAllKnownPartners() {
            const set = new Set(JSON.parse(localStorage.getItem("privateUsers")) || []);
            if (selectedUser) set.add(selectedUser);
            const chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            chats.forEach(c => {
                if (c.sender && c.sender.toLowerCase() !== currentUser) set.add(c.sender.toLowerCase());
                if (c.receiver && c.receiver.toLowerCase() !== currentUser) set.add(c.receiver.toLowerCase());
            });
            return Array.from(set);
        }

        function broadcastPagePresence(isOnline) {
            if (isOnline && document.hidden) return;
            const partners = getAllKnownPartners();
            partners.forEach(u => {
                socket.emit("private_message", {
                    id: (isOnline ? "ping_" : "off_") + Date.now(),
                    sender: currentUser,
                    receiver: u.toLowerCase(),
                    type: isOnline ? "presence_ping" : "presence_offline",
                    text: isOnline ? "__PRESENCE_PING__" : "__PRESENCE_OFFLINE__"
                });
            });
        }

        setInterval(() => {
            if (!document.hidden) {
                broadcastPagePresence(true);
            }
            updateHeaderPartnerStatus();
            if (!openDropdownUser) loadInbox();
        }, 3000);

        window.addEventListener("beforeunload", () => broadcastPagePresence(false));
        window.addEventListener("pagehide", () => broadcastPagePresence(false));

        socket.on("connect", () => {
            socket.emit("userJoined", currentUser);
            broadcastPagePresence(true);
            loadInbox();
        });

        socket.on("updateUserCount", count => {
            $("online-count").innerText = count;
            broadcastPagePresence(true);
        });

        socket.on("onlineUsers", list => {
            if (Array.isArray(list)) {
                Object.keys(onlineUsersMap).forEach(k => onlineUsersMap[k] = 0);
                list.forEach(u => {
                    if (u) onlineUsersMap[String(u).toLowerCase()] = Date.now();
                });
                sessionStorage.setItem("privateOnlineUsers", JSON.stringify(onlineUsersMap));
                updateHeaderPartnerStatus();
                loadInbox();
            }
        });

        function handleTyping() {
            if (!selectedUser) return;
            socket.emit("typing", currentUser);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit("stopTyping", currentUser);
            }, 1000);
        }

        socket.on("userTyping", username => {
            if (!username) return;
            const raw = String(username);
            if (raw.startsWith("__PRESENCE_ONLINE__:")) {
                setUserOnlineStatus(raw.split(":")[1], true);
                return;
            }
            setUserOnlineStatus(raw, true);
            if (raw.toLowerCase() !== selectedUser.toLowerCase()) return;
            $("typing-indicator").innerText = " • typing...";
            $("typing-indicator").style.display = "inline-block";
        });

        socket.on("userStopTyping", username => {
            if (username) setUserOnlineStatus(username, true);
            if (!username || String(username).toLowerCase() === selectedUser.toLowerCase()) {
                $("typing-indicator").style.display = "none";
            }
        });

        // ==========================================
        // 5. INBOX & 3-DOT MENU
        // ==========================================
        function formatAMPM(date) {
            let hours = date.getHours();
            let minutes = date.getMinutes();
            const ampm = hours >= 12 ? "PM" : "AM";
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            return hours + ":" + minutes + " " + ampm;
        }

        function getDisplayTitle(u) {
            const meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            const nick = meta[u]?.nickname;
            return nick ? `${nick} (@${u})` : `@${u}`;
        }

        window.startChat = function() {
            if (registerBtn.disabled) return;
            const u = usernameInput.value.trim();
            if (u) {
                addInbox(u);
                openChat(u);
                usernameInput.value = "";
                usernameStatus.innerHTML = "";
                registerBtn.disabled = true;
                registerBtn.style.opacity = "0.5";
                $("searchBox").style.display = "none";
            }
        };

        function addInbox(u) {
            u = u.toLowerCase();
            let users = JSON.parse(localStorage.getItem("privateUsers")) || [];
            if (!users.includes(u)) {
                users.push(u);
                localStorage.setItem("privateUsers", JSON.stringify(users));
                loadInbox();
            }
        }

        function closeAllDropdowns() {
            openDropdownUser = null;
            document.querySelectorAll(".inbox-dropdown").forEach(el => el.classList.remove("show"));
        }

        window.toggleUserDropdown = function(e, u) {
            e.stopPropagation();
            const menuId = `dropdown_${u}`;
            const menu = $(menuId);
            const isAlreadyOpen = menu && menu.classList.contains("show");
            closeAllDropdowns();
            if (menu && !isAlreadyOpen) {
                menu.classList.add("show");
                openDropdownUser = u;
            }
        };

        window.togglePinChat = function(e, u) {
            e.stopPropagation();
            closeAllDropdowns();
            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (!meta[u]) meta[u] = { unread: 0, lastMessage: "", lastTime: "", lastActivity: 0 };
            meta[u].pinned = !meta[u].pinned;
            localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
            loadInbox();
        };

        window.setChatNickname = function(e, u) {
            e.stopPropagation();
            closeAllDropdowns();
            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (!meta[u]) meta[u] = { unread: 0, lastMessage: "", lastTime: "", lastActivity: 0 };
            const currentNick = meta[u].nickname || "";
            const newNick = prompt(`@${u} ke liye nickname enter karein:`, currentNick);
            if (newNick !== null) {
                meta[u].nickname = newNick.trim();
                localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
                if (selectedUser === u) $("chatTitle").innerText = getDisplayTitle(u);
                loadInbox();
            }
        };

        window.markChatUnread = function(e, u) {
            e.stopPropagation();
            closeAllDropdowns();
            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (!meta[u]) meta[u] = { unread: 0, lastMessage: "", lastTime: "", lastActivity: Date.now() };
            meta[u].unread = Math.max(1, meta[u].unread || 1);
            localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
            loadInbox();
        };

        window.markChatRead = function(e, u) {
            e.stopPropagation();
            closeAllDropdowns();
            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (meta[u]) {
                meta[u].unread = 0;
                localStorage.setItem("privateInboxMeta", JSON.stringify(meta));
            }
            loadInbox();
        };

        window.deleteUserChat = function(e, u) {
            e.stopPropagation();
            closeAllDropdowns();
            if (confirm(`Kya aap sach me @${u} ko inbox se delete karna chahte hain?`)) {
                let users = JSON.parse(localStorage.getItem("privateUsers")) || [];
                users = users.filter(item => item.toLowerCase() !== u.toLowerCase());
                localStorage.setItem("privateUsers", JSON.stringify(users));

                let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
                chats = chats.filter(c => {
                    const s = (c.sender || "").toLowerCase();
                    const r = (c.receiver || "").toLowerCase();
                    return !((s === currentUser && r === u) || (s === u && r === currentUser));
                });
                localStorage.setItem("privateChats", JSON.stringify(chats));

                let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
                delete meta[u];
                localStorage.setItem("privateInboxMeta", JSON.stringify(meta));

                if (selectedUser === u) {
                    selectedUser = "";

                    $("chatTitle").innerText = "Select a Chat";

        function loadInbox() {
            const inbox = $("inboxList");
            if (!inbox) return;
            inbox.innerHTML = "";

            const users = JSON.parse(localStorage.getItem("privateUsers")) || [];
            const meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            const query = ($("inboxSearchInput")?.value || "").trim().toLowerCase();

            users.sort((a, b) => {
                const pinA = meta[a]?.pinned ? 1 : 0;
                const pinB = meta[b]?.pinned ? 1 : 0;
                if (pinA !== pinB) return pinB - pinA;
                return (meta[b]?.lastActivity || 0) - (meta[a]?.lastActivity || 0);
            });

            users.forEach(u => {
                const info = meta[u] || {};
                const nickname = (info.nickname || "").toLowerCase();
                if (query && !u.includes(query) && !nickname.includes(query)) return;

                const unread = info.unread || 0;
                const isPinned = !!info.pinned;
                const online = isPartnerOnline(u);

                const dot = unread > 0 ? `<span style="width:10px;height:10px;background:#00d26a;border-radius:50%;display:inline-block;margin-right:8px;flex-shrink:0;"></span>` : "";
                const badge = unread > 0 ? `<span style="background:#00d26a;color:#000;font-weight:bold;border-radius:20px;padding:2px 8px;font-size:11px;">${unread}</span>` : "";
                const pinIcon = isPinned ? `<span title="Pinned" style="margin-right:6px;font-size:13px;">📌</span>` : "";
                const displayLabel = info.nickname ? `<strong>${escapeHTML(info.nickname)}</strong> <span style="font-size:11px;color:#888;">(@${escapeHTML(u)})</span>` : `<strong>@${escapeHTML(u)}</strong>`;
                const statusTag = `<span class="user-status-sub ${online ? 'is-online' : 'is-offline'}">${online ? '● Online' : '○ Offline'}</span>`;

                const d = document.createElement("div");
                d.className = "inbox" + (selectedUser === u ? " active" : "") + (isPinned ? " pinned-chat" : "");
                d.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div style="display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                            ${dot}
                            ${pinIcon}
                            <div>
                                <div>${displayLabel}</div>
                                ${statusTag}
                            </div>
                        </div>
                        <div class="inbox-right">
                            ${badge}
                            <button class="three-dot-btn" onclick="toggleUserDropdown(event, '${u}')" title="Options">⋮</button>
                            <div class="inbox-dropdown" id="dropdown_${u}">
                                <button class="dropdown-item" onclick="togglePinChat(event, '${u}')">📌 ${isPinned ? "Unpin Chat" : "Pin Chat"}</button>
                                <button class="dropdown-item" onclick="setChatNickname(event, '${u}')">✏️ Set Nickname</button>
                                <button class="dropdown-item" onclick="markChatUnread(event, '${u}')">🔵 Mark as Unread</button>
                                <button class="dropdown-item" onclick="markChatRead(event, '${u}')">✔️ Mark as Read</button>
                                <button class="dropdown-item delete-opt" onclick="deleteUserChat(event, '${u}')">🗑️ Delete Chat</button>
                            </div>
                        </div>
                    </div>
                `;
                d.onclick = () => openChat(u);
                inbox.appendChild(d);
            });
        }

        window.openChat = function(u) {
            selectedUser = u.toLowerCase();
            sessionStorage.setItem("activePrivateChat", selectedUser);
            $("chatTitle").innerText = getDisplayTitle(selectedUser);
            $("typing-indicator").style.display = "none";

                localStorage.setItem("privateInboxMeta", JSON.stringify(meta));

        // ==========================================
        // 6. MESSAGE INFO (ⓘ), UNSEND & REACTIONS
        // ==========================================
        function markMyMessagesDeliveredTo(partnerUser) {
            partnerUser = partnerUser.toLowerCase();
            let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            let changed = false;
            chats.forEach(c => {
                if ((c.sender || "").toLowerCase() === currentUser && (c.receiver || "").toLowerCase() === partnerUser && !c.delivered) {
                    c.delivered = true;
                    changed = true;
                }
            });
            if (changed) {
                localStorage.setItem("privateChats", JSON.stringify(chats));
                if (selectedUser === partnerUser) renderMessages();
            }
        }

        function markMessagesAsSeen(partnerUser) {
            partnerUser = partnerUser.toLowerCase();
            let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            let updated = false;
            const seenTime = formatAMPM(new Date());

            chats.forEach(c => {
                if ((c.sender || "").toLowerCase() === partnerUser && (c.receiver || "").toLowerCase() === currentUser && !c.seen) {
                    c.seen = true;
                    c.delivered = true;
                    c.seenAt = seenTime;
                    updated = true;
                }
            });

            if (updated) {
                localStorage.setItem("privateChats", JSON.stringify(chats));
            }

            socket.emit("private_message", {
                id: "seen_" + Date.now(),
                sender: currentUser,
                receiver: partnerUser,
                type: "seen_receipt",
                text: "__SEEN_RECEIPT__",
                seenAt: seenTime
            });
        }

        window.closeMsgInfoModal = function() {
            $("msgInfoModal").classList.remove("show");
        };

        window.showMsgInfo = function(msgId) {
            const chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            const m = chats.find(c => String(c.id) === String(msgId));
            if (!m) return;

            const isMy = (m.sender || "").toLowerCase() === currentUser;
            if (!isMy) return;

            const senderLabel = `@${currentUser} (You)`;
            let seenStatus = "Sent ✓";
            let seenTimeHtml = "Nobody seen yet...";

            if (m.seen) {
                seenStatus = `@${m.receiver} ✓✓`;
                seenTimeHtml = `<div style="margin: 2px 0;"><b>@${escapeHTML(m.receiver)}</b> : ${m.seenAt || m.time}</div>`;
            } else if (m.delivered || isPartnerOnline(m.receiver)) {
                seenStatus = "Delivered ✓✓";
            }

            $("infoFromVal").textContent = senderLabel;
            $("infoSentVal").textContent = m.time;
            $("infoStatusVal").textContent = seenStatus;
            $("infoSeenTimeVal").innerHTML = seenTimeHtml;
            $("msgInfoModal").classList.add("show");
        };
