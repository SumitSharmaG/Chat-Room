<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#0f0f0f;
            color:white;
            height:100vh;
            overflow:hidden;
        }

        .app{
            display:flex;
            height:100vh;
            width:100%;
        }

        /* SIDEBAR */

        .sidebar{
            width:320px;
            background:#121212;
            border-right:1px solid #222;
            display:flex;
            flex-direction:column;
        }

        .top{
            padding:16px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid #222;
        }

        .top h2{
            color:#d4af6a;
            font-size:22px;
        }

        .add-btn{
            width:38px;
            height:38px;
            border:none;
            border-radius:50%;
            background:#d4af6a;
            color:black;
            font-size:26px;
            cursor:pointer;
            font-weight:bold;
        }

        /* SEARCH */

        .search-box{
            display:none;
            padding:12px;
            border-bottom:1px solid #222;
        }

        .search-box input{
            width:100%;
            padding:12px;
            border:none;
            outline:none;
            border-radius:12px;
            background:#1d1d1d;
            color:white;
        }

        .search-box button{
            width:100%;
            margin-top:10px;
            padding:12px;
            border:none;
            border-radius:12px;
            background:#d4af6a;
            font-weight:bold;
            cursor:pointer;
        }

        /* INBOX */

        .inbox-list{
            flex:1;
            overflow-y:auto;
            padding:12px;
        }

        .inbox{
            background:#1b1b1b;
            padding:14px;
            border-radius:14px;
            margin-bottom:10px;
            cursor:pointer;
            transition:0.3s;
            font-size:15px;
        }

        .inbox:hover{
            background:#262626;
        }

        /* CHAT */

        .chat-area{
            flex:1;
            display:flex;
            flex-direction:column;
            background:#0f0f0f;
        }

        .chat-header{
            padding:14px;
            background:#151515;
            border-bottom:1px solid #222;
            display:flex;
            align-items:center;
            gap:10px;
            color:#d4af6a;
            font-weight:bold;
            flex-wrap:wrap;
        }

        .back-btn{
            display:none;
            background:none;
            border:none;
            color:#d4af6a;
            font-size:24px;
            cursor:pointer;
        }

        .top-btn{
            background:#1d1d1d;
            color:#d4af6a;
            border:none;
            padding:7px 10px;
            border-radius:8px;
            cursor:pointer;
            font-size:13px;
        }

        .clear-btn{
            background:red;
            color:white;
        }

        /* MESSAGES */

        .messages{
            flex:1;
            overflow-y:auto;
            padding:16px;
            display:flex;
            flex-direction:column;
            gap:12px;
            padding-bottom:90px;
        }

        .msg{
            max-width:80%;
            background:#1d1d1d;
            padding:12px 14px;
            border-radius:14px;
            word-wrap:break-word;
            line-height:1.4;
        }

        .my-msg{
            align-self:flex-end;
            background:#d4af6a;
            color:black;
        }

        .msg-bottom{
            margin-top:5px;
            display:flex;
            align-items:center;
            gap:6px;
            font-size:11px;
            opacity:0.8;
        }

        .info-btn{
            background:none;
            border:none;
            color:#d4af6a;
            cursor:pointer;
            font-size:14px;
        }

        /* SEND */

        .send-box{
            padding:14px;
            display:flex;
            gap:10px;
            border-top:1px solid #222;
            background:#111;
        }

        .send-box input{
            flex:1;
            padding:14px;
            border:none;
            outline:none;
            border-radius:14px;
            background:#1d1d1d;
            color:white;
            font-size:15px;
        }

        .send-box button{
            width:60px;
            border:none;
            border-radius:14px;
            background:#d4af6a;
            font-size:20px;
            cursor:pointer;
            font-weight:bold;
        }

        #typing{
            color:#b59461;
            padding-left:16px;
            padding-bottom:8px;
            font-size:12px;
            display:none;
        }

        /* MOBILE */

        @media(max-width:768px){

            .sidebar{
                width:100%;
                height:100vh;
            }

            .chat-area{
                display:none;
                width:100%;
                height:100vh;
                position:fixed;
                top:0;
                left:0;
                background:#0f0f0f;
                z-index:999;
            }

            .chat-header{
                position:fixed;
                top:0;
                left:0;
                width:100%;
                z-index:999;
            }

            .back-btn{
                display:block;
            }

            .messages{
                margin-top:95px;
                margin-bottom:90px;
                padding-bottom:100px;
            }

            .msg{
                max-width:90%;
                font-size:14px;
            }

            .send-box{
                position:fixed;
                bottom:0;
                left:0;
                width:100%;
                z-index:1000;
            }

        }

    </style>

</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->

        <div class="sidebar" id="sidebar">

            <div class="top">

                <h2>Private Chats</h2>

                <button
                    class="add-btn"
                    onclick="toggleSearch()"
                >
                    +
                </button>

            </div>


            <!-- SEARCH -->

            <div class="search-box" id="searchBox">

                <input
                    type="text"
                    id="usernameInput"
                    placeholder="username"
                >

                <button onclick="startChat()">
                    Start Chat
                </button>

            </div>


            <!-- INBOX -->

            <div
                class="inbox-list"
                id="inboxList"
            ></div>

        </div>



        <!-- CHAT AREA -->

        <div
            class="chat-area"
            id="chatArea"
        >

            <div class="chat-header">

                <button
                    class="back-btn"
                    onclick="goBack()"
                >
                    ←
                </button>

                <a
                    href="selection.html"
                    style="
                    color:#d4af6a;
                    text-decoration:none;
                    font-size:22px;
                    "
                >
                    🏠
                </a>

                <div>
                    👁️
                    <span id="online-count">
                        0
                    </span>
                </div>

                <button
                    class="top-btn clear-btn"
                    onclick="clearPrivateChat()"
                >
                    Clear
                </button>

                <button
                    class="top-btn"
                    onclick="logout()"
                >
                    Logout
                </button>

                <span id="chatTitle">
                    Select Chat
                </span>

            </div>


            <!-- MESSAGES -->

            <div
                class="messages"
                id="messages"
            ></div>

            <div id="typing">
                typing...
            </div>


            <!-- SEND -->

            <div class="send-box">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type message..."
                >

                <button onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </div>



    <!-- SOCKET -->

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>

        const BACKEND =
            "https://chat-backend-gtg5.onrender.com";

        const socket =
            io(BACKEND,{
                transports:["websocket"]
            });

        const currentUser =
            localStorage.getItem("username") || "guest";

        let selectedUser = "";

        const seenMap = {};


        // PAGE LOAD

        window.onload = () => {

            loadInbox();

            socket.on("connect",()=>{

                socket.emit(
                    "userJoined",
                    currentUser
                );

            });

            if(window.innerWidth <= 768){

                document.getElementById(
                    "chatArea"
                ).style.display = "none";
            }
        };



        // TOGGLE SEARCH

        function toggleSearch(){

            const box =
                document.getElementById("searchBox");

            box.style.display =

                box.style.display === "block"

                ?

                "none"

                :

                "block";
        }



        // START CHAT

        function startChat(){

            const username =
                document.getElementById(
                    "usernameInput"
                ).value.trim();

            if(!username) return;

            addInbox(username);

            openChat(username);

            document.getElementById(
                "usernameInput"
            ).value = "";

            document.getElementById(
                "searchBox"
            ).style.display = "none";
        }



        // ADD INBOX

        function addInbox(username){

            let users =
                JSON.parse(
                    localStorage.getItem("privateUsers")
                ) || [];

            username =
                username.replace("@","");

            if(users.includes(username)) return;

            users.push(username);

            localStorage.setItem(
                "privateUsers",
                JSON.stringify(users)
            );

            renderInbox(username);
        }



        // RENDER INBOX

        function renderInbox(username){

            const list =
                document.getElementById("inboxList");

            const div =
                document.createElement("div");

            div.classList.add("inbox");

            div.innerText =
                "@" + username;

            div.onclick = () => {

                openChat(username);

            };

            list.appendChild(div);
        }



        // LOAD INBOX

        function loadInbox(){

            const users =
                JSON.parse(
                    localStorage.getItem("privateUsers")
                ) || [];

            document.getElementById(
                "inboxList"
            ).innerHTML = "";

            users.forEach((user)=>{

                renderInbox(user);

            });
        }



        // OPEN CHAT

        function openChat(username){

            selectedUser =
                username.replace("@","");

            document.getElementById(
                "chatTitle"
            ).innerText =
                "Chat with @" + username;

            loadMessages();

            if(window.innerWidth <= 768){

                document.getElementById(
                    "sidebar"
                ).style.display = "none";

                document.getElementById(
                    "chatArea"
                ).style.display = "flex";
            }
        }



        // BACK

        function goBack(){

            if(window.innerWidth <= 768){

                document.getElementById(
                    "sidebar"
                ).style.display = "flex";

                document.getElementById(
                    "chatArea"
                ).style.display = "none";
            }
        }



        // LOAD MESSAGES

        function loadMessages(){

            const box =
                document.getElementById("messages");

            box.innerHTML = "";

            const chats =
                JSON.parse(
                    localStorage.getItem("privateChats")
                ) || [];

            chats.forEach((chat)=>{

                if(

                    (
                        chat.sender === currentUser
                        &&
                        chat.receiver === selectedUser
                    )

                    ||

                    (
                        chat.sender === selectedUser
                        &&
                        chat.receiver === currentUser
                    )

                ){

                    const div =
                        document.createElement("div");

                    div.classList.add("msg");

                    if(chat.sender === currentUser){

                        div.classList.add("my-msg");
                    }

                    div.innerHTML =

                    `
                    <b>@${chat.sender}</b><br>

                    ${chat.text}

                    <div class="msg-bottom">

                    ${chat.time || ""}

                    <button
                    class="info-btn"
                    onclick="showSeen('${chat._id}')"
                    >
                    ⓘ
                    </button>

                    </div>
                    `;

                    box.appendChild(div);

                }

            });

            box.scrollTop =
                box.scrollHeight;
        }



        // SEND MESSAGE

        function sendMessage(){

            if(!selectedUser) return;

            const input =
                document.getElementById(
                    "messageInput"
                );

            const text =
                input.value.trim();

            if(!text) return;

            socket.emit(
                "private_message",
                {

                    sender:
                    currentUser,

                    receiver:
                    selectedUser,

                    text:text

                }
            );

            input.value = "";
        }



        // RECEIVE MESSAGE

        socket.on(
            "receive_private_message",
            (data)=>{

                if(

                    data.receiver === currentUser

                    ||

                    data.sender === currentUser

                ){

                    let chats =
                        JSON.parse(
                            localStorage.getItem(
                                "privateChats"
                            )
                        ) || [];

                    chats.push(data);

                    localStorage.setItem(
                        "privateChats",
                        JSON.stringify(chats)
                    );

                    const otherUser =

                        data.sender === currentUser

                        ?

                        data.receiver

                        :

                        data.sender;

                    addInbox(otherUser);

                    if(selectedUser === otherUser){

                        loadMessages();

                    }

                    // SEEN

                    if(
                        data._id &&
                        data.sender !== currentUser
                    ){

                        socket.emit(
                            "private_seen",
                            {
                                messageId:data._id,
                                username:currentUser
                            }
                        );

                    }

                }

            }
        );



        // ONLINE COUNT

        socket.on(
            "updateUserCount",
            (count)=>{

                document.getElementById(
                    "online-count"
                ).innerText = count;

            }
        );



        // TYPING

        document.getElementById(
            "messageInput"
        ).addEventListener(
            "input",
            ()=>{

                if(!selectedUser) return;

                socket.emit(
                    "private_typing",
                    {
                        to:selectedUser,
                        from:currentUser
                    }
                );

                clearTimeout(
                    window.typingTimeout
                );

                window.typingTimeout =
                    setTimeout(()=>{

                        socket.emit(
                            "private_stop_typing",
                            {
                                to:selectedUser
                            }
                        );

                    },1000);

            }
        );



        // SHOW TYPING

        socket.on(
            "private_user_typing",
            (user)=>{

                const el =
                    document.getElementById(
                        "typing"
                    );

                el.style.display =
                    "block";

                el.innerText =
                    user + " typing...";

            }
        );



        // STOP TYPING

        socket.on(
            "private_stop_typing",
            ()=>{

                document.getElementById(
                    "typing"
                ).style.display = "none";

            }
        );



        // SEEN

        socket.on(
            "private_seen_update",
            ({messageId,seenBy})=>{

                seenMap[messageId] =
                    seenBy;

            }
        );



        // SHOW SEEN

        function showSeen(id){

            const users =
                seenMap[id] || [];

            alert(
                "Seen by:\n" +
                users.join("\n")
            );

        }



        // CLEAR CHAT

        function clearPrivateChat(){

            if(!selectedUser) return;

            if(confirm("Clear this chat?")){

                socket.emit(
                    "clear_private_chat",
                    {
                        user1:currentUser,
                        user2:selectedUser
                    }
                );

            }

        }



        socket.on(
            "private_chat_cleared",
            ({user1,user2})=>{

                let chats =
                    JSON.parse(
                        localStorage.getItem(
                            "privateChats"
                        )
                    ) || [];

                chats =
                    chats.filter((chat)=>{

                        return !(

                            (
                                chat.sender === user1
                                &&
                                chat.receiver === user2
