<!DOCTYPE html>
<html lang="en">
<head>
    <!--  -->
<script>
    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "login.html";
    }
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Private Chat Pro</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        body{background:#0f0f0f;color:white;height:100dvh;overflow:hidden;width:100%;}
        .app{display:flex;height:100dvh;width:100%;position:relative;
            
            -webkit-user-select: none;
user-select: none;
-webkit-touch-callout: none;
-webkit-tap-highlight-color: transparent;}

        /* SIDEBAR */
        .sidebar{width:320px;background:#121212;border-right:1px solid #222;display:flex;flex-direction:column;flex-shrink:0;}
        .top{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;}
        .top h2{color:#d4af6a;font-size:20px;}
        .home-link{text-decoration:none;font-size:20px;}
        .add-btn{width:35px;height:35px;border:none;border-radius:50%;background:#d4af6a;cursor:pointer;font-weight:bold;font-size:20px;}

        .inbox-list{flex:1;overflow-y:auto;padding:10px;}
        .inbox{background:#1b1b1b;padding:15px;border-radius:12px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;}

        /* CHAT AREA */
        .chat-area{flex:1;display:flex;flex-direction:column;background:#0f0f0f;height:100%;}
        .chat-header{padding:10px 15px;background:#151515;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;min-height:65px;}
        .back-btn{display:none;background:none;border:none;color:#d4af6a;font-size:22px;cursor:pointer;}
        #chatTitle{color:#d4af6a;font-weight:bold;font-size:14px;}

        /* MESSAGES */
        .messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;}
        .msg{max-width:85%;padding:10px 12px;border-radius:15px;word-wrap:break-word;font-size:14px;position:relative;}
        .received-msg{background:#1d1d1d;align-self:flex-start;border-bottom-left-radius:2px;}
        .my-msg{background:#d4af6a;color:black;align-self:flex-end;border-bottom-right-radius:2px;}
        
        /* ALERT STYLE */
        .system-alert{background: #f1c40f; color: #000; padding: 5px 12px; border-radius: 8px; font-size: 11px; text-align: center; align-self: center; font-weight: bold; margin: 5px 0;}

        .msg-meta{font-size:9px;display:flex;justify-content:flex-end;align-items:center;margin-top:5px;opacity:0.8;}
        .info-btn{background:none;border:none;color:inherit;font-size:11px;cursor:pointer;margin-left:5px;}

        /* INPUT AREA */
        .send-box{padding:10px;background:#111;border-top:1px solid #222;display:flex;gap:8px;align-items:center;padding-bottom: env(safe-area-inset-bottom, 10px);}
        .send-box input{flex:1;padding:12px 15px;border:none;outline:none;border-radius:25px;background:#1d1d1d;color:white;font-size:14px;}
        .send-box button{width:45px;height:45px;border:none;border-radius:50%;background:#d4af6a;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

        @media(max-width:768px){
            .sidebar{width:100%;position:absolute;height:100%;z-index:1;}
            .chat-area{width:100%;position:absolute;height:100%;z-index:2;display:none;}
            .back-btn{display:block;}
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="app">
        <div class="sidebar" id="sidebar">
            <div class="top">
                <a href="/" class="home-link">🏠</a>
                <h2>Private Chats</h2>
                <button class="add-btn" onclick="toggleSearch()">+</button>
            </div>
            <div id="searchBox" style="display:none; padding:12px;">
                <input type="text" id="usernameInput" placeholder="username" style="width:100%; padding:10px; background:#1d1d1d; color:white; border:1px solid #333; border-radius:8px;">
                <button onclick="startChat()" style="width:100%; margin-top:5px; padding:8px; background:#d4af6a; border:none; border-radius:8px; font-weight:bold;">Start</button>
            </div>
            <div class="inbox-list" id="inboxList"></div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button class="back-btn" onclick="goBack()">←</button>
                    <div><span id="chatTitle">Select Chat</span><br><span id="typing-indicator" style="font-size:10px; color:#d4af6a; display:none;">typing...</span></div>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <span style="font-size:10px;">👁️ <span id="online-count">0</span></span>
                    <button onclick="clearAllChat()" style="color:#ff4d4d; background:none; border:1px solid #ff4d4d; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">Clear</button>
                    <button onclick="logout()" style="color:#d4af6a; background:none; border:1px solid #d4af6a; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">Logout</button>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <div class="send-box">
                <input type="text" id="messageInput" placeholder="Type message..." oninput="handleTyping()">
                <button onclick="sendMessage()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
            </div>
        </div>
    </div>

    <script src="https://chat-backend-gtg5.onrender.com/socket.io/socket.io.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const socket = io(
    "https://chat-backend-gtg5.onrender.com",
    {
        transports: ["websocket"],
        auth: {
            token: localStorage.getItem("token")
        }
    }
);
        const currentUser = localStorage.getItem("username") || "guest";
        let selectedUser = "";
        let typingTimeout;

        // --- 3-Finger Screenshot Alert (In-Chat Yellow Alert) ---
        document.addEventListener('touchstart', e => {
            if(e.touches.length >= 3 && selectedUser) {
                const time = formatAMPM(new Date());
                const alertData = { sender: "SYSTEM", receiver: selectedUser, text: "⚠️ Security Alert: Someone tried to take a screenshot!", time: time, type: "alert" };
                saveAndRender(alertData);
                socket.emit("private_message", alertData); // Notify other user
            }
        });

        socket.on("connect", () => {
            socket.emit("userJoined", currentUser);
            loadInbox();
        });

        socket.on("updateUserCount", count => $("online-count").innerText = count);

        // --- Typing ---
        function handleTyping() {

    if (!selectedUser) return;

    socket.emit("typing", currentUser);

    clearTimeout(typingTimeout);

    typingTimeout = setTimeout(() => {

        socket.emit(
            "stopTyping",
            currentUser
        );

    }, 1000);
}

socket.on("userTyping", username => {

    if (username === currentUser) return;

    $("typing-indicator").innerText =
        username + " typing...";

    $("typing-indicator").style.display =
        "block";
});

socket.on("userStopTyping", () => {

    $("typing-indicator").style.display =
        "none";
});

        // --- Time Formatter (02:30pm) ---
        function formatAMPM(date) {
            let hours = date.getHours();
            let minutes = date.getMinutes();
            let ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0'+minutes : minutes;
            return (hours < 10 ? '0'+hours : hours) + ':' + minutes + ampm;
        }

        function startChat() {
            const u = $("usernameInput").value.trim().replace("@","");
            if(u) { addInbox(u); openChat(u); $("usernameInput").value = ""; $("searchBox").style.display = "none"; }
        }

        function toggleSearch() { $("searchBox").style.display = ($("searchBox").style.display === "block" ? "none" : "block"); }

        function addInbox(u) {
            let users = JSON.parse(localStorage.getItem("privateUsers")) || [];
            if(!users.includes(u)) { users.push(u); localStorage.setItem("privateUsers", JSON.stringify(users)); loadInbox(); }
        }

        function loadInbox() {
            $("inboxList").innerHTML = "";
            (JSON.parse(localStorage.getItem("privateUsers")) || []).forEach(u => {
                const d = document.createElement("div"); d.className = "inbox"; d.innerText = "@" + u;
                d.onclick = () => openChat(u); $("inboxList").appendChild(d);
            });
        }

        function openChat(u) {
            selectedUser = u; $("chatTitle").innerText = "@" + u; renderMessages();
            if(window.innerWidth <= 768) { $("sidebar").style.display = "none"; $("chatArea").style.display = "flex"; }
        }

        function sendMessage() {
            const txt = $("messageInput").value.trim();
            if(!txt || !selectedUser) return;
            const data = { sender: currentUser, receiver: selectedUser, text: txt, time: formatAMPM(new Date()), id: Date.now() };
            socket.emit("private_message", data);
            saveAndRender(data);
            $("messageInput").focus();
        }

        function saveAndRender(data) {
            let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            chats.push(data);
            localStorage.setItem("privateChats", JSON.stringify(chats));
            if(selectedUser === data.sender || selectedUser === data.receiver) renderMessages();
        }

        socket.on("receive_private_message", data => saveAndRender(data));
        function renderMessages() {
            const b = $("messages"); b.innerHTML = "";
            const chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            chats.filter(c => (c.sender === currentUser && c.receiver === selectedUser) || (c.sender === selectedUser && c.receiver === currentUser) || (c.sender === "system" && (c.receiver === selectedUser || c.receiver === currentUser)))
                 .forEach(m => {
                    if(m.sender === "system") {
                        b.insertAdjacentHTML('beforeend', `<div class="system-alert">${m.text}</div>`);
                    } else {
                        const isMy = m.sender === currentUser;
                        b.insertAdjacentHTML('beforeend', `
                            <div class="msg ${isMy ? 'my-msg' : 'received-msg'}">
                                ${m.text}
                                <div class="msg-meta">
                                    ${m.time} <button class="info-btn" onclick="alert('Sent: ${m.time}\\nSeen: Tik ✓\\nTime: ${m.time}')">ⓘ</button>
                                </div>
                            </div>
                        `);
                    }
                 });
            b.scrollTop = b.scrollHeight;
        }

        function clearAllChat() {
            if(confirm("Dono side ke message clear karein?")) {
                let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
                chats = chats.filter(c => !((c.sender === currentUser && c.receiver === selectedUser) || (c.sender === selectedUser && c.receiver === currentUser)));
                localStorage.setItem("privateChats", JSON.stringify(chats));
                renderMessages();
            }
        }

        function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}
        function goBack() { $("sidebar").style.display = "flex"; $("chatArea").style.display = "none"; }
        $("messageInput").onkeydown = e => e.key === "Enter" && sendMessage();
    </script>

<script>

// Right Click Block
document.addEventListener("contextmenu", function(e) {
    e.preventDefault();
});

// Text Selection Block
document.addEventListener("selectstart", function(e) {
    e.preventDefault();
});

// Copy Block
document.addEventListener("copy", function(e) {
    e.preventDefault();
});

// Cut Block
document.addEventListener("cut", function(e) {
    e.preventDefault();
});

// Drag Block
document.addEventListener("dragstart", function(e) {
    e.preventDefault();
});

</script>
    
</body>
</html>
