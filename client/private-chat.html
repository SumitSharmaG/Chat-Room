<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Private Chat Pro</title>
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #131419;
            --bg-card: #1c1e26;
            --accent-gold: #d4af6a;
            --accent-gold-hover: #e5c17c;
            --accent-green: #25D366;
            --text-main: #f0f0f0;
            --text-muted: #8a8d9b;
            --border-color: rgba(255, 255, 255, 0.08);
            --sidebar-width: 320px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100dvh;
            overflow: hidden;
            width: 100%;
        }

        .app {
            display: flex;
            height: 100dvh;
            width: 100%;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }

        .top {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(19, 20, 25, 0.8);
            backdrop-filter: blur(10px);
        }

        .top-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top h2 {
            color: var(--accent-gold);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .home-link {
            text-decoration: none;
            font-size: 18px;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .home-link:hover {
            color: var(--accent-gold);
        }

        .add-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: var(--accent-gold);
            color: #000;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background: var(--accent-gold-hover);
            transform: scale(1.05);
        }

        #searchBox {
            padding: 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        #searchBox input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        #searchBox button {
            width: 100%;
            margin-top: 8px;
            padding: 9px;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .inbox-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .inbox {
            background: var(--bg-card);
            padding: 14px 16px;
            border-radius: 14px;
            cursor: pointer;
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 14px;
        }

        .inbox:hover {
            border-color: rgba(212, 175, 106, 0.3);
            background: #232630;
        }

        .inbox.active {
            border-color: var(--accent-gold);
            background: rgba(212, 175, 106, 0.1);
            color: var(--accent-gold);
        }

        .unread-dot {
            width: 9px;
            height: 9px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
        }

        /* --- CHAT AREA --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            height: 100%;
            position: relative;
        }

        .chat-header {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 65px;
        }

        .back-btn {
            display: none;
            background: none;
            border: none;
            color: var(--accent-gold);
            font-size: 20px;
            cursor: pointer;
            padding-right: 8px;
        }

        #chatTitle {
            color: var(--accent-gold);
            font-weight: 700;
            font-size: 15px;
        }

        .online-status {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn-danger {
            color: #ff5252;
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .action-btn {
            color: var(--accent-gold);
            background: rgba(212, 175, 106, 0.1);
            border: 1px solid rgba(212, 175, 106, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        /* --- MESSAGES AREA --- */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .received-msg {
            background: var(--bg-card);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .my-msg {
            background: var(--accent-gold);
            color: #0d0d0d;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .system-alert {
            background: rgba(241, 196, 15, 0.15);
            color: #f1c40f;
            border: 1px solid rgba(241, 196, 15, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            text-align: center;
            align-self: center;
            font-weight: 600;
            margin: 8px 0;
        }

        .msg-meta {
            font-size: 9px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 4px;
            opacity: 0.7;
        }

        .info-btn {
            background: none;
            border: none;
            color: inherit;
            font-size: 10px;
            cursor: pointer;
            margin-left: 4px;
        }

        /* --- INPUT AREA & ATTACHMENTS --- */
        .send-box {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom, 12px);
            position: relative;
        }

        .send-box input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid var(--border-color);
            outline: none;
            border-radius: 25px;
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 14px;
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        .send-box input:focus {
            border-color: var(--accent-gold);
        }

        .send-box button.send-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: var(--accent-gold);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .send-box button.send-btn:active {
            transform: scale(0.92);
        }

        .attach-btn {
            width: 44px;
            height: 44px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: var(--bg-card);
            color: var(--accent-gold);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .attach-menu {
            position: fixed;
            bottom: 80px;
            left: 340px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 99999 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .attach-menu.show {
            display: flex !important;
        }

        .attach-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            cursor: pointer;
            padding: 10px 14px;
            border-radius: 12px;
            transition: background 0.2s;
            font-size: 13px;
        }

        .attach-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .attach-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            font-size: 16px;
        }

        /* --- OVERLAY VIEWER --- */
        .media-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .media-overlay.show {
            display: flex;
            opacity: 1;
        }

        .close-overlay-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 1.5rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* RESPONSIVE DESIGN */
        @media(max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                height: 100%;
                z-index: 10;
            }
            .chat-area {
                width: 100%;
                position: absolute;
                height: 100%;
                z-index: 20;
                display: none;
            }
            .back-btn {
                display: block;
            }
            .attach-menu {
                left: 16px;
                bottom: 80px;
            }
            .msg {
                max-width: 85%;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="app">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="top">
                <div class="top-brand">
                    <a href="/" class="home-link">🏠</a>
                    <h2>Private Chats</h2>
                </div>
                <button class="add-btn" onclick="toggleSearch()">+</button>
            </div>
            
            <div id="searchBox" style="display:none;">
                <input type="text" id="usernameInput" placeholder="Enter username...">
                <button onclick="startChat()">Start Chat</button>
            </div>
            
            <div class="inbox-list" id="inboxList"></div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-area" id="chatArea">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button class="back-btn" onclick="goBack()">←</button>
                    <div>
                        <span id="chatTitle">Select Chat</span>
                        <div id="typing-indicator" style="font-size:10px; color:var(--accent-gold); display:none;">typing...</div>
                    </div>
                </div>
                <div class="header-actions">
                    <span class="online-status">👁️ <span id="online-count">0</span></span>
                    <button class="action-btn-danger" onclick="clearAllChat()">Clear</button>
                    <button class="action-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <div class="send-box">
                <button class="attach-btn" id="attachBtn" onclick="event.stopPropagation(); document.getElementById('attachMenu').classList.toggle('show');">
                    📎
                </button>
                <input type="text" id="messageInput" placeholder="Type message..." oninput="handleTyping()">
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- HIDDEN MEDIA INPUTS FOR ATTACHMENTS.JS -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="galleryInput" accept="image/*" hidden>
    <input type="file" id="videoInput" accept="video/*" hidden>
    <input type="file" id="audioInput" accept="audio/*" hidden>
    <input type="file" id="documentInput" accept="*/*" hidden>

    <!-- ATTACHMENT MENU -->
    <div class="attach-menu" id="attachMenu">  
        <div class="attach-item" onclick="event.stopPropagation(); document.getElementById('cameraInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
            <div class="attach-icon">📷</div> <span>Camera</span>
        </div>  
        <div class="attach-item" onclick="event.stopPropagation(); document.getElementById('galleryInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
            <div class="attach-icon">🖼️</div> <span>Gallery</span>
        </div>  
        <div class="attach-item" onclick="event.stopPropagation(); document.getElementById('videoInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
            <div class="attach-icon">🎥</div> <span>Video</span>
        </div>  
        <div class="attach-item" onclick="event.stopPropagation(); document.getElementById('audioInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
            <div class="attach-icon">🎵</div> <span>Audio</span>
        </div>  
        <div class="attach-item" onclick="event.stopPropagation(); document.getElementById('documentInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
            <div class="attach-icon">📄</div> <span>Document</span>
        </div>  
    </div>

    <!-- FULLSCREEN MEDIA OVERLAY -->
    <div id="mediaOverlay" class="media-overlay">
        <button class="close-overlay-btn" onclick="document.getElementById('mediaOverlay').classList.remove('show')">&times;</button>
        <div id="overlayContent" style="width:100%; display:flex; justify-content:center; align-items:center;"></div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://chat-backend-gtg5.onrender.com/socket.io/socket.io.js"></script>
    <script src="js/mediaManager.js"></script>
    <script src="js/attachments.js"></script>  
    <script>
        const $ = id => document.getElementById(id);
        const socket = io(
            "https://chat-backend-gtg5.onrender.com",
            {
                transports: ["websocket"],
                auth: {
                    token: localStorage.getItem("token")
                }
            }
        );
        
        // CRITICAL SECURE BRIDGE FOR ATTACHMENTS.JS ENGINE
        window.socket = socket;

        const currentUser = localStorage.getItem("username") || "guest";
        let selectedUser = "";
        let typingTimeout;
        const activeTransfers = {};

        // --- 3-Finger Screenshot Alert ---
        document.addEventListener('touchstart', e => {
            if(e.touches.length >= 3 && selectedUser) {
                const time = formatAMPM(new Date());
                const alertData = { sender: "SYSTEM", receiver: selectedUser, text: "⚠️ Security Alert: Someone tried to take a screenshot!", time: time, type: "alert" };
                saveAndRender(alertData);
                socket.emit("private_message", alertData);
            }
        });

        socket.on("connect", () => {
            socket.emit("userJoined", currentUser);
            loadInbox();
        });

        socket.on("updateUserCount", count => {
            const countEl = $("online-count");
            if (countEl) countEl.innerText = count;
        });

        // --- Typing ---
        function handleTyping() {
            if (!selectedUser) return;
            socket.emit("typing", currentUser);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit("stopTyping", currentUser);
