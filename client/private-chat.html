<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "login.html";
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Private Chat Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0a;
            --bg-card: #141414;
            --accent-gold: #b59461;
            --accent-red: #ff4d4d;
            --text-main: #e0e0e0;
            --my-chat-bg: rgba(181, 148, 97, 0.18);
            --tick-blue: #34b7f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        @media print {
            body { display: none !important; }
        }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            height: 100dvh;
            overflow: hidden;
            width: 100%;
            position: fixed;
        }

        .app {
            display: flex;
            height: 100dvh;
            width: 100%;
            position: relative;
        }

        /* SIDEBAR */
        .sidebar {
            width: 340px;
            background: #121212;
            border-right: 1px solid rgba(181, 148, 97, 0.2);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
            z-index: 2;
        }

        .top {
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(181, 148, 97, 0.2);
            height: 78px;
            background: var(--bg-card);
        }

        /* --- 1. Left Header: Home & Back Button --- */
        .header-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }

        .home-btn {
            text-decoration: none;
            color: var(--accent-gold);
            font-size: 0.78rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border: 1px solid rgba(181, 148, 97, 0.35);
            border-radius: 20px;
            background: rgba(20, 20, 20, 0.7);
            transition: all 0.2s ease;
        }

        .home-btn:hover {
            background: var(--accent-gold);
            color: #000;
        }

        .nav-back-btn {
            text-decoration: none;
            color: #a0a0a0;
            font-size: 0.68rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
            margin-top: 7px;
            cursor: pointer;
        }

        .nav-back-btn:hover {
            color: var(--accent-gold);
            border-color: rgba(181, 148, 97, 0.4);
            background: rgba(181, 148, 97, 0.1);
        }

        /* --- Center Title (Background Switcher Trigger) --- */
        .chat-title-trigger {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold);
            font-size: 1.05rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: transform 0.15s ease, background 0.2s ease;
            text-align: center;
        }

        .chat-title-trigger:hover {
            background: rgba(181, 148, 97, 0.1);
        }

        .chat-title-trigger:active {
            transform: scale(0.95);
        }

        /* --- 2. Right Sidebar Actions: Secondary Logout on Top, Search & + Below --- */
        .top-right-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
        }

        .mini-exit-btn {
            background: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.35);
            color: var(--accent-red);
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 9px;
            border-radius: 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .mini-exit-btn:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(181, 148, 97, 0.35);
            border-radius: 50%;
            background: #1d1d1d;
            color: var(--accent-gold);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: var(--accent-gold);
            color: #000;
            cursor: pointer;
            font-weight: bold;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* NEW CHAT & FILTER SEARCH BOXES */
        #searchBox, #inboxFilterBox {
            display: none;
            padding: 12px;
            background: #161616;
            border-bottom: 1px solid #222;
        }

        #usernameInput, #inboxSearchInput {
            width: 100%;
            padding: 10px 12px;
            background: #1d1d1d;
            color: white;
            border: 1px solid rgba(181, 148, 97, 0.4);
            border-radius: 8px;
            outline: none;
            font-size: 13px;
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        #usernameStatus {
            font-size: 11px;
            margin-top: 6px;
            min-height: 16px;
            color: #ff6b6b;
        }

        #startChatBtn {
            width: 100%;
            margin-top: 6px;
            padding: 9px;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        /* INBOX LIST & ONLINE/OFFLINE TAG */
        .inbox-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            padding-bottom: 80px;
        }

        .inbox {
            background: #1b1b1b;
            padding: 11px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .inbox:hover, .inbox.active {
            border-color: var(--accent-gold);
            background: #222;
        }

        .inbox.pinned-chat {
            border-left: 3px solid var(--accent-gold);
            background: #1e1c18;
        }

        .user-status-sub {
            font-size: 0.66rem;
            opacity: 0.65;
            display: block;
            margin-top: 1px;
            font-weight: 400;
        }

        .user-status-sub.is-online {
            color: #00d26a;
            opacity: 0.9;
        }

        .user-status-sub.is-offline {
            color: #aaa;
            opacity: 0.55;
        }

        .inbox-right {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .three-dot-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 18px;
            font-weight: bold;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .three-dot-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-gold);
        }

        .inbox-dropdown {
            position: absolute;
            right: 0;
            top: 34px;
            background: #181818;
            border: 1px solid rgba(181, 148, 97, 0.4);
            border-radius: 10px;
            width: 175px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            z-index: 9999;
            overflow: hidden;
        }

        .inbox-dropdown.show {
            display: flex;
        }

        .dropdown-item {
            padding: 10px 12px;
            font-size: 12px;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            width: 100%;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: #252525;
            color: var(--accent-gold);
        }

        .dropdown-item.delete-opt {
            color: var(--accent-red);
        }

        .dropdown-item.delete-opt:hover {
            background: rgba(255, 77, 77, 0.12);
        }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            background-image: radial-gradient(at 0% 0%, rgba(30, 20, 16, 0.4) 0px, transparent 50%);
            height: 100%;
            z-index: 1;
            position: relative;
        }

        .chat-header {
            padding: 8px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(181, 148, 97, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 75px;
        }

        .back-btn {
            display: none;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(181, 148, 97, 0.3);
            color: var(--accent-gold);
            font-size: 14px;
            cursor: pointer;
            padding: 4px 9px;
            border-radius: 10px;
            margin-right: 4px;
        }

        #chatTitle {
            color: var(--accent-gold);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }

        .header-right-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .header-btn {
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
        }

        .clear-btn {
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .logout-btn {
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }

        /* MESSAGES */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .msg {
            max-width: 78%;
            width: fit-content;
            min-width: 110px;
            padding: 7px 12px;
            border-radius: 12px 12px 12px 2px;
            word-wrap: break-word;
            font-size: 0.85rem;
            line-height: 1.38;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .received-msg {
            background: #1a1a1a;
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .my-msg {
            background: #281e15;
            color: var(--text-main);
            align-self: flex-end;
            border-radius: 12px 12px 2px 12px;
            border: 1px solid rgba(181, 148, 97, 0.45);
        }

        .msg-sender {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent-gold);
            margin-bottom: 2px;
        }

        /* SCREENSHOT ALERT STYLE */
        .screenshot-alert {
            align-self: center !important;
            background: rgba(18, 18, 18, 0.9) !important;
            border: 1px dashed rgba(181, 148, 97, 0.35) !important;
            color: var(--accent-gold) !important;
            font-size: 0.72rem !important;
            padding: 4px 12px !important;
            border-radius: 20px !important;
            font-style: italic;
            text-align: center;
            max-width: 90%;
            margin: 4px 0;
        }

        .msg-meta {
            font-size: 0.64rem;
            color: #999;
            display: inline-flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 4px;
            align-self: flex-end;
            gap: 5px;
            position: relative;
        }

        .tick-icon {
            font-size: 0.76rem;
            font-weight: bold;
            letter-spacing: -2px;
            color: #888;
        }

        .tick-icon.seen {
            color: var(--tick-blue) !important;
        }

        .info-btn {
            background: rgba(181, 148, 97, 0.12);
            border: 1px solid rgba(181, 148, 97, 0.35);
            color: var(--accent-gold);
            font-size: 0.75rem;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin-left: 2px;
            touch-action: manipulation;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .info-btn:hover, .info-btn:active {
            background: var(--accent-gold);
            color: #000;
            transform: scale(1.1);
        }

        /* --- Improved Floating Unsend Tablet (Above Bubble, Never Covers Message Text) --- */
        .unsend-tablet {
            position: absolute;
            top: -36px;
            right: 0;
            background: #161616;
            border: 1px solid var(--accent-red);
            border-radius: 20px;
            padding: 5px 12px;
            display: none;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.9);
            z-index: 9999;
            white-space: nowrap;
            animation: popUnsend 0.18s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .unsend-tablet::after {
            content: "";
            position: absolute;
            bottom: -5px;
            right: 10px;
            width: 8px;
            height: 8px;
            background: #161616;
            border-right: 1px solid var(--accent-red);
            border-bottom: 1px solid var(--accent-red);
            transform: rotate(45deg);
        }

        .unsend-tablet.show {
            display: inline-flex;
        }

        @keyframes popUnsend {
            from { transform: translateY(6px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .unsend-action-btn {
            background: transparent;
            border: none;
            color: var(--accent-red);
            font-size: 0.74rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* --- Custom Message Info Modal --- */
        .msg-info-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .msg-info-modal-overlay.show {
            display: flex;
        }

        .msg-info-modal-box {
            background: #141414;
            border: 1px solid var(--accent-gold);
            border-radius: 14px;
            width: 100%;
            max-width: 340px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.85);
            color: var(--text-main);
            animation: fadeInModal 0.2s ease-out;
        }

        @keyframes fadeInModal {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .msg-info-header {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold);
            font-size: 1.15rem;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(181, 148, 97, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .msg-info-body {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 2px;
        }

        .msg-info-row {
            font-size: 0.82rem;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px dashed rgba(255,255,255,0.06);
            padding-bottom: 6px;
        }

        .msg-info-label {
            color: #aaa;
            font-weight: 500;
            flex-shrink: 0;
        }

        .msg-info-val {
            color: #fff;
            font-weight: 600;
            text-align: right;
            word-break: break-word;
        }

        .msg-info-close-btn {
            margin-top: 14px;
            width: 100%;
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* MEDIA ITEMS INSIDE CHAT */
        .chat-media-img {
            max-width: 240px;
            max-height: 240px;
            border-radius: 10px;
            margin-top: 4px;
            cursor: pointer;
            object-fit: cover;
            border: 1px solid rgba(181, 148, 97, 0.3);
        }

        .chat-media-video {
            max-width: 250px;
            max-height: 240px;
            border-radius: 10px;
            margin-top: 4px;
            background: #000;
        }

        .chat-media-audio {
            width: 220px;
            height: 36px;
            margin-top: 4px;
            border-radius: 20px;
        }

        .chat-media-doc {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.35);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(181, 148, 97, 0.3);
            margin-top: 4px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
        }

        /* INPUT AREA, VOICE RECORDING & PREVIEW BAR */
        .send-box {
            padding: 8px 12px;
            background: var(--bg-card);
            border-top: 1px solid rgba(181, 148, 97, 0.15);
            display: flex;
            gap: 8px;
            align-items: center;
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
            position: relative;
        }

        .attach-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #202020;
            color: #b59461;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            pointer-events: auto !important;
        }

        .attach-btn:active {
            transform: scale(.95);
        }

        .attach-menu {
            position: absolute;
            bottom: 68px;
            left: 12px;
            background: #141414;
            border: 1px solid rgba(181, 148, 97, .3);
            border-radius: 16px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 99999 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,.6);
            pointer-events: auto !important;
        }

        .attach-menu.show {
            display: flex !important;
        }

        .attach-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 10px;
        }

        .attach-item:hover {
            background: #202020;
        }

        .attach-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a2a2a;
            font-size: 16px;
            pointer-events: none;
        }

        .attach-item span {
            pointer-events: none;
            font-size: 13px;
        }

        .send-box input {
            flex: 1;
            min-width: 0;
            padding: 10px 16px;
            border: 1px solid rgba(181, 148, 97, 0.3);
            outline: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 0.9rem;
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        /* Live Recording Indicator Pill */
        .recording-bar {
            flex: 1;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 9px 16px;
            border-radius: 25px;
            background: rgba(255, 77, 77, 0.12);
            border: 1px solid rgba(255, 77, 77, 0.45);
            color: #fff;
            font-size: 0.84rem;
        }

        .recording-bar.show {
            display: flex;
        }

        .rec-dot {
            width: 10px;
            height: 10px;
            background: var(--accent-red);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: blinkRec 0.9s infinite alternate;
        }

        @keyframes blinkRec {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.3; transform: scale(0.8); }
        }

        /* Recorded Audio Preview Bar (Left Discard, Center Audio Line, Right Send) */
        .audio-preview-bar {
            flex: 1;
            display: none;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            border-radius: 25px;
            background: #1c1915;
            border: 1px solid var(--accent-gold);
        }

        .audio-preview-bar.show {
            display: flex;
        }

        .discard-audio-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255, 77, 77, 0.4);
            background: rgba(255, 77, 77, 0.12);
            color: var(--accent-red);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .discard-audio-btn:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .preview-audio-player {
            flex: 1;
            height: 32px;
            min-width: 0;
            outline: none;
        }

        .send-audio-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;

        .send-btn.recording-active {
            background: var(--accent-red);

        /* FULL SCREEN MEDIA OVERLAY */
        .media-overlay {

<body oncontextmenu="return false;">

    <!-- Hidden Native System Input Channels -->

    <!-- Full-Screen Media Viewer Overlay -->
    <div id="mediaOverlay" class="media-overlay">
        <button class="close-overlay-btn" onclick="closeMediaPreview()">&times;</button>
        <div id="overlayContent" style="width:100%; display:flex; justify-content:center; align-items:center;"></div>

    <!-- Auto-Adjustable Message Info (ⓘ) Popup Modal -->
    <div id="msgInfoModal" class="msg-info-modal-overlay" onclick="closeMsgInfoModal()">
        <div class="msg-info-modal-box" onclick="event.stopPropagation()">
            <div class="msg-info-header">
                <span>📋 Message Info :</span>

                    <span class="msg-info-label">⏱️ Seen Time :</span>
                    <div class="msg-info-val" id="infoSeenTimeVal" style="width: 100%; text-align: left; font-weight: normal; font-size: 0.78rem; color: #ccc;">-</div>
                </div>

        </div>
    </div>

    <script src="https://chat-backend-gtg5.onrender.com/socket.io/socket.io.js"></script>
    <script>
        const $ = id => document.getElementById(id);

        const socket = io("https://chat-backend-gtg5.onrender.com", {
            transports: ["websocket"],
            auth: { token: localStorage.getItem("token") }
        });

        const currentUser = (localStorage.getItem("username") || "guest").toLowerCase();
        let selectedUser = "";
        let typingTimeout;

        // Real-Time Online Users Map (Fast 15-second expiry for instant offline detection)
        let onlineUsersMap = {};
        try {
            onlineUsersMap = JSON.parse(sessionStorage.getItem("privateOnlineUsers") || "{}");
        } catch(e) { onlineUsersMap = {}; }

        // Screenshot & Reload Timers
        let gestureTimer = null;
        let lastScreenshotAlert = 0;
        let backReloadTimer = null;
        let inboxIdleReloadInterval = null;
        let openDropdownUser = null;

        // ==========================================
        // BACKGROUND THEME SWITCHER (Default 3rd Image = Index 2)
        // ==========================================
        const chatBackgrounds = [
            "none",
            "linear-gradient(rgba(10, 10, 10, 0.75), rgba(10, 10, 10, 0.75)), url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1000&q=75')",
            "linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.8)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1000&q=75')", // 3rd Image (Default)
            "linear-gradient(rgba(12, 10, 8, 0.78), rgba(12, 10, 8, 0.78)), url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1000&q=75')"
        ];

        let currentBgIndex = parseInt(localStorage.getItem("privateChatBgIndex") !== null ? localStorage.getItem("privateChatBgIndex") : "2", 10);

        function applyChatBackground(index) {
            const messagesBox = $("messages");
            if (!messagesBox) return;
            messagesBox.style.backgroundImage = chatBackgrounds[index] || chatBackgrounds[2];
        }

        function cycleChatBackground() {
            currentBgIndex = (currentBgIndex + 1) % chatBackgrounds.length;
            localStorage.setItem("privateChatBgIndex", currentBgIndex);
            applyChatBackground(currentBgIndex);
        }

        // ==========================================
        // 1. AUTO-RELOAD TIMERS & INITIALIZATION
        // ==========================================
        function startInboxIdleReloadTimer() {
            clearInterval(inboxIdleReloadInterval);
            inboxIdleReloadInterval = setInterval(() => {
                const isSearchOpen = $("searchBox").style.display === "block" || $("inboxFilterBox").style.display === "block";
                if (!selectedUser && !isSearchOpen && !openDropdownUser) {
                    location.reload();
                }
            }, 10000);
        }

        window.addEventListener("DOMContentLoaded", () => {
            if ($("display-username") && currentUser) {
                $("display-username").innerText = `@${currentUser}`;
            }
            applyChatBackground(currentBgIndex);
            loadInbox();
            const lastOpen = sessionStorage.getItem("activePrivateChat");
            if (lastOpen) {
                openChat(lastOpen);
            } else {
                startInboxIdleReloadTimer();
            }
        });

        // Close attach menu, 3-dot dropdown & unsend tablet when clicking outside
        document.addEventListener("click", function(e) {
            const menu = $("attachMenu");
            const btn = $("attachBtn");
            if (menu && btn && !menu.contains(e.target) && e.target !== btn) {
                menu.classList.remove("show");
            }
            if (!e.target.closest(".inbox-right")) {
                closeAllDropdowns();
            }
            if (!e.target.closest(".unsend-tablet") && !e.target.closest(".info-btn")) {
                document.querySelectorAll(".unsend-tablet.show").forEach(el => el.classList.remove("show"));
            }
        });

        // ==========================================
        // 2. SCREENSHOT ALERT
        // ==========================================
        function sendScreenshotAlert(reason = "Took A ScreenShot Of Chat") {
            const now = Date.now();
            if (!selectedUser || now - lastScreenshotAlert < 2500) return;
            lastScreenshotAlert = now;

            const time = formatAMPM(new Date());
            const alertData = {
                id: "alert_" + now + "_" + Math.random().toString(36).substr(2, 5),
                sender: currentUser,
                receiver: selectedUser,
                text: `@${currentUser} ~ ${reason} • ${time}`,
                time: time,
                type: "alert"
            };
            saveAndRender(alertData);
            socket.emit("private_message", alertData);
        }

        document.addEventListener("touchstart", (e) => {
            if (e.touches.length === 3) {
                gestureTimer = setTimeout(() => sendScreenshotAlert(), 800);
            }
        });

        document.addEventListener("touchend", () => {
            if (gestureTimer) clearTimeout(gestureTimer);
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "PrintScreen" || e.key === "PrtSc") {
                sendScreenshotAlert();
            }
        });

        // ==========================================
        // 3. SEARCH (🔎) & NEW CHAT (+) VALIDATION
        // ==========================================
        function toggleInboxFilter() {
            const filterBox = $("inboxFilterBox");
            const searchBox = $("searchBox");
            searchBox.style.display = "none";

            const isHidden = filterBox.style.display === "none" || filterBox.style.display === "";
            filterBox.style.display = isHidden ? "block" : "none";

            if (isHidden) {
                $("inboxSearchInput").value = "";
                $("inboxSearchInput").focus();
            } else {
                $("inboxSearchInput").value = "";
                loadInbox();
            }
        }

        function toggleSearch() {
            const box = $("searchBox");
            const filterBox = $("inboxFilterBox");
            filterBox.style.display = "none";
            $("inboxSearchInput").value = "";

            const isHidden = box.style.display === "none" || box.style.display === "";
            box.style.display = isHidden ? "block" : "none";
            if (isHidden) {
                usernameInput.value = "";
                usernameStatus.innerHTML = "";
                registerBtn.disabled = true;
                registerBtn.style.opacity = "0.5";
                usernameInput.focus();
            }
        }

        const usernameInput = $("usernameInput");
        const usernameStatus = $("usernameStatus");
        const registerBtn = $("startChatBtn");
        let checkUserTimer;

        usernameInput.addEventListener("input", function(e) {
            let value = e.target.value;

            value = value.toLowerCase();
            value = value.replace(/\s+/g, "_");
            value = value.replace(/[^a-z0-9._]/g, "");
            value = value.slice(0, 20);

            e.target.value = value;

            registerBtn.disabled = true;
            registerBtn.style.opacity = "0.5";

            if (value.length === 0) {
                usernameStatus.innerHTML = "";
                return;
            }

            if (value.length < 3) {
                usernameStatus.style.color = "#ff6b6b";
                usernameStatus.innerHTML = "Username must be at least 3 characters";
                return;
            }

            if (value.length > 20) {
                usernameStatus.style.color = "#ff6b6b";
                usernameStatus.innerHTML = "Username cannot exceed 20 characters";
                return;
            }

            if (
                value.startsWith("_") ||
                value.startsWith(".") ||
                value.endsWith("_") ||
                value.endsWith(".") ||
                value.includes("__") ||
                value.includes("..") ||
                value.includes("_.") ||
                value.includes("._")
            ) {
                usernameStatus.style.color = "#ff6b6b";
                usernameStatus.innerHTML = "❌ Invalid username format";
                return;
            }

            if (value === currentUser) {
                usernameStatus.style.color = "#ff6b6b";
                usernameStatus.innerHTML = "❌ You cannot chat with yourself";
                return;
            }

            usernameStatus.style.color = "#aaa";
            usernameStatus.innerHTML = "Checking user...";

            clearTimeout(checkUserTimer);
            checkUserTimer = setTimeout(async () => {
                try {
                    const res = await fetch("https://chat-backend-gtg5.onrender.com/api/check-username/" + value);
                    const data = await res.json();
                    if (usernameInput.value !== value) return;

                    if (!data.available) {
                        usernameStatus.style.color = "#00d26a";
                        usernameStatus.innerHTML = "✅ Valid User Found";
                        registerBtn.disabled = false;
                        registerBtn.style.opacity = "1";
                    } else {
                        usernameStatus.style.color = "#ff6b6b";
                        usernameStatus.innerHTML = "❌ Username does not exist";
                    }
                } catch {
                    usernameStatus.style.color = "#00d26a";
                    usernameStatus.innerHTML = "✓ Valid username";
                    registerBtn.disabled = false;
                    registerBtn.style.opacity = "1";
                }
            }, 400);
        });

        usernameInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !registerBtn.disabled) {
                e.preventDefault();
                startChat();
            }
        });

        // ==========================================
        // 4. INSTANT ONLINE / OFFLINE PRESENCE ENGINE
        // ==========================================
        // A user is considered online ONLY if we received a heartbeat/pong within the last 14 seconds
        const PRESENCE_TIMEOUT_MS = 14000;

        function setUserOnlineStatus(user, isOnline) {
            if (!user) return;
            const u = user.toLowerCase().trim();
            if (u === currentUser || u === "system") return;

            const wasOnline = isPartnerOnline(u);
            onlineUsersMap[u] = isOnline ? Date.now() : 0;
            sessionStorage.setItem("privateOnlineUsers", JSON.stringify(onlineUsersMap));

            if (isOnline) {
                markMyMessagesDeliveredTo(u);
            }

            if (wasOnline !== isOnline || selectedUser === u) {
                updateHeaderPartnerStatus();
                loadInbox();
            }
        }

        function isPartnerOnline(user) {
            if (!user) return false;
            const u = user.toLowerCase().trim();
            const lastActive = onlineUsersMap[u] || 0;
            return lastActive > 0 && (Date.now() - lastActive < PRESENCE_TIMEOUT_MS);
        }

        function updateHeaderPartnerStatus() {
            const statusEl = $("partner-status");
            if (!statusEl) return;
            if (!selectedUser) {
                statusEl.style.display = "none";
                return;
            }
            const online = isPartnerOnline(selectedUser);
            statusEl.style.display = "inline-block";
            statusEl.className = "user-status-sub " + (online ? "is-online" : "is-offline");
            statusEl.innerText = online ? "● Online" : "○ Offline";
        }

        function pingPartnerPresence(targetUser) {
            if (!targetUser || document.hidden) return;
            socket.emit("private_message", {
                id: "ping_" + Date.now(),
                sender: currentUser,
                receiver: targetUser.toLowerCase(),
                type: "presence_ping",
                text: "__PRESENCE_PING__"
            });
        }

        function broadcastOfflineToAllPartners() {
            const users = JSON.parse(localStorage.getItem("privateUsers")) || [];
            users.forEach(u => {
                socket.emit("private_message", {
                    id: "off_" + Date.now(),
                    sender: currentUser,
                    receiver: u.toLowerCase(),
                    type: "presence_offline",
                    text: "__PRESENCE_OFFLINE__"
                });
            });
        }

        function broadcastOnlineToAllPartners() {
            const users = JSON.parse(localStorage.getItem("privateUsers")) || [];
            users.forEach(u => pingPartnerPresence(u));
        }

        // Fast 5-second heartbeat check to ping active/inbox users & expire offline users immediately
        setInterval(() => {
            if (!document.hidden) {
                if (selectedUser) {
                    pingPartnerPresence(selectedUser);
                } else {
                    broadcastOnlineToAllPartners();
                }
            }
            updateHeaderPartnerStatus();
            if (!openDropdownUser) {
                loadInbox();
            }
        }, 5000);

        // Instant Offline broadcast when user closes tab, navigates away, or locks screen
        window.addEventListener("beforeunload", broadcastOfflineToAllPartners);
        window.addEventListener("pagehide", broadcastOfflineToAllPartners);
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                broadcastOfflineToAllPartners();
            } else {
                broadcastOnlineToAllPartners();
            }
        });

        socket.on("connect", () => {
            socket.emit("userJoined", currentUser);
            broadcastOnlineToAllPartners();
            loadInbox();
        });

        socket.on("updateUserCount", count => {
            $("online-count").innerText = count;
            broadcastOnlineToAllPartners();
        });

        socket.on("onlineUsers", list => {
            if (Array.isArray(list)) {
                Object.keys(onlineUsersMap).forEach(k => onlineUsersMap[k] = 0);
                list.forEach(u => {
                    if (u) onlineUsersMap[String(u).toLowerCase()] = Date.now();
                });
                sessionStorage.setItem("privateOnlineUsers", JSON.stringify(onlineUsersMap));
                updateHeaderPartnerStatus();
                loadInbox();
            }
        });

        function handleTyping() {
            if (!selectedUser) return;
            socket.emit("typing", currentUser);

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit("stopTyping", currentUser);
            }, 1000);
        }

        socket.on("userTyping", username => {
            if (!username) return;
            setUserOnlineStatus(username, true);
            if (username.toLowerCase() !== selectedUser.toLowerCase()) return;
            $("typing-indicator").innerText = " • typing...";
            $("typing-indicator").style.display = "inline-block";
        });

        socket.on("userStopTyping", username => {
            if (!username || username.toLowerCase() === selectedUser.toLowerCase()) {
                $("typing-indicator").style.display = "none";
            }
        });

        // ==========================================
        // 5. INBOX & 3-DOT MENU OPTIONS
        // ==========================================
        function formatAMPM(date) {
            let hours = date.getHours();
            let minutes = date.getMinutes();
            const ampm = hours >= 12 ? "PM" : "AM";
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            return hours + ":" + minutes + " " + ampm;
        }

        function getDisplayTitle(u) {
            const meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            const nick = meta[u]?.nickname;
            return nick ? `${nick} (@${u})` : `@${u}`;
        }

        function startChat() {
            if (registerBtn.disabled) return;
            const u = usernameInput.value.trim();
            if (u) {

                openChat(u);

                chats = chats.filter(c => {
                    const s = (c.sender || "").toLowerCase();
                    const r = (c.receiver || "").toLowerCase();
                    return !((s === currentUser && r === u) || (s === u && r === currentUser));

        function loadInbox() {
            const inbox = $("inboxList");
            if (!inbox) return;
            inbox.innerHTML = "";

            const users = JSON.parse(localStorage.getItem("privateUsers")) || [];
            const meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            const query = ($("inboxSearchInput")?.value || "").trim().toLowerCase();

            users.sort((a, b) => {
                const pinA = meta[a]?.pinned ? 1 : 0;
                const pinB = meta[b]?.pinned ? 1 : 0;
                if (pinA !== pinB) return pinB - pinA;

                const timeA = meta[a]?.lastActivity || 0;
                const timeB = meta[b]?.lastActivity || 0;
                return timeB - timeA;
            });

            users.forEach(u => {
                const info = meta[u] || {};
                const nickname = (info.nickname || "").toLowerCase();

                if (query && !u.includes(query) && !nickname.includes(query)) {
                    return;
                }

                const unread = info.unread || 0;
                const isPinned = !!info.pinned;
                const online = isPartnerOnline(u);

                const dot = unread > 0
                    ? `<span style="width:10px;height:10px;background:#00d26a;border-radius:50%;display:inline-block;margin-right:8px;flex-shrink:0;"></span>`
                    : "";

                const badge = unread > 0
                    ? `<span style="background:#00d26a;color:#000;font-weight:bold;border-radius:20px;padding:2px 8px;font-size:11px;">${unread}</span>`
                    : "";

                const pinIcon = isPinned
                    ? `<span title="Pinned" style="margin-right:6px;font-size:13px;">📌</span>`
                    : "";

                const displayLabel = info.nickname
                    ? `<strong>${escapeHTML(info.nickname)}</strong> <span style="font-size:11px;color:#888;">(@${escapeHTML(u)})</span>`
                    : `<strong>@${escapeHTML(u)}</strong>`;

                const statusTag = `<span class="user-status-sub ${online ? 'is-online' : 'is-offline'}">${online ? '● Online' : '○ Offline'}</span>`;

                const d = document.createElement("div");
                d.className = "inbox" + (selectedUser === u ? " active" : "") + (isPinned ? " pinned-chat" : "");
                d.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div style="display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                            ${dot}
                            ${pinIcon}
                            <div>
                                <div>${displayLabel}</div>
                                ${statusTag}
                            </div>
                        </div>
                        <div class="inbox-right">
                            ${badge}
                            <button class="three-dot-btn" onclick="toggleUserDropdown(event, '${u}')" title="Options">⋮</button>
                            <div class="inbox-dropdown" id="dropdown_${u}">
                                <button class="dropdown-item" onclick="togglePinChat(event, '${u}')">
                                    📌 ${isPinned ? "Unpin Chat" : "Pin Chat"}
                                </button>
                                <button class="dropdown-item" onclick="setChatNickname(event, '${u}')">
                                    ✏️ Set Nickname
                                </button>
                                <button class="dropdown-item" onclick="markChatUnread(event, '${u}')">
                                    🔵 Mark as Unread
                                </button>
                                <button class="dropdown-item" onclick="markChatRead(event, '${u}')">
                                    ✔️ Mark as Read

                                <button class="dropdown-item delete-opt" onclick="deleteUserChat(event, '${u}')">
                                    🗑️ Delete Chat
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                d.onclick = () => openChat(u);
                inbox.appendChild(d);
            });
        }

        async function startVoiceNoteRecording() {
            try {
                activeMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                pendingAudioBase64 = null;

                // Switch UI to Recording Mode
                $("mainSendBtn").classList.add("recording-active");
                $("sendBtnIconWrap").innerHTML = MIC_ICON_SVG;
                $("messageInput").style.display = "none";
                $("audioPreviewBar").classList.remove("show");
                $("recordingBar").classList.add("show");

                recSeconds = 0;
                $("recordingTimer").innerText = "0:00";
                clearInterval(recTimerInterval);
                recTimerInterval = setInterval(() => {
                    recSeconds++;
                    const mins = Math.floor(recSeconds / 60);
                    const secs = recSeconds % 60;
                    $("recordingTimer").innerText = `${mins}:${secs < 10 ? '0' + secs : secs}`;
                }, 1000);

                mediaRecorder = new MediaRecorder(activeMicStream);
                mediaRecorder.ondataavailable = (evt) => {
                    if (evt.data && evt.data.size > 0) {
                        audioChunks.push(evt.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    clearInterval(recTimerInterval);
                    if (activeMicStream) {
                        activeMicStream.getTracks().forEach(t => t.stop());
                        activeMicStream = null;
                    }

                    // Restore Send Button Icon
                    $("mainSendBtn").classList.remove("recording-active");
                    $("sendBtnIconWrap").innerHTML = PAPER_PLANE_SVG;
                    $("recordingBar").classList.remove("show");

                    if (audioChunks.length === 0) {
                        $("messageInput").style.display = "block";
                        return;
                    }

                    const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        pendingAudioBase64 = evt.target.result;
                        // Show Preview Bar (Left Discard, Center Audio Line, Right Send)
                        $("recordedAudioPreview").src = pendingAudioBase64;
                        $("messageInput").style.display = "none";
                        $("mainSendBtn").style.display = "none";
                        $("audioPreviewBar").classList.add("show");
                    };
                    reader.readAsDataURL(audioBlob);
                };

                mediaRecorder.start();
            } catch (err) {
                isVoiceHoldActive = false;
                $("mainSendBtn").classList.remove("recording-active");
                $("sendBtnIconWrap").innerHTML = PAPER_PLANE_SVG;
                $("recordingBar").classList.remove("show");
                $("messageInput").style.display = "block";
                alert("Microphone permission allow karein voice message bhejne ke liye!");
            }
        }

        function stopVoiceNoteRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            } else {
                clearInterval(recTimerInterval);
                if (activeMicStream) {
                    activeMicStream.getTracks().forEach(t => t.stop());
                    activeMicStream = null;
                }
                $("mainSendBtn").classList.remove("recording-active");
                $("sendBtnIconWrap").innerHTML = PAPER_PLANE_SVG;
                $("recordingBar").classList.remove("show");
                $("messageInput").style.display = "block";
            }
        }

            $("audioPreviewBar").classList.remove("show");
            $("messageInput").style.display = "block";

        function setupMediaInputs() {
            const inputs = [
                { id: "cameraInput", mediaType: "image" },
                { id: "galleryInput", mediaType: "image" },
                { id: "videoInput", mediaType: "video" },
                { id: "audioInput", mediaType: "audio" },
                { id: "documentInput", mediaType: "document" }
            ];

            inputs.forEach(item => {
                const el = $(item.id);
                if (!el) return;
                el.addEventListener("change", function(e) {
                    const file = e.target.files[0];
                    if (!file || !selectedUser) return;

                    if (file.size > 10 * 1024 * 1024) {
                        alert("File size 10MB se kam honi chahiye!");
                        e.target.value = "";
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const base64Data = evt.target.result;
                        let detectedType = item.mediaType;
                        if (file.type.startsWith("image/")) detectedType = "image";
                        else if (file.type.startsWith("video/")) detectedType = "video";
                        else if (file.type.startsWith("audio/")) detectedType = "audio";

                        const msgData = {
                            id: "msg_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                            sender: currentUser,
                            receiver: selectedUser,
                            text: file.name,
                            mediaUrl: base64Data,
                            mediaType: detectedType,
                            fileName: file.name,
                            time: formatAMPM(new Date()),
                            delivered: isPartnerOnline(selectedUser),
                            seen: false
                        };

                        saveAndRender(msgData);
                        socket.emit("private_message", msgData);
                    };
                    reader.readAsDataURL(file);
                    e.target.value = "";
                });
            });
        }

        }

        function clearAllChat() {
            if (!selectedUser) {
                alert("Pehle koi chat select karein!");
                return;
            }
            if (confirm(`@${selectedUser} ke sath dono side ki chat clear karein?`)) {
                performLocalClear(selectedUser);

                const clearSignal = {
                    id: "clear_" + Date.now(),
                    sender: currentUser,
                    receiver: selectedUser,
                    text: "__CLEAR_CHAT__",
                    type: "clear_action",
                    time: formatAMPM(new Date())
                };
                socket.emit("private_message", clearSignal);
                socket.emit("clear_private_chat", { sender: currentUser, receiver: selectedUser });
            }
        }

        function saveAndRender(data) {
            if (!data) return;
            const sender = (data.sender || "").toLowerCase();
            const receiver = (data.receiver || "").toLowerCase();

            // Handle Instant Offline Signal first
            if (data.type === "presence_offline" || data.text === "__PRESENCE_OFFLINE__") {
                if (sender !== currentUser) {
                    setUserOnlineStatus(sender, false);
                }
                return;
            }

            if (sender !== currentUser && sender !== "system") {
                setUserOnlineStatus(sender, true);
            }

            if (sender !== currentUser && receiver !== currentUser) return;

            // Handle Presence Ping / Pong
            if (data.type === "presence_ping" || data.text === "__PRESENCE_PING__") {
                if (sender !== currentUser && !document.hidden) {
                    socket.emit("private_message", {
                        id: "pong_" + Date.now(),
                        sender: currentUser,
                        receiver: sender,
                        type: "presence_pong",
                        text: "__PRESENCE_PONG__"
                    });
                }
                return;
            }

            if (data.type === "presence_pong" || data.text === "__PRESENCE_PONG__") {
                if (sender !== currentUser) {
                    setUserOnlineStatus(sender, true);
                }
                return;
            }

            // 1. Handle Both-Side Clear Signal
            if (data.type === "clear_action" || data.text === "__CLEAR_CHAT__") {
                const partner = sender === currentUser ? receiver : sender;
                performLocalClear(partner);
                return;
            }

            // 2. Handle Unsend Signal
            if (data.type === "unsend_action" || data.text === "__UNSEND_MSG__") {
                const targetId = data.targetMsgId;
                if (targetId) {
                    let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
                    chats = chats.filter(c => String(c.id) !== String(targetId));
                    localStorage.setItem("privateChats", JSON.stringify(chats));
                    renderMessages();
                    loadInbox();
                }
                return;
            }

            // 3. Handle Delivered Receipt Signal
            if (data.type === "delivered_receipt" || data.text === "__DELIVERED_RECEIPT__") {
                if (sender !== currentUser) {
                    markMyMessagesDeliveredTo(sender);
                }
                return;
            }

            // 4. Handle Real-time Seen Receipt Signal
            if (data.type === "seen_receipt" || data.text === "__SEEN_RECEIPT__") {
                if (sender !== currentUser) {
                    let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
                    let changed = false;
                    chats.forEach(c => {
                        if ((c.sender || "").toLowerCase() === currentUser && (c.receiver || "").toLowerCase() === sender && !c.seen) {
                            c.seen = true;
                            c.delivered = true;
                            c.seenAt = data.seenAt || formatAMPM(new Date());
                            changed = true;
                        }
                    });
                    if (changed) {
                        localStorage.setItem("privateChats", JSON.stringify(chats));
                        if (selectedUser === sender) renderMessages();
                    }
                }
                return;
            }

            const partner = sender === currentUser ? receiver : sender;
            addInbox(partner);

            let chats = JSON.parse(localStorage.getItem("privateChats")) || [];

            // 5. Duplicate Prevention Check
            if (data.id && chats.some(c => String(c.id) === String(data.id))) {
                return;
            }

            if (sender !== currentUser) {
                if (selectedUser === sender) {
                    data.seen = true;
                    data.delivered = true;
                    data.seenAt = formatAMPM(new Date());
                    socket.emit("private_message", {
                        id: "seen_" + Date.now(),
                        sender: currentUser,
                        receiver: sender,
                        type: "seen_receipt",
                        text: "__SEEN_RECEIPT__",
                        seenAt: data.seenAt
                    });
                } else {
                    data.delivered = true;
                    socket.emit("private_message", {
                        id: "deliv_" + Date.now(),
                        sender: currentUser,
                        receiver: sender,
                        type: "delivered_receipt",
                        text: "__DELIVERED_RECEIPT__"
                    });
                }
            }

            chats.push(data);
            localStorage.setItem("privateChats", JSON.stringify(chats));

            let meta = JSON.parse(localStorage.getItem("privateInboxMeta")) || {};
            if (!meta[partner]) {
                meta[partner] = { unread: 0, lastMessage: "", lastTime: "", lastActivity: 0 };
            }

            meta[partner].lastMessage = data.mediaType ? `📎 ${data.mediaType}` : data.text;
            meta[partner].lastTime = data.time;
            meta[partner].lastActivity = Date.now();

            if (sender !== currentUser && selectedUser !== sender) {
                meta[partner].unread = (meta[partner].unread || 0) + 1;
            }

            localStorage.setItem("privateInboxMeta", JSON.stringify(meta));

            if (selectedUser === sender || selectedUser === receiver) {
                renderMessages();
            }
            loadInbox();
        }

        socket.on("receive_private_message", data => {
            saveAndRender(data);
        });

        socket.on("clear_private_chat", data => {
            if (!data) return;
            const sender = (data.sender || "").toLowerCase();
            const receiver = (data.receiver || "").toLowerCase();
            if (receiver === currentUser || sender === currentUser) {
                const partner = sender === currentUser ? receiver : sender;
                performLocalClear(partner);
            }
        });

        socket.on("private_chat_created", data => {
            if (data && data.username) {
                addInbox(data.username.toLowerCase());
            }
        });

        function escapeHTML(str) {
            const div = document.createElement("div");
            div.textContent = str || "";
            return div.innerHTML;
        }

        function renderMediaContent(m) {
            if (!m.mediaUrl) {
                return `<div>${escapeHTML(m.text)}</div>`;
            }
            if (m.mediaType === "image") {
                return `<img src="${m.mediaUrl}" class="chat-media-img" alt="Image" onclick="openMediaPreview('${m.mediaUrl}', 'image')">`;
            }
            if (m.mediaType === "video") {
                return `<video src="${m.mediaUrl}" class="chat-media-video" controls></video>`;
            }
            if (m.mediaType === "audio") {
                return `<audio src="${m.mediaUrl}" class="chat-media-audio" controls></audio>`;
            }
            return `
                <a href="${m.mediaUrl}" download="${escapeHTML(m.fileName || 'document')}" class="chat-media-doc">
                    <span style="font-size:20px;">📄</span>
                    <span>${escapeHTML(m.fileName || m.text || "Download File")}</span>
                </a>
            `;
        }

        function renderMessages() {
            const b = $("messages");
            b.innerHTML = "";
            if (!selectedUser) return;

            const chats = JSON.parse(localStorage.getItem("privateChats")) || [];

            chats.filter(c => {
                const s = (c.sender || "").toLowerCase();
                const r = (c.receiver || "").toLowerCase();
                return (s === currentUser && r === selectedUser) || (s === selectedUser && r === currentUser);
            }).forEach(m => {
                if (m.type === "alert" || (m.sender && m.sender.toLowerCase() === "system")) {
                    b.insertAdjacentHTML("beforeend", `<div class="screenshot-alert">${escapeHTML(m.text)}</div>`);
                } else {
                    const isMy = (m.sender || "").toLowerCase() === currentUser;
                    const senderName = isMy ? "You" : `@${escapeHTML(m.sender)}`;

                    // 3-Stage Tick Logic: ✓ Sent, ✓✓ Delivered (Grey), ✓✓ Seen (Blue)
                    let tickHtml = "";
                    if (isMy) {
                        if (m.seen) {
                            tickHtml = `<span class="tick-icon seen">✓✓</span>`;
                        } else if (m.delivered || isPartnerOnline(m.receiver)) {
                            tickHtml = `<span class="tick-icon">✓✓</span>`;
                        } else {
                            tickHtml = `<span class="tick-icon">✓</span>`;
                        }
                    } else {
                        tickHtml = `<span class="tick-icon seen">✓✓</span>`;
                    }

                    // Unified Pointer Events on ⓘ button + Floating Unsend Pill above message
                    const infoButtonHtml = isMy ? `
                        <button type="button" class="info-btn" title="Tap: Info | Hold: Unsend"
                            onpointerdown="handleInfoPointerDown(event, '${m.id}')"
                            onpointerup="handleInfoPointerUp(event, '${m.id}')"
                            onpointercancel="handleInfoPointerCancel()">ⓘ</button>
                    ` : "";

                    const unsendFloatingHtml = isMy ? `
                        <div class="unsend-tablet" id="unsend_tab_${m.id}">
                            <button type="button" class="unsend-action-btn" onclick="unsendMessage(event, '${m.id}')">🗑️ Unsend</button>
                        </div>
                    ` : "";

                    b.insertAdjacentHTML("beforeend", `
                        <div class="msg ${isMy ? "my-msg" : "received-msg"}">
                            ${unsendFloatingHtml}
                            <div class="msg-sender">${senderName}</div>
                            ${renderMediaContent(m)}
                            <div class="msg-meta">
                                <span>${m.time}</span>
                                ${tickHtml}
                                ${infoButtonHtml}
                            </div>
                        </div>
                    `);
                }
            });

            b.scrollTop = b.scrollHeight;
        }

        function logout() {
            if (confirm("Confirm to LogOut !!!")) {
                broadcastOfflineToAllPartners();
                localStorage.removeItem("privateChats");
                localStorage.removeItem("privateUsers");
                localStorage.removeItem("privateInboxMeta");
                localStorage.removeItem("token");
                localStorage.removeItem("username");
                sessionStorage.clear();
                localStorage.clear();
                window.location.replace("login.html");
            }
        }
    </script>

    <script src="js/mediaManager.js"></script>
    <script src="js/attachments.js"></script>

    <script>
        // Right Click Block
        document.addEventListener("contextmenu", function(e) {
            e.preventDefault();
        });

        // Text Selection Block (Allowed inside inputs)
        document.addEventListener("selectstart", function(e) {
            if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
                e.preventDefault();
            }
        });

        // Copy / Cut / Drag Block
        document.addEventListener("copy", e => e.preventDefault());
        document.addEventListener("cut", e => e.preventDefault());
        document.addEventListener("dragstart", e => e.preventDefault());
    </script>
</body>
