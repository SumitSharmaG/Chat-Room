    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Private Chat Pro</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        body{background:#0f0f0f;color:white;height:100dvh;overflow:hidden;width:100%;}
        .app{display:flex;height:100dvh;width:100%;position:relative;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;}

        /* SIDEBAR */
        .sidebar{width:320px;background:#121212;border-right:1px solid #222;display:flex;flex-direction:column;flex-shrink:0;}
        .top{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;}
        .top h2{color:#d4af6a;font-size:20px;}
        .home-link{text-decoration:none;font-size:20px;}
        .add-btn{width:35px;height:35px;border:none;border-radius:50%;background:#d4af6a;cursor:pointer;font-weight:bold;font-size:20px;}

        .inbox-list{flex:1;overflow-y:auto;padding:10px;}
        .inbox{background:#1b1b1b;padding:15px;border-radius:12px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center;}
        .inbox.active{border-color:#d4af6a;background:#222;}
        
        /* UNREAD GREEN DOT BADGE */
        .unread-dot {
            width: 10px;
            height: 10px;
            background-color: #25D366;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #25D366;
        }

        /* CHAT AREA */
        .chat-area{flex:1;display:flex;flex-direction:column;background:#0f0f0f;height:100%;}
        .chat-header{padding:10px 15px;background:#151515;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;min-height:65px;}
        .back-btn{display:none;background:none;border:none;color:#d4af6a;font-size:22px;cursor:pointer;}
        #chatTitle{color:#d4af6a;font-weight:bold;font-size:14px;}

        /* MESSAGES */
        .messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;}
        .msg{max-width:85%;padding:10px 12px;border-radius:15px;word-wrap:break-word;font-size:14px;position:relative;}
        .received-msg{background:#1d1d1d;align-self:flex-start;border-bottom-left-radius:2px;}
        .my-msg{background:#d4af6a;color:black;align-self:flex-end;border-bottom-right-radius:2px;}
        
        /* ALERT STYLE */
        .system-alert{background: #f1c40f; color: #000; padding: 5px 12px; border-radius: 8px; font-size: 11px; text-align: center; align-self: center; font-weight: bold; margin: 5px 0;}

        .msg-meta{font-size:9px;display:flex;justify-content:flex-end;align-items:center;margin-top:5px;opacity:0.8;}
        .info-btn{background:none;border:none;color:inherit;font-size:11px;cursor:pointer;margin-left:5px;}

        /* INPUT AREA & ATTACHMENT CONTROLS */
        .send-box{padding:10px;background:#111;border-top:1px solid #222;display:flex;gap:8px;align-items:center;padding-bottom: env(safe-area-inset-bottom, 10px);position:relative;}
        .send-box input{flex:1;padding:12px 15px;border:none;outline:none;border-radius:25px;background:#1d1d1d;color:white;font-size:14px;user-select: text !important;-webkit-user-select: text !important;}
        .send-box button{width:45px;height:45px;border:none;border-radius:50%;background:#d4af6a;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

        .attach-btn {
            width: 45px; height: 45px; border: none; border-radius: 50%;
            background: #202020; color: #d4af6a; font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            pointer-events: auto !important;
        }
        .attach-btn:active { transform: scale(.95); }

        .attach-menu {
            position: fixed; bottom: 82px; left: 340px;
            background: #141414; border: 1px solid rgba(212, 175, 106, 0.3);
            border-radius: 16px; padding: 10px; display: none;
            flex-direction: column; gap: 10px; z-index: 99999 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,.5); pointer-events: auto !important;
        }
        .attach-menu.show { display: flex !important; }

        @media(max-width:768px){
            .sidebar{width:100%;position:absolute;height:100%;z-index:1;}
            .chat-area{width:100%;position:absolute;height:100%;z-index:2;display:none;}
            .back-btn{display:block;}
            .attach-menu { left: 12px; }
        }

        .attach-item {
            display: flex; align-items: center; gap: 10px; color: white;
            cursor: pointer; padding: 8px 12px; border-radius: 10px;
        }
        .attach-item:hover { background: #202020; }
        .attach-icon {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #2a2a2a; font-size: 18px; pointer-events: none;
        }
        .attach-item span { pointer-events: none; }

        .media-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 999999;
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .media-overlay.show { display: flex; opacity: 1; }
        .media-overlay img {
            max-width: 90%; max-height: 80dvh; border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); object-fit: contain;
        }
        .close-overlay-btn {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.1); border: 1px solid #d4af6a;
            color: #d4af6a; font-size: 1.5rem; width: 45px; height: 45px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="app">
        <div class="sidebar" id="sidebar">
            <div class="top">
                <a href="/" class="home-link">🏠</a>
                <h2>Private Chats</h2>
                <button class="add-btn" onclick="toggleSearch()">+</button>
            </div>
            <div id="searchBox" style="display:none; padding:12px;">
                <input type="text" id="usernameInput" placeholder="username" style="width:100%; padding:10px; background:#1d1d1d; color:white; border:1px solid #333; border-radius:8px;">
                <button onclick="startChat()" style="width:100%; margin-top:5px; padding:8px; background:#d4af6a; border:none; border-radius:8px; font-weight:bold;">Start</button>
            </div>
            <div class="inbox-list" id="inboxList"></div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button class="back-btn" onclick="goBack()">←</button>
                    <div><span id="chatTitle">Select Chat</span><br><span id="typing-indicator" style="font-size:10px; color:#d4af6a; display:none;">typing...</span></div>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <span style="font-size:10px;">👁️ <span id="online-count">0</span></span>
                    <button onclick="clearAllChat()" style="color:#ff4d4d; background:none; border:1px solid #ff4d4d; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">Clear</button>
                    <button onclick="logout()" style="color:#d4af6a; background:none; border:1px solid #d4af6a; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">Logout</button>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <div class="send-box">
                <button class="attach-btn" id="attachBtn" onclick="event.stopPropagation(); document.getElementById('attachMenu').classList.toggle('show');">
                    📎
                </button>
                <input type="text" id="messageInput" placeholder="Type message..." oninput="handleTyping()">
                <button onclick="sendMessage()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
            </div>
        </div>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="galleryInput" accept="image/*" hidden>
    <input type="file" id="videoInput" accept="video/*" hidden>
    <input type="file" id="audioInput" accept="audio/*" hidden>
    <input type="file" id="documentInput" accept="*/*" hidden>

    <div class="attach-menu" id="attachMenu">  
        <div class="attach-item" onclick="event.stopPropagation(); document.getElementById('cameraInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
            <div class="attach-icon">📷</div> <span>Camera</span>
        </div>  
        <div class="attach-item" onclick="event.stopPropagation(); document.getElementById('galleryInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
            <div class="attach-icon">🖼️</div> <span>Gallery</span>
        </div>  
        <div class="attach-item" onclick="event.stopPropagation(); document.getElementById('videoInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
            <div class="attach-icon">🎥</div> <span>Video</span>
        </div>  
        <div class="attach-item" onclick="event.stopPropagation(); document.getElementById('audioInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
            <div class="attach-icon">🎵</div> <span>Audio</span>
        </div>  
        <div class="attach-item" onclick="event.stopPropagation(); document.getElementById('documentInput').click(); document.getElementById('attachMenu').classList.remove('show');">  
            <div class="attach-icon">📄</div> <span>Document</span>
        </div>  
    </div>

    <div id="mediaOverlay" class="media-overlay">
        <button class="close-overlay-btn" onclick="document.getElementById('mediaOverlay').classList.remove('show')">&times;</button>
        <div id="overlayContent" style="width:100%; display:flex; justify-content:center; align-items:center;"></div>
    </div>

    <script src="https://chat-backend-gtg5.onrender.com/socket.io/socket.io.js"></script>
    <script src="js/mediaManager.js"></script>
    <script src="js/attachments.js"></script>  
    <script>
        const $ = id => document.getElementById(id);
        const socket = io(
            "https://chat-backend-gtg5.onrender.com",
            {
                transports: ["websocket"],
                auth: {
                    token: localStorage.getItem("token")
                }
            }
        );
        
        window.socket = socket;

        const currentUser = (localStorage.getItem("username") || "guest").replace("@", "");
        let selectedUser = "";
        let typingTimeout;
        const activeTransfers = {};

        // --- Screenshot Alert ---
        document.addEventListener('touchstart', e => {
            if(e.touches.length >= 3 && selectedUser) {
                const time = formatAMPM(new Date());
                const alertData = { sender: "SYSTEM", receiver: selectedUser, text: "⚠️ Security Alert: Someone tried to take a screenshot!", time: time, type: "alert" };
                saveAndRender(alertData);
                socket.emit("private_message", alertData);
            }
        });

        socket.on("connect", () => {
            socket.emit("userJoined", currentUser);
            loadInbox();
        });

        socket.on("updateUserCount", count => {
            const countEl = $("online-count");
            if (countEl) countEl.innerText = count;
        });

        function handleTyping() {
            if (!selectedUser) return;
            socket.emit("typing", currentUser);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit("stopTyping", currentUser);
            }, 1000);
        }

        socket.on("userTyping", username => {
            if (username === currentUser) return;
            $("typing-indicator").innerText = username + " typing...";
            $("typing-indicator").style.display = "block";
        });

        socket.on("userStopTyping", () => {
            $("typing-indicator").style.display = "none";
        });

        function formatAMPM(date) {
            let hours = date.getHours();
            let minutes = date.getMinutes();
            let ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0'+minutes : minutes;
            return (hours < 10 ? '0'+hours : hours) + ':' + minutes + ampm;
        }

        function startChat() {
            const u = $("usernameInput").value.trim().replace("@","");
            if(u) { addInbox(u); openChat(u); $("usernameInput").value = ""; $("searchBox").style.display = "none"; }
        }

        function toggleSearch() { $("searchBox").style.display = ($("searchBox").style.display === "block" ? "none" : "block"); }

        // --- AUTOMATIC INBOX MANAGER ---
        function addInbox(u) {
            if (!u || u === currentUser) return;
            let users = JSON.parse(localStorage.getItem("privateUsers")) || [];
            if(!users.includes(u)) { 
                users.push(u); 
                localStorage.setItem("privateUsers", JSON.stringify(users)); 
                loadInbox(); 
            }
        }

        // --- UNREAD BADGE HELPERS ---
        function setUnreadBadge(u, isUnread) {
            let unreads = JSON.parse(localStorage.getItem("unreadUsers")) || {};
            if (isUnread) unreads[u] = true;
            else delete unreads[u];
            localStorage.setItem("unreadUsers", JSON.stringify(unreads));
            loadInbox();
        }

        function loadInbox() {
            $("inboxList").innerHTML = "";
            const users = JSON.parse(localStorage.getItem("privateUsers")) || [];
            const unreads = JSON.parse(localStorage.getItem("unreadUsers")) || {};

            users.forEach(u => {
                const d = document.createElement("div"); 
                d.className = "inbox" + (selectedUser === u ? " active" : ""); 
                
                const nameSpan = document.createElement("span");
                nameSpan.innerText = "@" + u;
                d.appendChild(nameSpan);

                // Add Green Dot Badge if Unread
                if (unreads[u]) {
                    const dot = document.createElement("span");
                    dot.className = "unread-dot";
                    d.appendChild(dot);
                }

                d.onclick = () => { 
                    window.currentChatUser = u; 
                    window.selectedUser = u; 
                    setUnreadBadge(u, false); // Clear green dot on open
                    openChat(u); 
                }; 
                $("inboxList").appendChild(d);
            });
        }

        function openChat(u) {
            selectedUser = u; 
            window.selectedUser = u; 
            window.currentChatUser = u;
            $("chatTitle").innerText = "@" + u; 
            loadInbox();
            renderMessages();
            if(window.innerWidth <= 768) { $("sidebar").style.display = "none"; $("chatArea").style.display = "flex"; }
            
            if (window.MediaManager && window.MediaManager.restoreHistoryPreviews) {
                window.MediaManager.restoreHistoryPreviews();
            }
        }

        function sendMessage() {
            const txt = $("messageInput").value.trim();
            if(!txt || !selectedUser) return;
            const data = { sender: currentUser, receiver: selectedUser, text: txt, time: formatAMPM(new Date()), id: Date.now() };
            socket.emit("private_message", data);
            saveAndRender(data);
            $("messageInput").value = "";
            $("messageInput").focus();
        }

        function saveAndRender(data) {
            let chats = JSON.parse(localStorage.getItem("privateChats")) || [];
            if (data.fileId && chats.some(c => c.fileId === data.fileId)) return;
            
            chats.push(data);
            localStorage.setItem("privateChats", JSON.stringify(chats));
            if(selectedUser === data.sender || selectedUser === data.receiver) renderMessages();
        }

        // --- REALTIME AUTOMATIC PRIVATE MESSAGE LISTENER ---
        socket.on("receive_private_message", async (data) => {
            const otherUser = (data.sender === currentUser) ? data.receiver : data.sender;
            
            // 1. Automatically create chat index if not present
            addInbox(otherUser);

            // 2. Add Green Dot if user is receiving and chat is not currently open
            if (data.sender !== currentUser && selectedUser !== data.sender) {
                setUnreadBadge(data.sender, true);
            }

            // 3. File Chunk Processing logic
            if (data.fileId && data.chunkData !== undefined) {
                const { fileId, fileName, fileType, totalChunks, chunkIndex, chunkData, sender } = data;

                if (!activeTransfers[fileId]) {
                    activeTransfers[fileId] = { received: 0, chunks: new Array(totalChunks) };
                    if (selectedUser === sender || selectedUser === data.receiver) {
                        window.MediaManager.createBubble(fileId, fileName, fileType, false);
                    }
                    
                    saveAndRender({
                        sender: sender,
                        receiver: currentUser,
                        fileId: fileId,
                        fileName: fileName,
                        fileType: fileType,
                        time: data.time || formatAMPM(new Date())
                    });
                }

                activeTransfers[fileId].chunks[chunkIndex] = chunkData;
                activeTransfers[fileId].received++;

                const percent = Math.round((activeTransfers[fileId].received / totalChunks) * 100);
                const pb = document.getElementById(`pb-${fileId}`);
                const pt = document.getElementById(`pt-${fileId}`);
                if (pb) pb.style.width = percent + "%";
                if (pt) pt.innerText = percent + "%";

                if (activeTransfers[fileId].received === totalChunks) {
                    const st = document.getElementById(`st-${fileId}`);
                    if (st) st.innerText = "Assembling...";
                    
                    const finalBlob = new Blob(activeTransfers[fileId].chunks, { type: fileType });
                    await window.MediaManager.saveToLocalDB(fileId, fileName, fileType, finalBlob);
                    window.MediaManager.renderFinalUI(fileId, fileName, fileType, finalBlob);
                    
                    delete activeTransfers[fileId]; 
                }
            } else {
                saveAndRender(data);
            }
        });

        function renderMessages() {
            const b = $("messages"); b.in
